  function fromHash() {
    const h = location.hash.replace(/^#\/?/, "");
    if (h.startsWith("curso/")) { ui.route = "course"; ui.params = { id: h.slice(6) }; }
    else if (h === "stats") ui.route = "stats";
    else if (h === "ajustes") ui.route = "settings";
    else if (h === "creditos") ui.route = "credits";
    else ui.route = "home";
    if (ui.route === "course" && !E.courses[ui.params.id]) ui.route = "home";
  }
  window.addEventListener("popstate", () => {
    if (ui.session) {
      if (!confirm("¿Salir de la sesión? Se pierde el progreso de esta sesión.")) { history.pushState(null, "", "#/sesion"); return; }
      ui.session = null;
    }
    fromHash(); render();
  });

  function nav(active) {
    const b = (r, ic, label, params) => `<button class="${active === r ? "on" : ""}" data-act="go" data-r="${r}" ${params ? `data-id="${params}"` : ""}>${icon(ic)}<span>${label}</span></button>`;
    return `<nav class="nav" aria-label="Principal"><div class="nav-inner">
      ${b("home", "house", "Inicio")}${b("course", "book-open", "Curso", activeCourse())}
      ${b("stats", "chart-column", "Stats")}${b("settings", "settings", "Ajustes")}</div></nav>`;
  }
  function topbar() {
    const st = shownStreak();
    return `<header class="topbar">
      <div class="logo">${mascot("idle")}efecen</div>
      <div class="chips">
        <span class="chip fire ${st ? "" : "off"}" title="Racha de días">${icon("flame")}${st}</span>
        <span class="chip xp" title="XP total">${icon("star")}${S.xp}</span>
      </div></header>`;
  }

  function render() {
    ui.graphs.clear();
    document.documentElement.toggleAttribute("data-theme", S.settings.theme !== "auto");
    if (S.settings.theme !== "auto") document.documentElement.dataset.theme = S.settings.theme;
    const screens = { home: renderHome, course: renderCourse, stats: renderStats, settings: renderSettings, credits: renderCredits, summary: renderSummary };
    if (ui.route === "session" && ui.session) return;
    (screens[ui.route] || renderHome)();
    window.scrollTo(0, 0);
  }

  // ---------- INICIO ----------
  function ring(value, goal) {
    const r = 26, C = 2 * Math.PI * r, p = Math.min(1, value / goal);
    return `<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${value} de ${goal} XP hoy">
      <circle class="bg" cx="32" cy="32" r="${r}"/>
      <circle class="fg" cx="32" cy="32" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 32 32)"/>
      <text x="32" y="37" text-anchor="middle">${Math.round(p * 100)}%</text></svg>`;
  }
  function renderHome() {
    const cid = activeCourse(), c = course(cid);
    const due = dueConcepts(cid).length, l = currentLesson(cid), xt = xpToday(), goal = S.settings.goal;
    const firstTime = !cState(cid).diag && !c.lessonList.some(x => lessonDone(cid, x));
    let msg;
    const st = shownStreak();
    let mood = "idle";
    if (firstTime) msg = "¡Hola! Soy Schrödi. Hasta que no abras la caja, sabés y no sabés cálculo al mismo tiempo. Hagamos un test cortito para averiguarlo.";
    else if (xt >= goal) { msg = "¡Meta del día cumplida! Si querés, seguí sumando."; mood = "happy"; }
    else if (st >= 2 && S.lastActive !== today()) { msg = `Llevás ${st} días seguidos. ¡No rompas la racha!`; mood = "streak"; }
    else if (due) msg = `Tenés ${due} ${due === 1 ? "concepto" : "conceptos"} para repasar hoy.`;
    else if (l) msg = `Seguimos con «${l.title}».`;
    else msg = "Todo al día. ¡Bien ahí!";
    const parts = [];
    if (due) parts.push(`${Math.min(due, 5)} repasos`);
    if (l) parts.push(`lección: ${l.title}`);
    app.innerHTML = `<main class="screen">
      ${topbar()}
      <section class="hero">${mascot(mood)}<div class="bubble grow">${esc(msg)}</div></section>
      <section class="card goal">${ring(xt, goal)}<div class="grow"><b>Meta diaria</b><div class="muted small">${xt} / ${goal} XP hoy</div></div></section>
      <button class="btn big block" data-act="daily">${icon("play")}${firstTime ? "Empezar" : "Sesión del día"}</button>
      ${parts.length && !firstTime ? `<div class="daily-sub muted small">${esc(parts.join(" · "))}</div>` : ""}
      <h2 class="section-title">Cursos</h2>
      ${E.courseOrder.map(id => {
        const co = course(id), p = courseProgress(id);
        return `<button class="course-card" data-act="go" data-r="course" data-id="${id}">
          <span class="course-ico">${icon(co.icon)}</span>
          <span class="grow"><b>${esc(co.title)}</b><span class="bar" style="margin-top:8px"><i style="width:${p * 100}%"></i></span>
          <span class="muted small">${Math.round(p * 100)}% · ${co.lessonList.length} lecciones</span></span>${icon("chevron-right")}</button>`;
      }).join("")}
      ${UPCOMING.map(u => `<button class="course-card" disabled><span class="course-ico">${icon(u.icon)}</span>
        <span class="grow"><b>${esc(u.title)}</b><span class="muted small" style="display:block">${esc(u.note)}</span></span>${icon("lock")}</button>`).join("")}
    </main>${nav("home")}`;
  }

  // ---------- MAPA DEL CURSO ----------
  function renderCourse() {
    const cid = ui.params.id || activeCourse(), c = course(cid), cs = cState(cid);
    S.activeCourse = cid;
    const cur = currentLesson(cid);
    const showDiag = !cs.diag && !c.lessonList.some(l => lessonDone(cid, l));
    const offs = [0, 46, 70, 46, 0, -46, -70, -46];
    let k = 0;
    const units = c.units.map(u => {
      if (u.comingSoon) return `<section class="unit soon"><div class="unit-head">${icon(u.icon || "lock")}<div><h3>${esc(u.title)}</h3><p>Próximamente</p></div></div></section>`;
      const unl = unitUnlocked(cid, u), done = unitDone(cid, u);
      const nDone = u.lessons.filter(l => lessonDone(cid, l)).length;
      const nodes = u.lessons.map(l => {
        const d = lessonDone(cid, l), un = lessonUnlocked(cid, l), isCur = cur === l;
        const cls = d ? "done" : un ? (isCur ? "current" : "") : "locked";
        const ic = d ? "check" : un ? (isCur ? "star" : "play") : "lock";
        const best = (cs.lessons[l.id] || {}).best;
        return `<div class="node-wrap ${un ? "" : "locked"} ${isCur ? "has-tip" : ""}" style="transform:translateX(${offs[k++ % offs.length]}px)">
          ${isCur ? `<span class="start-tip">EMPEZAR</span>` : ""}
          <button class="node ${cls}" data-act="lesson" data-cid="${cid}" data-id="${l.id}" ${un ? "" : "disabled"} aria-label="${esc(l.title)}">${icon(ic)}</button>
          <span class="node-label">${esc(l.title)}${d && best != null ? `<br><span class="muted small">${(cs.lessons[l.id].tested ? "por diagnóstico" : `mejor: ${Math.round(best * 100)}%`)}</span>` : ""}</span></div>`;
      }).join("");
      return `<section class="unit ${done ? "done" : unl ? "" : "locked"}">
        <div class="unit-head">${icon(done ? "trophy" : unl ? (u.icon || "book-open") : "lock")}<div class="grow"><h3>Unidad ${u.index + 1}: ${esc(u.title)}</h3><p>${nDone}/${u.lessons.length} lecciones${unl ? "" : " · completá la unidad anterior"}</p></div></div>
        ${nodes}</section>`;
    }).join("");
    app.innerHTML = `<main class="screen">
      <div class="map-head"><button class="iconbtn" data-act="go" data-r="home" aria-label="Volver">${icon("chevron-left")}</button>
        <div class="grow"><h1 style="font-size:1.3rem">${esc(c.title)}</h1><div class="bar" style="margin-top:6px"><i style="width:${courseProgress(cid) * 100}%"></i></div></div></div>
      ${showDiag ? `<section class="card diag-card">${mascot("think")}<div class="grow"><b>¿Ya viste estos temas?</b>
        <p class="muted small" style="margin:4px 0 10px">Hacé el test diagnóstico (unos 5 min) y desbloqueá directo las unidades que dominás. Igual vuelven como repaso.</p>
        <div class="row" style="flex-wrap:wrap"><button class="btn sm" data-act="diag" data-cid="${cid}">Hacer el test</button>
        <button class="btn sm ghost" data-act="skipdiag" data-cid="${cid}">Empezar de cero</button></div></div></section>` : ""}
      ${units}
    </main>${nav("course")}`;
  }

  // ---------- SESIÓN: intro de lección ----------
  function renderIntro() {
    const s = ui.session, l = course(s.cid).lessonList.find(x => x.id === s.lessonId);
    app.innerHTML = `<div class="session"><div class="ses-top"><button class="iconbtn" data-act="quit" aria-label="Salir">${icon("x")}</button><div class="bar"><i style="width:0"></i></div></div>
      <div class="center-col">${mascot("wow")}
        <div class="card intro-card"><div class="ses-tag">${icon("lightbulb")}Repaso rápido</div><h3>${esc(l.title)}</h3><div>${tex(l.intro || "")}</div></div>
      </div>
      <div class="ses-foot"><div class="ses-foot-inner"><button class="btn block" data-act="begin">¡Vamos!</button></div></div></div>`;
  }

  // ---------- SESIÓN: ejercicio ----------
  const TYPE_LABEL = { mc: "Elegí la opción correcta", numeric: "Respuesta numérica", tf: "Verdadero o falso", order: "Ordená los pasos", match: "Uní los pares", error: "Encontrá el error" };
  function renderExercise() {
    const s = ui.session, item = s.items[s.i], c = course(s.cid);
    if (!item.inst) item.inst = E.instantiate(c, item.tpl, item.seed);
    const inst = s.inst = item.inst;
    s.phase = "answer"; s.ans = initAns(inst); s.tStart = Date.now();
    const prog = s.i / s.items.length;
    const tag = item.src === "review" ? `<span class="ses-tag review">${icon("rotate-ccw")}Repaso · ${esc(c.concepts[item.focus || c.templates[item.tpl].concepts[0]].name)}</span>`
      : item.src === "diag" ? `<span class="ses-tag">${icon("target")}Diagnóstico · Unidad ${item.unit + 1}</span>`
      : `<span class="ses-tag">${icon("sparkles")}${TYPE_LABEL[inst.type]}</span>`;
    app.innerHTML = `<div class="session">
      <div class="ses-top"><button class="iconbtn" data-act="quit" aria-label="Salir">${icon("x")}</button><div class="bar"><i style="width:${prog * 100}%"></i></div></div>
      <div class="ses-body">${tag}
        <div class="prompt">${tex(inst.prompt)}</div>
        ${inst.graph ? graphHtml(inst.graph) : ""}
        <div id="answer">${answerHtml(inst, s.ans)}</div>
      </div>
      <div class="ses-foot"><div class="ses-foot-inner"><button class="btn block" data-act="check" id="checkBtn" disabled>Comprobar</button></div></div>
      <div class="sheet" id="sheet"></div></div>`;
    drawGraphs();
    updateCheck();
    const ni = $(".numin");
    if (ni && matchMedia("(pointer: fine)").matches) ni.focus();
  }
  function initAns(inst) {
    switch (inst.type) {
      case "order": return { placed: [], order: E.rng(E.newSeed()).shuffle(inst.steps.map((_, i) => i)) };
      case "match": {
        const r = E.rng(E.newSeed());
        return { right: r.shuffle(inst.pairs.map((_, i) => i)), pairs: {}, sel: null };
      }
      default: return { v: null };
    }
  }
  function answerHtml(inst, a, done) {
    const dis = done ? "disabled" : "";
    switch (inst.type) {
      case "mc":
        return `<div class="options">${inst.options.map((o, i) => {
          let cls = a.v === i ? "sel" : "";
          if (done) cls = i === inst.correct ? "right" : a.v === i ? "wrong" : "";
          return `<button class="opt ${cls}" data-act="opt" data-i="${i}" ${dis}><span class="k">${i + 1}</span><span class="ov">${tex(o)}</span></button>`;
        }).join("")}</div>`;
      case "tf":
        return `<div class="tf">${[true, false].map((v, i) => {
          let cls = a.v === v ? "sel" : "";
          if (done) cls = v === inst.answer ? "right" : a.v === v ? "wrong" : "";
          return `<button class="opt ${cls}" data-act="tf" data-v="${v}" ${dis}>${icon(v ? "check" : "x")}${v ? "Verdadero" : "Falso"}</button>`;
        }).join("")}</div>`;
      case "numeric":
        return `<div class="numwrap">
          <input class="numin ${done ? (s_ok() ? "right" : "wrong") : ""}" id="numin" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta" value="${esc(a.v || "")}" ${dis} aria-label="Respuesta">
          <div class="preview" id="preview">${previewText(a.v)}</div>
          ${done ? "" : `<div class="keys">${["π", "√(", "/", "^", "(", ")", "-", "e"].map(k => `<button data-act="key" data-k="${k}" tabindex="-1">${k}</button>`).join("")}</div>`}
          <div class="muted small">Podés escribir fracciones, π, √, e. Se acepta ±1%.</div></div>`;
      case "order": {
        const step = (i, n, act, cls = "") => `<button class="step ${cls}" data-act="${act}" data-i="${i}" ${dis}>${n != null ? `<span class="n">${n}</span>` : ""}<span class="ov">${tex(inst.steps[i])}</span></button>`;
        const placed = a.placed.map((i, k) => step(i, k + 1, "ord-rem", done ? (i === k ? "right" : "wrong") : "")).join("");
        const pool = a.order.filter(i => !a.placed.includes(i)).map(i => step(i, null, "ord-add")).join("");
        return `<div class="steps-ans">${placed}</div><div class="muted small" style="margin:4px 0">${done ? "" : "Pasos disponibles:"}</div><div class="steps-pool">${pool}</div>`;
      }
      case "match": {
        const PC = ["#5B4BDB", "#FF8A1F", "#1FA866", "#E5484D", "#0EA5C6"];
        const pairNo = {};
        Object.entries(a.pairs).forEach(([l, r], k) => { pairNo["L" + l] = k; pairNo["R" + r] = k; });
        const item = (side, i, content) => {
          const key = side + i, p = pairNo[key];
          let cls = a.sel === key ? "sel" : "";
          if (done && side === "L") cls = a.pairs[i] === i ? "right" : "wrong";
          if (done && side === "R") { const l = Object.keys(a.pairs).find(x => a.pairs[x] === i); cls = l != null && +l === i ? "right" : "wrong"; }
          const st = p != null ? `style="--pc:${PC[p % PC.length]}" data-pair="${p}"` : "";
          return `<button class="mitem ${cls}" data-act="m" data-k="${key}" ${st} ${dis}>${p != null ? `<span class="badge">${p + 1}</span>` : ""}${content}</button>`;
        };
        const cont = it => it.graph ? graphHtml(it.graph, "mini") : `<span class="ov">${tex(H.m(it.tex))}</span>`;
        return `<div class="match"><div class="col">${inst.pairs.map((p, i) => item("L", i, cont(p[0]))).join("")}</div>
          <div class="col">${a.right.map(i => item("R", i, cont(inst.pairs[i][1]))).join("")}</div></div>`;
      }
      case "error":
        return `<div class="steps-pool">${inst.steps.map((st, i) => {
          let cls = a.v === i ? "sel" : "";
          if (done) cls = i === inst.wrongIndex ? "right" : a.v === i ? "wrong" : "";
          return `<button class="step ${cls}" data-act="err" data-i="${i}" ${dis}><span class="n">${i + 1}</span><span class="ov">${tex(st)}</span></button>`;
        }).join("")}</div>`;
    }
    return "";
  }
  const s_ok = () => ui.session && ui.session.lastOk;
  function previewText(v) {
    if (!v) return "";
    const x = E.parseNum(v);
    return isFinite(x) ? "= " + H.num(x, 4) : "…";
  }
  function ready(inst, a) {
    switch (inst.type) {
      case "numeric": return isFinite(E.parseNum(a.v));
      case "order": return a.placed.length === inst.steps.length;
      case "match": return Object.keys(a.pairs).length === inst.pairs.length;
      default: return a.v !== null;
    }
  }
  function isCorrect(inst, a) {
    switch (inst.type) {
      case "mc": return a.v === inst.correct;
      case "tf": return a.v === inst.answer;
      case "numeric": return E.checkNumeric(E.parseNum(a.v), inst.answer, inst.tolerance ?? 0.01);
      case "order": return a.placed.every((v, i) => v === i);
      case "match": return inst.pairs.every((_, i) => a.pairs[i] === i);
      case "error": return a.v === inst.wrongIndex;
    }
    return false;
  }
  function updateCheck() {
    const b = $("#checkBtn"), s = ui.session;
    if (b && s && s.phase === "answer") b.disabled = !ready(s.inst, s.ans);
  }
  function rerenderAnswer() {
    const s = ui.session;
    $("#answer").innerHTML = answerHtml(s.inst, s.ans, s.phase !== "answer");
    drawGraphs($("#answer"));
    updateCheck();
  }
  function correctText(inst) {
    switch (inst.type) {
      case "mc": return `Respuesta correcta: ${tex(inst.options[inst.correct])}`;
      case "tf": return `Era <b>${inst.answer ? "Verdadero" : "Falso"}</b>.`;
      case "numeric": return `Respuesta: ${tex("$" + (inst.answerTex || H.num(inst.answer, 4)) + "$")}${inst.answerTex && !Number.isInteger(inst.answer) ? ` ≈ ${H.num(inst.answer, 4)}` : ""}`;
      case "order": return "Mirá el orden correcto en la resolución.";
      case "match": return "Los pares correctos quedaron en verde.";
      case "error": return `El error estaba en el paso ${inst.wrongIndex + 1}. ${tex(inst.fix || "")}`;
    }
    return "";
  }

  function check() {
    const s = ui.session;
    if (!s || s.phase !== "answer" || !ready(s.inst, s.ans)) return;
    const item = s.items[s.i], c = course(s.cid), t = c.templates[item.tpl];
    const ok = isCorrect(s.inst, s.ans);
    const ms = Date.now() - s.tStart;
    s.phase = "feedback"; s.lastOk = ok;
    const first = !item.retry;
    let gain = 0;
    if (first) {
      s.firstN++; if (ok) s.firstOk++;
      if (item.src === "lesson") { s.lessonN++; if (ok) s.lessonOk++; }
      const q = E.srs.grade(ok, ms, t.difficulty);
      for (const k of t.concepts) (s.grades[k] = s.grades[k] || []).push(q);
      S.answered++; if (ok) S.answeredOk++;
      gain = ok ? (item.src === "diag" ? 5 : 10) : 0;
    } else if (ok) gain = 5;
    s.xp += gain;
    // si falló, vuelve al final de la cola con valores nuevos (salvo en el diagnóstico)
    if (!ok && first && item.src !== "diag") s.items.push({ tpl: item.tpl, seed: E.newSeed(), src: item.src, focus: item.focus, retry: true });
    if (item.src === "diag") diagProgress(item, ok);
    Snd.play(ok ? "correct" : "wrong");
    if (!ok && navigator.vibrate) navigator.vibrate(40);
    rerenderAnswer();
    $(".ses-top .bar > i").style.width = ((s.i + 1) / s.items.length * 100) + "%";
    const titles = ok ? ["¡Bien!", "¡Excelente!", "¡Eso!", "¡Joya!", "¡Genial!", "¡Impecable!"] : ["Casi...", "Ojo acá", "Uy, no", "Mmm…"];
    const sol = s.inst.solution || [];
    const sheet = $("#sheet");
    sheet.className = "sheet " + (ok ? "ok" : "bad");
    sheet.innerHTML = `<div class="sheet-inner">
      <div class="fb-head">${mascot(ok ? "happy" : "sad")}<div class="grow"><div class="fb-title">${titles[Math.floor(Math.random() * titles.length)]}</div>
        <div class="fb-quip">${esc(quip(ok ? "ok" : "bad"))}${gain ? ` <span class="xp-pop pop">+${gain} XP</span>` : ""}</div></div></div>
      <div class="fb-scroll">
        ${ok && s.inst.type !== "tf" && s.inst.type !== "error" ? "" : `<div class="fb-answer">${correctText(s.inst)}</div>`}
        ${s.inst.explanation ? `<div>${tex(s.inst.explanation)}</div>` : ""}
        ${sol.length ? `<button class="linkbtn" data-act="sol">${icon("book-open")} ${ok ? "Ver resolución" : "Ocultar resolución"}</button>
        <div class="solution" id="sol" ${ok ? "hidden" : ""}><ol>${sol.map(x => `<li>${tex(x)}</li>`).join("")}</ol></div>` : ""}
      </div>
      <button class="btn block ${ok ? "ok" : "bad"}" data-act="next">Continuar</button></div>`;
    $(".ses-foot").style.visibility = "hidden";
    requestAnimationFrame(() => sheet.classList.add("show"));
  }
  function next() {
    const s = ui.session;
    if (!s) return;
    s.i++;
    if (s.i >= s.items.length) return finish();
    renderExercise();
  }

  // diagnóstico: 3 ejercicios por unidad, aprueba con 2/3, corta en la primera que no aprueba
  function diagProgress(item, ok) {
    const s = ui.session, d = s.diag;
    d.ok = (d.ok || 0) + (ok ? 1 : 0);
    d.n = (d.n || 0) + 1;
    const u = realUnits(course(s.cid))[d.unit];
    if (d.n < (u.diagnostic || []).length) return;
    const pass = d.ok >= Math.ceil(d.n * 2 / 3);
    d.ok = 0; d.n = 0;
    if (pass) {
      d.passed.push(u.index);
      const nextU = realUnits(course(s.cid))[d.unit + 1];
      if (nextU && nextU.lessons.length) { d.unit++; s.items.push(...diagItems(nextU)); }
    }
  }
  function applyDiagnostic(s) {
    const c = course(s.cid), cs = cState(s.cid), t = today();
    const r = E.rng(E.newSeed());
    for (const ui2 of s.diag.passed) {
      const u = c.units[ui2];
      for (const l of u.lessons) {
        cs.lessons[l.id] = Object.assign(cs.lessons[l.id] || {}, { done: true, tested: true, best: 1 });
        for (const k of l.concepts) {
          const key = ckey(s.cid, k);
          const card = S.srs[key] || E.srs.newCard();
          if (!card.last) Object.assign(card, { ef: 2.5, reps: 2, int: 4, due: E.addDays(t, r.int(2, 6)), last: t });
          S.srs[key] = card;
        }
      }
    }
    cs.diag = "done";
  }

  function finish() {
    const s = ui.session, cid = s.cid, cs = cState(cid), t = today();
    // 1) repetición espaciada: una actualización por concepto y por día
    for (const [k, qs] of Object.entries(s.grades)) {
      const key = ckey(cid, k);
      const card = S.srs[key] || E.srs.newCard();
      card.seen += qs.length;
      card.ok += qs.filter(q => q >= 3).length;
      const q = Math.round(qs.reduce((a, b) => a + b, 0) / qs.length);
      S.srs[key] = (card.last === t && s.kind !== "diag") ? card : (s.kind === "diag" ? card : E.srs.update(card, q, t));
    }
    // 2) lección
    let lessonDoneNow = false, lessonAcc = null;
    if (s.lessonId && s.lessonN) {
      const st = cs.lessons[s.lessonId] = cs.lessons[s.lessonId] || {};
      lessonAcc = s.lessonOk / s.lessonN;
      st.plays = (st.plays || 0) + 1;
      st.best = Math.max(st.best || 0, lessonAcc);
      if (lessonAcc >= 0.75 && !st.done) { st.done = true; lessonDoneNow = true; s.xp += 10; if (lessonAcc === 1) s.xp += 5; }
    }
    if (s.kind === "diag") applyDiagnostic(s);
    // 3) XP, racha y registro
    const before = xpToday();
    S.xp += s.xp;
    S.xpByDay[t] = before + s.xp;
    let streakUp = false;
    if (S.lastActive !== t) {
      S.streak = S.lastActive && E.diffDays(S.lastActive, t) === 1 ? S.streak + 1 : 1;
      S.lastActive = t; streakUp = true;
      S.bestStreak = Math.max(S.bestStreak, S.streak);
    }
    const goalHit = before < S.settings.goal && S.xpByDay[t] >= S.settings.goal;
    const lesson = s.lessonId && course(cid).lessonList.find(x => x.id === s.lessonId);
    const title = s.kind === "diag" ? "Test diagnóstico" : s.kind === "practice" ? "Práctica: " + s.title : lesson ? lesson.title : "Repaso";
    S.log.unshift({ d: t, kind: s.kind, title, n: s.firstN, ok: s.firstOk, xp: s.xp, c: cid });
    S.log = S.log.slice(0, 60);
    save();
    ui.summary = { s, lessonDoneNow, lessonAcc, streakUp, goalHit, ms: Date.now() - s.t0 };
    ui.session = null;
    ui.route = "summary";
    history.replaceState(null, "", "#/");
    renderSummary();
    Snd.play(lessonDoneNow || goalHit ? "complete" : streakUp ? "streak" : "complete");
    if (lessonDoneNow || goalHit || (s.kind === "diag" && s.diag.passed.length)) confetti();
  }

  // ---------- RESUMEN ----------
  function renderSummary() {
    const z = ui.summary;
    if (!z) { ui.route = "home"; return render(); }
    const s = z.s, acc = s.firstN ? s.firstOk / s.firstN : 0;
    const mm = Math.floor(z.ms / 60000), ss = Math.floor(z.ms / 1000) % 60;
    let title = "¡Sesión terminada!", sub = "";
    if (s.kind === "diag") {
      const units = s.diag.passed.map(i => course(s.cid).units[i].title);
      title = units.length ? "¡Diagnóstico listo!" : "Arrancamos desde el principio";
      sub = units.length ? `Desbloqueaste: ${units.join(", ")}. Esos temas van a volver como repaso.` : "No pasa nada: así repasás todo con calma, desde la primera lección.";
    } else if (z.lessonDoneNow) { title = "¡Lección completada!"; sub = "Se desbloqueó lo que sigue en el mapa."; }
    else if (z.lessonAcc != null && z.lessonAcc < 0.75) { title = "¡Casi!"; sub = `Para completar la lección necesitás 75% de aciertos al primer intento (sacaste ${Math.round(z.lessonAcc * 100)}%). Repetila cuando quieras.`; }
    // Schrödi: festeja si terminaste la lección, se prende fuego con la racha
    if (!z.mood) {
      const party = z.lessonDoneNow || (s.kind === "diag" && s.diag.passed.length);
      const streak = z.streakUp && S.streak >= 2;
      z.mood = party ? "party" : streak ? "streak" : acc >= 0.6 || s.kind === "diag" ? "happy" : "idle";
      z.quip = party ? quip("party") : streak ? quip("streak", S.streak) : "";
      z.streakQuip = party && streak ? quip("streak", S.streak) : "";
    }
    const extra = [];
    if (z.streakUp) extra.push(`<div class="chip fire pop">${icon("flame")} Racha de ${S.streak} ${S.streak === 1 ? "día" : "días"}</div>`);
    if (z.streakQuip) extra.push(`<p class="muted small" style="width:100%;margin:0">${esc(z.streakQuip)}</p>`);
    if (z.goalHit) extra.push(`<div class="chip xp pop">${icon("target")} ¡Meta diaria cumplida!</div>`);
    app.innerHTML = `<main class="center-col">
      ${mascot(z.mood)}
      <div class="big-title">${esc(title)}</div>
      ${z.quip ? `<div class="bubble">${esc(z.quip)}</div>` : ""}
      ${sub ? `<p class="muted" style="margin:0">${esc(sub)}</p>` : ""}
      <div class="tiles">
        <div class="tile gold"><div class="lab">XP</div><div class="val">${icon("star")}${s.xp}</div></div>
        <div class="tile ok"><div class="lab">Precisión</div><div class="val">${Math.round(acc * 100)}%</div></div>
        <div class="tile"><div class="lab">Tiempo</div><div class="val">${mm}:${String(ss).padStart(2, "0")}</div></div>
      </div>
      <div class="row" style="flex-wrap:wrap;justify-content:center">${extra.join("")}</div>
      <div class="ses-foot"><div class="ses-foot-inner"><button class="btn block" data-act="go" data-r="${s.kind === "lesson" || s.kind === "diag" ? "course" : "home"}" data-id="${s.cid}">Continuar</button></div></div>
    </main>`;
  }

  // ---------- ESTADÍSTICAS ----------
  function renderStats() {
    const cid = activeCourse(), c = course(cid), t = today();
    const acc = S.answered ? Math.round(S.answeredOk / S.answered * 100) : 0;
    // precisión por unidad
    const byUnit = realUnits(c).map(u => {
      let seen = 0, ok = 0;
      for (const l of u.lessons) for (const k of l.concepts) if (c.conceptUnit[k] === u) { const cd = S.srs[ckey(cid, k)]; if (cd) { seen += cd.seen; ok += cd.ok; } }
      return { u, seen, ok };
    });
    const weak = weakConcepts(cid).filter(x => x.card.seen >= 2 && (x.card.ok / x.card.seen < 0.8 || x.card.ef < 2.2)).slice(0, 5);
    const dm = d => { const [, m, dd] = d.split("-"); return d === t ? "hoy" : `${+dd}/${+m}`; };
    // heatmap: 12 semanas, columnas = semanas (lunes arriba)
    const goal = S.settings.goal, cells = [];
    const now = new Date();
    const dow = (now.getDay() + 6) % 7;
    const start = E.addDays(t, -(7 * 11 + dow));
    for (let i = 0; i < 84; i++) {
      const d = E.addDays(start, i), xp = S.xpByDay[d] || 0;
      const lv = xp <= 0 ? 0 : xp < goal / 2 ? 1 : xp < goal ? 2 : xp < goal * 2 ? 3 : 4;
      cells.push(d > t ? `<i class="future"></i>` : `<i data-l="${lv}" data-tip="${d}: ${xp} XP"></i>`);
    }
    const dueTomorrow = Object.entries(S.srs).filter(([k, cd]) => k.startsWith(cid + "/") && cd.due && cd.due > t && cd.due <= E.addDays(t, 1)).length;
    const dueWeek = Object.entries(S.srs).filter(([k, cd]) => k.startsWith(cid + "/") && cd.due && cd.due > t && cd.due <= E.addDays(t, 7)).length;
    const tileS = (ic, color, v, l) => `<div class="stat-tile"><span style="color:${color}">${icon(ic)}</span><div><b>${v}</b><span>${l}</span></div></div>`;
    app.innerHTML = `<main class="screen">
      <h1 style="font-size:1.4rem">Estadísticas</h1>
      <section class="stat-tiles">
        ${tileS("flame", "var(--fire)", shownStreak(), `racha (mejor: ${S.bestStreak})`)}
        ${tileS("star", "var(--gold-d)", S.xp, "XP total")}
        ${tileS("check", "var(--ok)", S.answered, "ejercicios")}
        ${tileS("target", "var(--primary)", acc + "%", "precisión global")}
      </section>
      <section class="card"><h2 class="section-title">Actividad · últimas 12 semanas</h2>
        <div class="heat" style="margin-top:10px">${cells.join("")}</div>
        <div class="heat-legend">menos <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> más</div></section>
      <section class="card"><h2 class="section-title">Precisión por unidad · ${esc(c.title)}</h2>
        <div class="hbar" style="margin-top:10px">${byUnit.map(x => {
          const p = x.seen ? x.ok / x.seen : 0;
          return `<span class="name">${esc(x.u.title)}</span><span class="v">${x.seen ? Math.round(p * 100) + "% · " + x.seen : "sin datos"}</span>
            <span class="bar" data-tip="${esc(x.u.title)}: ${x.ok}/${x.seen} correctas"><i style="width:${p * 100}%"></i></span>`;
        }).join("")}</div></section>
      <section class="card"><h2 class="section-title">Temas débiles</h2>
        ${weak.length ? weak.map(x => `<div class="weak"><div class="grow"><b>${esc(c.concepts[x.k].name)}</b>
          <div class="muted small">${Math.round(x.card.ok / x.card.seen * 100)}% de ${x.card.seen} · próximo repaso ${x.card.due <= t ? "hoy" : dm(x.card.due)}</div></div>
          <button class="btn sm" data-act="practice" data-cid="${cid}" data-k="${x.k}">Practicar</button></div>`).join("")
          : `<p class="muted" style="margin:8px 0 0">${weakConcepts(cid).length ? "¡Ningún tema flojo por ahora! Los que bajen de 80% de acierto van a aparecer acá." : "Todavía no hay datos suficientes. ¡Hacé un par de sesiones!"}</p>`}</section>
      <section class="card"><h2 class="section-title">Repasos programados</h2>
        <p style="margin:8px 0 0"><b>${dueConcepts(cid).length}</b> hoy · <b>${dueTomorrow}</b> mañana · <b>${dueWeek}</b> en los próximos 7 días</p></section>
      <section class="card"><h2 class="section-title">Historial</h2>
        ${S.log.length ? S.log.slice(0, 12).map(l => `<div class="log-row"><span class="grow"><b>${esc(l.title)}</b><br><span class="muted small">${dm(l.d)}</span></span>
          <span style="text-align:right">${l.n ? Math.round(l.ok / l.n * 100) : 0}%<br><span class="muted small">+${l.xp} XP</span></span></div>`).join("")
          : `<p class="muted" style="margin:8px 0 0">Sin sesiones todavía.</p>`}</section>
    </main>${nav("stats")}`;
  }

  // ---------- AJUSTES ----------
  function renderSettings() {
    const st = S.settings;
    const seg = (act, opts, val) => `<div class="seg">${opts.map(([v, l]) => `<button class="${v === val ? "on" : ""}" data-act="${act}" data-v="${v}">${l}</button>`).join("")}</div>`;
    app.innerHTML = `<main class="screen">
      <h1 style="font-size:1.4rem">Ajustes</h1>
      <section class="card">
        <div class="set-row" style="flex-direction:column;align-items:stretch"><div><div class="lbl">Meta diaria</div><div class="desc">XP por día (un ejercicio bien = 10 XP)</div></div>
          ${seg("goal", [[20, "20"], [50, "50"], [100, "100"], [150, "150"]], st.goal)}</div>
        <div class="set-row"><div><div class="lbl">Sonido</div><div class="desc">Efectos al responder</div></div>
          <button class="switch ${st.sound ? "on" : ""}" data-act="sound" role="switch" aria-checked="${st.sound}" aria-label="Sonido"></button></div>
        <div class="set-row" style="flex-direction:column;align-items:stretch"><div class="lbl">Tema</div>
          ${seg("theme", [["auto", "Auto"], ["light", "Claro"], ["dark", "Oscuro"]], st.theme)}</div>
      </section>
      <section class="card">
        <div class="set-row"><div><div class="lbl">Backup</div><div class="desc">Tu progreso vive en este navegador. Exportalo para no perderlo.</div></div></div>
        <div class="row" style="flex-wrap:wrap"><button class="btn sm ghost" data-act="export">${icon("download")}Exportar</button>
          <button class="btn sm ghost" data-act="import">${icon("upload")}Importar</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden></div>
      </section>
      <section class="card">
        ${E.courseOrder.map(id => `<div class="set-row"><div><div class="lbl">${esc(course(id).title)}</div><div class="desc">Volver a hacer el test diagnóstico</div></div>
          <button class="btn sm ghost" data-act="diag" data-cid="${id}">Rehacer</button></div>`).join("")}
        <div class="set-row"><div><div class="lbl">Reiniciar progreso</div><div class="desc">Borra XP, racha y repasos. No se puede deshacer.</div></div>
          <button class="btn sm bad" data-act="reset">Borrar</button></div>
      </section>
      <button class="course-card" data-act="go" data-r="credits"><span class="course-ico">${icon("info")}</span><span class="grow"><b>Créditos</b><span class="muted small" style="display:block">Assets, fuentes y licencias</span></span>${icon("chevron-right")}</button>
      <p class="muted small" style="text-align:center">efecen v${E.version} · hecho para volver a la FCEN</p>
    </main>${nav("settings")}`;
  }
  function renderCredits() {
    app.innerHTML = `<main class="screen">
      <div class="map-head"><button class="iconbtn" data-act="go" data-r="settings" aria-label="Volver">${icon("chevron-left")}</button><h1 style="font-size:1.4rem">Créditos</h1></div>
      <section class="card credits"><ul style="padding-left:1.1em;margin:0">
        <li><b>Sonidos</b>: «Interface Sounds» y «Music Jingles» de <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a> — CC0.</li>
        <li><b>Íconos</b>: <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> — licencia ISC.</li>
        <li><b>Tipografía</b>: <a href="https://fonts.google.com/specimen/Nunito" target="_blank" rel="noopener">Nunito</a> de Vernon Adams y colaboradores — SIL Open Font License 1.1.</li>
        <li><b>Fórmulas</b>: <a href="https://katex.org" target="_blank" rel="noopener">KaTeX</a> — licencia MIT.</li>
        <li><b>Mascota «Schrödi»</b> (el gato de Schrödinger en su caja): diseño original de este proyecto — CC0.</li>
        <li><b>Ejercicios</b>: todos originales y generados por plantillas. El orden del temario sigue la estructura clásica de los cursos de Cálculo de la universidad.</li>
      </ul></section>
    </main>${nav("settings")}`;
  }

  // ---------- backup ----------
  function exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `efecen-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Backup descargado");
  }
  function importData(file) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!E.store.valid(data)) throw new Error("formato");
        if (!confirm("Esto reemplaza tu progreso actual por el del archivo. ¿Seguimos?")) return;
        S = E.store.migrate(data); save(); toast("Progreso importado"); render();
      } catch (e) { toast("El archivo no es un backup válido de efecen"); }
    };
    rd.readAsText(file);
  }

  // ---------- eventos ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const act = el.dataset.act, s = ui.session;
    Snd.init();
    switch (act) {
      case "go": go(el.dataset.r, { id: el.dataset.id }); break;
      case "daily": startDaily(); break;
      case "lesson": startLesson(el.dataset.cid, el.dataset.id); break;
      case "diag": if (el.closest(".screen") && ui.route === "settings" && !confirm("¿Rehacer el diagnóstico? Lo que ya tengas desbloqueado se mantiene.")) break; startDiagnostic(el.dataset.cid); break;
      case "skipdiag": cState(el.dataset.cid).diag = "skipped"; save(); render(); break;
      case "practice": startPractice(el.dataset.cid, el.dataset.k); break;
      case "begin": renderExercise(); break;
      case "quit":
        if (confirm("¿Salir de la sesión? Se pierde el progreso de esta sesión.")) { ui.session = null; history.replaceState(null, "", "#/"); fromHash(); render(); }
        break;
      case "check": check(); break;
      case "next": next(); break;
      case "sol": { const sol = $("#sol"); sol.hidden = !sol.hidden; el.lastChild.textContent = sol.hidden ? " Ver resolución" : " Ocultar resolución"; break; }
      case "opt": if (s && s.phase === "answer") { s.ans.v = +el.dataset.i; Snd.play("tap"); rerenderAnswer(); } break;
      case "tf": if (s && s.phase === "answer") { s.ans.v = el.dataset.v === "true"; Snd.play("tap"); rerenderAnswer(); } break;
      case "err": if (s && s.phase === "answer") { s.ans.v = +el.dataset.i; Snd.play("tap"); rerenderAnswer(); } break;
      case "ord-add": if (s && s.phase === "answer") { s.ans.placed.push(+el.dataset.i); Snd.play("tap"); rerenderAnswer(); } break;
      case "ord-rem": if (s && s.phase === "answer") { s.ans.placed = s.ans.placed.filter(i => i !== +el.dataset.i); rerenderAnswer(); } break;
      case "m": if (s && s.phase === "answer") { matchTap(el.dataset.k); Snd.play("tap"); rerenderAnswer(); } break;
      case "key": {
        const inp = $("#numin");
        const k = el.dataset.k;
        const pos = inp.selectionStart ?? inp.value.length;
        inp.value = inp.value.slice(0, pos) + k + inp.value.slice(inp.selectionEnd ?? pos);
        inp.focus(); inp.setSelectionRange(pos + k.length, pos + k.length);
        inp.dispatchEvent(new Event("input", { bubbles: true }));
        break;
      }
      case "goal": S.settings.goal = +el.dataset.v; save(); render(); break;
      case "theme": S.settings.theme = el.dataset.v; save(); render(); break;
      case "sound": S.settings.sound = !S.settings.sound; save(); render(); if (S.settings.sound) Snd.play("correct"); break;
      case "export": exportData(); break;
      case "import": $("#importFile").click(); break;
      case "reset":
        if (confirm("¿Borrar TODO el progreso?") && confirm("¿Seguro? Esta acción no se puede deshacer.")) { const st = S.settings; S = E.store.defaults(); S.settings = st; save(); toast("Progreso borrado"); go("home"); }
        break;
    }
  });
  function matchTap(key) {
    const a = ui.session.ans, side = key[0], i = +key.slice(1);
    // tocar un elemento ya emparejado lo desarma
    if (side === "L" && a.pairs[i] != null) { delete a.pairs[i]; a.sel = null; return; }
    if (side === "R") { const l = Object.keys(a.pairs).find(x => a.pairs[x] === i); if (l != null) { delete a.pairs[l]; a.sel = null; return; } }
    if (!a.sel || a.sel[0] === side) { a.sel = a.sel === key ? null : key; return; }
    const li = side === "L" ? i : +a.sel.slice(1), ri = side === "R" ? i : +a.sel.slice(1);
    a.pairs[li] = ri; a.sel = null;
  }
  document.addEventListener("input", e => {
    if (e.target.id === "numin" && ui.session) {
      ui.session.ans.v = e.target.value;
      $("#preview").textContent = previewText(e.target.value);
      updateCheck();
    }
  });
  document.addEventListener("change", e => { if (e.target.id === "importFile" && e.target.files[0]) importData(e.target.files[0]); });
  document.addEventListener("keydown", e => {
    const s = ui.session;
    if (!s || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") {
      e.preventDefault();
      if (!s.inst) { renderExercise(); return; }
      if (s.phase === "answer") check(); else next();
      return;
    }
    if (s.phase !== "answer" || e.target.id === "numin") return;
    const n = parseInt(e.key, 10);
    if (s.inst.type === "mc" && n >= 1 && n <= s.inst.options.length) { s.ans.v = n - 1; rerenderAnswer(); }
    else if (s.inst.type === "tf" && (n === 1 || n === 2)) { s.ans.v = n === 1; rerenderAnswer(); }
    else if (s.inst.type === "error" && n >= 1 && n <= s.inst.steps.length) { s.ans.v = n - 1; rerenderAnswer(); }
  });
  // tooltips del heatmap y barras
  let tipEl;
  document.addEventListener("pointerover", e => {
    const el = e.target.closest("[data-tip]");
    if (!el) { if (tipEl) tipEl.remove(), tipEl = null; return; }
    if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
    const r = el.getBoundingClientRect();
    tipEl.textContent = el.dataset.tip;
    tipEl.style.left = r.left + r.width / 2 + "px";
    tipEl.style.top = r.top + "px";
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawGraphs());

  // ---------- arranque ----------
  if (location.hash === "#/sesion") history.replaceState(null, "", "#/");
  fromHash();
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
  }
  // ayuda para desarrollo: efecenDebug.preview("der-cadena-mc", 42) abre esa plantilla
  window.efecenDebug = {
    get state() { return S; }, ui, mascot,
    preview(tpl, seed = E.newSeed(), cid = activeCourse()) { startSession({ kind: "practice", cid, title: "Vista previa", items: [{ tpl, seed, src: "lesson" }] }); }
  };
})();
</script>
</body>

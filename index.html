<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>efecen</title>
<meta name="description" content="Repasá cálculo, física y álgebra lineal jugando, 5-10 minutos por día.">
<meta name="theme-color" content="#5B4BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="efecen">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/schrodi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<style>
@font-face {
  font-family: "Nunito";
  src: url("assets/fonts/nunito-latin-wght.woff2") format("woff2");
  font-weight: 200 1000;
  font-display: swap;
}
:root {
  --bg: #F6F5FB; --card: #FFFFFF; --ink: #1E1B3A; --muted: #6B6890; --line: #E3E1F0;
  --primary: #5B4BDB; --primary-d: #4334B3; --primary-soft: #ECEAFD; --on-primary: #FFFFFF;
  --ok: #1FA866; --ok-d: #15804D; --ok-soft: #E3F7EC;
  --bad: #E5484D; --bad-d: #B8333A; --bad-soft: #FDE8E9;
  --gold: #FFC23D; --gold-d: #E0A21B; --fire: #FF8A1F; --lock: #CFCCE0; --lock-d: #B3AFCB;
  --heat0: #ECEAFD; --heat1: #C9C2F7; --heat2: #9D90EE; --heat3: #7363E3; --heat4: #4A39C2;
  --shadow: 0 1px 2px rgba(30, 27, 58, .06), 0 4px 16px rgba(30, 27, 58, .06);
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13112A; --card: #1E1B3D; --ink: #F0EFFF; --muted: #A3A0C8; --line: #322E5C;
    --primary: #7B6CF0; --primary-d: #5646D0; --primary-soft: #2A2560;
    --ok: #2BC27A; --ok-d: #1C8F58; --ok-soft: #163A2B;
    --bad: #F2626A; --bad-d: #C2414A; --bad-soft: #3F1D26;
    --lock: #3D3966; --lock-d: #2C2950;
    --heat0: #26224A; --heat1: #3B3380; --heat2: #5747B8; --heat3: #7B6CF0; --heat4: #A99FF7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13112A; --card: #1E1B3D; --ink: #F0EFFF; --muted: #A3A0C8; --line: #322E5C;
  --primary: #7B6CF0; --primary-d: #5646D0; --primary-soft: #2A2560;
  --ok: #2BC27A; --ok-d: #1C8F58; --ok-soft: #163A2B;
  --bad: #F2626A; --bad-d: #C2414A; --bad-soft: #3F1D26;
  --lock: #3D3966; --lock-d: #2C2950;
  --heat0: #26224A; --heat1: #3B3380; --heat2: #5747B8; --heat3: #7B6CF0; --heat4: #A99FF7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.ic { width: 1.2em; height: 1.2em; vertical-align: -0.22em; flex: none; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.katex { font-size: 1.08em; }
.km { white-space: nowrap; }
.eq { display: flex; align-items: center; gap: 10px; margin: .7em 0; }
.eq-m { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; text-align: center; scrollbar-width: none; }
.eq-m::-webkit-scrollbar { display: none; }
.eq-m .katex-display { margin: 0; overflow: visible; }
.eq-n { flex: none; color: var(--muted); font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.ov, .katex-display, .solution li { scrollbar-width: none; }
.ov::-webkit-scrollbar, .katex-display::-webkit-scrollbar, .solution li::-webkit-scrollbar { display: none; }
.ov { overflow-y: hidden; padding: 2px 0; }

/* ---------- layout ---------- */
#app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: env(safe-area-inset-top); }
.logo { font-weight: 900; font-size: 1.6rem; letter-spacing: -.02em; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.logo .schrodi { width: 34px; height: 34px; }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
.chip.fire .ic { color: var(--fire); }
.chip.fire.off .ic { color: var(--lock-d); }
.chip.xp .ic { color: var(--gold-d); }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
.section-title { font-size: 1.1rem; font-weight: 900; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.nav button { background: none; border: 0; padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; font-weight: 800; color: var(--muted); }
.nav button .ic { width: 26px; height: 26px; }
.nav button.on { color: var(--primary); }

/* ---------- buttons ---------- */
.btn {
  --b: var(--primary); --bd: var(--primary-d); --fg: var(--on-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--b); color: var(--fg); border: 0; border-radius: 16px;
  padding: 14px 20px; font-weight: 900; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--bd); transition: transform .06s, box-shadow .06s, filter .15s;
  min-height: 52px; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { --b: var(--lock); --bd: var(--lock-d); --fg: var(--muted); cursor: default; }
.btn.block { width: 100%; }
.btn.ok { --b: var(--ok); --bd: var(--ok-d); }
.btn.bad { --b: var(--bad); --bd: var(--bad-d); }
.btn.gold { --b: var(--gold); --bd: var(--gold-d); --fg: #3A2A00; }
.btn.ghost { --b: var(--card); --bd: var(--line); --fg: var(--primary); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: .85rem; border-radius: 12px; }
.btn.big { min-height: 64px; font-size: 1.15rem; }
.linkbtn { background: none; border: 0; color: var(--primary); font-weight: 800; padding: 6px 0; }
.iconbtn { background: none; border: 0; padding: 8px; border-radius: 12px; color: var(--muted); display: inline-flex; }
.iconbtn .ic { width: 26px; height: 26px; }

/* segmented */
.seg { display: flex; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px 6px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow); }
.switch { width: 52px; height: 30px; border-radius: 999px; background: var(--lock); border: 0; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(22px); }

/* ---------- mascota: Schrödi ---------- */
.schrodi { display: block; overflow: visible; }
.schrodi .shadow { fill: currentColor; opacity: .08; }
.schrodi .fur { fill: #ADA5EA; }
.schrodi .fur-s { stroke: #ADA5EA; fill: none; stroke-linecap: round; }
.schrodi .muzzle { fill: #DCD8F8; }
.schrodi .ear-in, .schrodi .nose { fill: #FF8FA8; }
.schrodi .cheek { fill: #FF8FA8; opacity: .5; }
.schrodi .ink { fill: #2A2448; }
.schrodi .inks { stroke: #2A2448; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.schrodi .whisk { stroke: #2A2448; opacity: .3; stroke-width: 1.5; stroke-linecap: round; }
.schrodi .white { fill: #fff; }
.schrodi .box { fill: #FFC23D; }
.schrodi .box-band { fill: #F0AE24; }
.schrodi .flap { fill: #E9A520; }
.schrodi .box-in { fill: #9A6512; }
.schrodi .psi { fill: #C9860F; font: italic 700 26px "Times New Roman", Georgia, serif; }
.schrodi .ghost { fill: none; stroke: #8E85D8; stroke-width: 2.2; stroke-dasharray: 3.5 3; }
.schrodi .hat { fill: #5B4BDB; }
.schrodi .hat-dot, .schrodi .pom { fill: #FFC23D; }
.schrodi .star { fill: #FF8A1F; }
.schrodi .flame { fill: #FF8A1F; } .schrodi .flame-in { fill: #FFC23D; }
.schrodi .drop { fill: #7CC4FF; }
.schrodi [data-m] { display: none; }
.schrodi[data-mood="idle"] [data-m~="idle"], .schrodi[data-mood="think"] [data-m~="think"],
.schrodi[data-mood="wow"] [data-m~="wow"], .schrodi[data-mood="happy"] [data-m~="happy"],
.schrodi[data-mood="sad"] [data-m~="sad"], .schrodi[data-mood="party"] [data-m~="party"],
.schrodi[data-mood="streak"] [data-m~="streak"] { display: inline; }
/* cuánto se asoma de la caja según el estado */
.schrodi { --y: 16px; }
.schrodi[data-mood="wow"] { --y: 10px; }
.schrodi[data-mood="happy"], .schrodi[data-mood="streak"] { --y: 2px; }
.schrodi[data-mood="party"] { --y: -8px; }
.schrodi[data-mood="sad"] { --y: 44px; }
.schrodi .cat { transform: translateY(var(--y)); }
.schrodi[data-mood="idle"] .cat, .schrodi[data-mood="think"] .cat, .schrodi[data-mood="wow"] .cat { animation: sc-peek .8s cubic-bezier(.2,.9,.3,1.15) both; }
.schrodi[data-mood="happy"] .cat, .schrodi[data-mood="streak"] .cat { animation: sc-pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.schrodi[data-mood="sad"] .cat { animation: sc-hide .35s ease-in both; }
.schrodi[data-mood="party"] .cat { animation: sc-jump 1.3s ease-out both; }
.schrodi[data-mood="sad"] .boxg { transform-box: view-box; transform-origin: 60px 112px; animation: sc-wobble .5s .3s ease both; }
.schrodi .ghost { animation: sc-ghost 3.2s ease-in-out infinite; }
.schrodi .eyeA { animation: sc-swap 4s infinite; }
.schrodi .eyeB { animation: sc-swap 4s -2s infinite; }
.schrodi .flameg { transform-box: fill-box; transform-origin: 50% 100%; animation: sc-flicker .7s ease-in-out infinite alternate; }
.schrodi .confetti-bits rect { transform-box: fill-box; transform-origin: center; animation: sc-twinkle 1.2s ease-in-out infinite alternate; }
.schrodi .confetti-bits rect:nth-child(2n) { animation-delay: -.6s; }
.schrodi[data-mood="happy"] { animation: hop .6s ease; }
@keyframes sc-peek { from { transform: translateY(46px); } to { transform: translateY(var(--y)); } }
@keyframes sc-pop { from { transform: translateY(34px); } to { transform: translateY(var(--y)); } }
@keyframes sc-hide { from { transform: translateY(14px); } to { transform: translateY(var(--y)); } }
@keyframes sc-jump { 0% { transform: translateY(46px); } 30% { transform: translateY(-20px); } 50% { transform: translateY(var(--y)); } 70% { transform: translateY(-15px); } 100% { transform: translateY(var(--y)); } }
@keyframes sc-wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } 75% { transform: rotate(-1.5deg); } }
@keyframes sc-ghost { 0%,100% { transform: translate(-7px,-3px); opacity: .25; } 50% { transform: translate(7px,-3px); opacity: .7; } }
@keyframes sc-swap { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes sc-flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.14) rotate(3deg); } }
@keyframes sc-twinkle { from { transform: rotate(0) scale(.7); } to { transform: rotate(90deg) scale(1.1); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-10px); } 65% { transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.fb-quip { font-weight: 700; font-size: .95rem; color: var(--ink); opacity: .85; }
.bubble { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 700; }
.center-col .bubble::before { display: none; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 22px; width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }

/* ---------- home ---------- */
.hero { display: flex; align-items: center; gap: 14px; }
.hero .schrodi { width: 92px; height: 92px; flex: none; }
.goal { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring text { font: 900 15px "Nunito", sans-serif; fill: var(--ink); }
.course-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: 0 3px 0 var(--line); }
.course-card:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.course-card:disabled { opacity: .6; cursor: default; }
.course-ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex: none; }
.course-ico .ic { width: 28px; height: 28px; }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .5s ease; }
.bar.gold > i { background: var(--gold); }
.daily-sub { text-align: center; font-weight: 700; margin-top: -6px; }

/* ---------- course map ---------- */
.map-head { display: flex; align-items: center; gap: 8px; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.unit-head { width: 100%; border-radius: var(--radius); padding: 14px 16px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 var(--primary-d); margin-bottom: 18px; }
.unit-head .ic { width: 30px; height: 30px; }
.unit-head h3 { font-size: 1.1rem; }
.unit-head p { margin: 0; opacity: .9; font-size: .875rem; font-weight: 700; }
.unit.locked .unit-head { background: var(--lock); color: var(--muted); box-shadow: 0 4px 0 var(--lock-d); }
.unit.done .unit-head { background: var(--ok); box-shadow: 0 4px 0 var(--ok-d); }
.unit.soon .unit-head { background: var(--card); color: var(--muted); border: 2px dashed var(--line); box-shadow: none; margin-bottom: 8px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; position: relative; }
.node-wrap.has-tip { margin-top: 30px; }
.node { width: 74px; height: 70px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-d); transition: transform .06s, box-shadow .06s; }
.node .ic { width: 32px; height: 32px; }
.node:active { transform: translateY(6px); box-shadow: 0 0 0 var(--primary-d); }
.node.done { background: var(--gold); color: #3A2A00; box-shadow: 0 6px 0 var(--gold-d); }
.node.locked { background: var(--lock); color: var(--muted); box-shadow: 0 6px 0 var(--lock-d); }
.node.current { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { outline: 0 solid transparent; } 50% { outline: 8px solid var(--primary-soft); } }
.node-label { font-weight: 800; font-size: .85rem; text-align: center; max-width: 170px; }
.node-wrap.locked .node-label { color: var(--muted); }
.start-tip { position: absolute; top: -34px; background: var(--card); color: var(--primary); border: 2px solid var(--line); font-weight: 900; font-size: .75rem; letter-spacing: .06em; padding: 3px 10px; border-radius: 10px; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.node.boss { width: 86px; height: 80px; border-radius: 28px; background: var(--bad); box-shadow: 0 6px 0 var(--bad-d); }
.node.boss .ic { width: 38px; height: 38px; }
.node.boss.won { background: var(--gold); color: #3A2A00; box-shadow: 0 6px 0 var(--gold-d); }
.node.boss.locked { background: var(--lock); color: var(--muted); box-shadow: 0 6px 0 var(--lock-d); }
.lg-list { display: flex; flex-direction: column; gap: 4px; }
.lg-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; }
.lg-row.me { background: var(--primary-soft); }
.lg-row img, .lg-av { width: 36px; height: 36px; border-radius: 50%; flex: none; }
.lg-av { display: grid; place-items: center; background: var(--line); font-weight: 900; }
.lg-pos { width: 26px; text-align: center; font-weight: 900; color: var(--muted); }
.lg-pos.top1 { color: var(--gold-d); } .lg-pos.top2 { color: #8C93A3; } .lg-pos.top3 { color: #B87333; }
.lg-xp { font-weight: 900; }
.lg-gap { text-align: center; color: var(--muted); }
.daily-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; color: inherit; font: inherit; border: 2px solid var(--gold); cursor: pointer; }
.daily-card:disabled { border-color: var(--line); cursor: default; opacity: 1; }
.daily-ico { width: 44px; height: 44px; flex: none; border-radius: 14px; display: grid; place-items: center; background: var(--gold); color: #3A2A00; }
.daily-ico .ic { width: 26px; height: 26px; }
.daily-card .small .ic { width: 14px; height: 14px; color: var(--fire); vertical-align: -2px; }
.games-card { display: flex; flex-direction: column; gap: 8px; }
.games-card > .row .ic { width: 26px; height: 26px; color: var(--fire); }
.game-hud { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius); background: var(--card); border: 2px solid var(--line); }
.game-hud .bar { height: 14px; margin: 4px 0; }
.game-hud .bar > i { background: var(--bad); }
.boss-say { font-style: italic; line-height: 1.25; }
.boss-svg { width: 64px; height: 64px; flex: none; }
.boss-svg.hit { animation: shake .45s; filter: brightness(1.6); }
.boss-svg.atk { animation: lunge .5s; }
@keyframes lunge { 0%,100% { transform: scale(1); } 40% { transform: scale(1.25) translateY(4px); } }
.hearts { display: flex; align-items: center; gap: 2px; color: var(--bad); }
.hearts .ic { width: 20px; height: 20px; fill: currentColor; }
.hearts .off { color: var(--lock); }
.hearts .off .ic { fill: none; }
.combo { margin-left: 8px; font-weight: 900; font-size: .8rem; color: var(--fire); }
.rush-time { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.rush-time.low { color: var(--bad); }
.rush-score { font-size: 1.5rem; font-weight: 900; }
.rush-flash { font-weight: 900; text-align: center; padding: 10px; border-radius: var(--radius); }
.rush-flash.ok { background: var(--ok-soft); color: var(--ok-d); }
.rush-flash.bad { background: var(--bad-soft); color: var(--bad-d); }
.diag-card { display: flex; gap: 12px; align-items: center; }
.diag-card .schrodi { width: 64px; height: 64px; flex: none; }

/* ---------- session ---------- */
.session { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.ses-top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
.ses-top .bar { flex: 1; height: 16px; }
.ses-top .bar > i { background: var(--ok); }
.ses-tag { font-size: .75rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; }
.ses-tag.review { color: var(--fire); }
.ses-body { flex: 1; padding: 8px 16px 200px; display: flex; flex-direction: column; gap: 14px; }
.prompt { font-size: 1.12rem; font-weight: 700; }
.prompt p { margin: .3em 0; }
.ses-foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 2px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 10; }
.ses-foot-inner { max-width: 608px; margin: 0 auto; display: flex; gap: 10px; }
.graph { width: 100%; max-width: 380px; height: 230px; display: block; margin: 0 auto; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
.graph.mini { height: 120px; max-width: none; border-radius: 10px; }

.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 58px;
  box-shadow: 0 3px 0 var(--line); font-weight: 700; transition: transform .06s;
}
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .k { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 900; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.opt.sel .k { border-color: var(--primary); color: var(--primary); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
.opt .ov { overflow-x: auto; min-width: 0; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .opt { justify-content: center; font-size: 1.05rem; font-weight: 900; min-height: 72px; }

.numwrap { display: flex; flex-direction: column; gap: 8px; }
.numin { width: 100%; font: 800 1.35rem "Nunito", sans-serif; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
.numin:focus { border-color: var(--primary); }
.numin.right { border-color: var(--ok); background: var(--ok-soft); }
.numin.wrong { border-color: var(--bad); background: var(--bad-soft); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { min-width: 44px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 800; box-shadow: 0 2px 0 var(--line); }
.preview { min-height: 1.4em; font-weight: 700; color: var(--muted); }

.steps-pool, .steps-ans { display: flex; flex-direction: column; gap: 8px; }
.steps-ans { min-height: 64px; padding: 10px; border: 2px dashed var(--line); border-radius: 16px; }
.steps-ans:empty::before { content: "Tocá los pasos en orden"; color: var(--muted); font-weight: 700; padding: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); font-weight: 600; }
.step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: .8rem; font-weight: 900; display: grid; place-items: center; margin-top: 2px; }
.step .ov { overflow-x: auto; min-width: 0; flex: 1; }
.step.sel { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.step.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.step.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.step:disabled { cursor: default; color: inherit; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.mitem { position: relative; width: 100%; min-height: 64px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mitem .ov { overflow-x: auto; max-width: 100%; }
.mitem.sel { border-color: var(--primary); background: var(--primary-soft); }
.mitem[data-pair] { border-color: var(--pc); box-shadow: 0 3px 0 var(--pc); }
.mitem .badge { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--pc); color: #fff; font-size: .7rem; font-weight: 900; display: grid; place-items: center; }
.mitem.right { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.mitem.wrong { border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.mitem:disabled { cursor: default; color: inherit; }
.mitem canvas { pointer-events: none; border: 0; background: none; }
.mitem:has(canvas) { padding: 4px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.9,.3,1.1); }
.sheet.show { transform: translateY(0); }
.sheet-inner { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; max-height: 78dvh; display: flex; flex-direction: column; gap: 10px; }
.sheet.ok .sheet-inner { background: var(--ok-soft); color: var(--ink); border-top: 3px solid var(--ok); }
.sheet.bad .sheet-inner { background: var(--bad-soft); color: var(--ink); border-top: 3px solid var(--bad); }
.fb-head { display: flex; align-items: center; gap: 12px; }
.fb-head .schrodi { width: 54px; height: 54px; flex: none; }
.fb-title { font-size: 1.35rem; font-weight: 900; }
.sheet.ok .fb-title { color: var(--ok-d); }
.sheet.bad .fb-title { color: var(--bad-d); }
[data-theme="dark"] .sheet.ok .fb-title, [data-theme="dark"] .sheet.bad .fb-title { filter: brightness(1.6); }
.fb-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.fb-answer { font-weight: 700; }
.solution { background: var(--card); border-radius: 14px; padding: 10px 14px; border: 2px solid var(--line); }
.solution ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.solution li { overflow-x: auto; }
.xp-pop { font-weight: 900; color: var(--gold-d); }

/* intro + summary */
.center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 24px 16px calc(120px + env(safe-area-inset-bottom)); }
.center-col .schrodi { width: 120px; height: 120px; }
.intro-card { text-align: left; width: 100%; }
.intro-card h3 { margin-bottom: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.tile { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--card); text-align: center; }
.tile .lab { font-size: .72rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 4px; color: #fff; background: var(--primary); }
.tile .val { font-size: 1.4rem; font-weight: 900; padding: 10px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tile.gold .lab { background: var(--gold-d); }
.tile.ok .lab { background: var(--ok); }
.tile.fire .lab { background: var(--fire); }
.big-title { font-size: 1.7rem; font-weight: 900; }

/* stats */
.stat-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.stat-tile .ic { width: 28px; height: 28px; }
.stat-tile b { font-size: 1.3rem; display: block; line-height: 1.1; }
.stat-tile span { font-size: .8rem; color: var(--muted); font-weight: 700; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.hbar .name { font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .v { font-weight: 800; font-size: .85rem; color: var(--muted); text-align: right; }
.hbar .bar { grid-column: 1 / -1; height: 10px; margin-bottom: 8px; }
.hbar .bar > i { border-radius: 0 4px 4px 0; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--heat0); display: block; }
.heat i[data-l="1"] { background: var(--heat1); } .heat i[data-l="2"] { background: var(--heat2); }
.heat i[data-l="3"] { background: var(--heat3); } .heat i[data-l="4"] { background: var(--heat4); }
.heat i.future { background: transparent; }
.heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; font-size: .75rem; color: var(--muted); font-weight: 700; margin-top: 6px; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.weak { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid var(--line); }
.weak:first-child { border-top: 0; }
.log-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 2px solid var(--line); font-size: .9rem; }
.log-row:first-child { border-top: 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -120%); }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 2px solid var(--line); }
.set-row:first-child { border-top: 0; padding-top: 0; }
.set-row:last-child { padding-bottom: 0; }
.set-row .lbl { font-weight: 800; }
.set-row .desc { font-size: .85rem; color: var(--muted); }
.credits li { margin-bottom: 10px; }
.credits a { color: var(--primary); font-weight: 700; }

/* apuntes (teoría con hipervínculos) */
.term { color: var(--primary); font-weight: 800; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: pointer; border-radius: 4px; }
.term:hover, .term:focus-visible { background: var(--primary-soft); outline: none; }
.learn { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; animation: learnIn .22s ease-out; }
@keyframes learnIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
body.learn-open { overflow: hidden; }
.learn-inner { max-width: 640px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.learn-head { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 0 8px; border-bottom: 2px solid var(--line); }
.learn-crumb { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.learn-hero { display: flex; gap: 12px; align-items: center; }
.learn-hero .schrodi { width: 76px; height: 76px; flex: none; }
.learn-hero h1 { font-size: 1.35rem; }
.learn-hero p { margin: 4px 0 0; }
.lsec { background: var(--card); border: 2px solid var(--line); border-radius: 16px; }
.lsec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-weight: 900; cursor: pointer; }
.lsec > summary::-webkit-details-marker { display: none; }
.lsec > summary .ic { color: var(--primary); }
.lsec > summary .chev { color: var(--muted); transition: transform .2s; }
.lsec[open] > summary .chev { transform: rotate(90deg); }
.lsec-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.para { line-height: 1.6; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.para::-webkit-scrollbar { display: none; }
figure { margin: 4px 0; }
.viz { max-width: 420px; margin: 0 auto; }
.viz-cv { width: 100%; display: block; background: var(--card); border: 2px solid var(--line); border-radius: 14px; touch-action: pan-y; }
.viz-read { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 18px; font-size: .92rem; min-height: 1.4em; margin: 6px 0 2px; }
.viz-ctl { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.viz-sl { display: grid; grid-template-columns: minmax(64px, auto) 1fr 44px; align-items: center; gap: 8px; font-size: .9rem; }
.viz-sl input { width: 100%; accent-color: var(--primary); }
.viz-val { text-align: right; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
.viz-play { align-self: center; }
figcaption { text-align: center; font-size: .85rem; color: var(--muted); margin-top: 6px; }
.fig { display: block; width: 100%; max-width: 320px; margin: 0 auto; color: var(--ink); }
.graph.fig-graph { height: 200px; }
.ex { border-top: 2px solid var(--line); padding-top: 10px; }
.ex:first-child { border-top: 0; padding-top: 0; }
.ex-sol > summary { cursor: pointer; color: var(--primary); font-weight: 800; margin-top: 6px; }
.ex-sol ol { margin: 8px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.learn-see { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.learn-see > div { width: 100%; }
.chip-link { border: 2px solid var(--line); background: var(--card); color: var(--primary); font-weight: 800; font-size: .85rem; padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.learn-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.theory-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.learn-list { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.note-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 0 var(--line); }
.note-row[hidden], .learn-group[hidden] { display: none; }
.note-n { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 900; flex: none; font-size: .85rem; }
.note-n.read { background: var(--ok); color: #fff; }
.notes-link { background: none; border: 0; color: var(--primary); font-weight: 800; font-size: .8rem; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 0 12px; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; font: 700 1rem "Nunito", sans-serif; color: var(--ink); padding: 12px 0; outline: none; }
.search:focus-within { border-color: var(--primary); }

/* carrera */
.subj-code { display: inline-block; font-weight: 900; font-size: .72rem; letter-spacing: .04em; background: var(--primary-soft); color: var(--primary); padding: 2px 8px; border-radius: 8px; }
.subj-badge { display: inline-block; margin-left: 6px; font-weight: 900; font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; background: var(--gold); color: #3A2A00; padding: 2px 8px; border-radius: 8px; }
.subj-badge.on { background: var(--ok); color: #fff; }
.subj-step { margin-left: 6px; font-size: .72rem; font-weight: 800; color: var(--muted); }
.sem-label { font-size: .8rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -4px; }
.year { display: flex; flex-direction: column; gap: 10px; }
.unit-prog { margin: 0 0 2px !important; font-size: .78rem !important; font-weight: 800; opacity: .85; }
.unit-test { margin-top: 8px; }
.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.picker button { border: 2px solid var(--line); background: var(--card); color: var(--muted); font-weight: 900; font-size: .8rem; padding: 6px 12px; border-radius: 999px; }
.picker button.on { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* toast + confetti */
.login-ask { position: fixed; inset: 0; z-index: 55; background: rgba(20, 16, 40, .55); display: grid; place-items: end center; padding: 16px; animation: fadeIn .2s ease-out; }
.login-box { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 22px 20px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.login-box .schrodi { width: 96px; height: 96px; }
.login-box h2 { font-size: 1.3rem; margin: 0; }
.login-box p { margin: 0 0 6px; }
@media (min-width: 700px) { .login-ask { place-items: center; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -150%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 800; z-index: 60; transition: transform .3s; max-width: calc(100% - 32px); }
#toast.show { transform: translate(-50%, 0); }
#toast:not(.show) { transform: translate(-50%, calc(-100% - 24px - env(safe-area-inset-top))); }
.confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 70; pointer-events: none; animation: fall linear forwards; border-radius: 2px; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(720deg); } }
.shake { animation: shake .4s ease; }
.pop { animation: popin .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

@media (min-width: 720px) {
  .screen { padding-top: 24px; }
  .prompt { font-size: 1.2rem; }
  .graph { height: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* ---------- evaluaciones ---------- */
.exams-card { display: flex; flex-direction: column; gap: 8px; }
.exams-card > .row .ic { width: 26px; height: 26px; color: var(--primary); }
.exam-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.exam-best { font-weight: 900; font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 2px solid var(--line); white-space: nowrap; }
.exam-best.pass { background: var(--ok-soft); color: var(--ok-d); border-color: var(--ok); }
.exam-best.fail { background: var(--bad-soft); color: var(--bad-d); border-color: var(--bad); }
.exam-rules { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.exam-timer { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-variant-numeric: tabular-nums; padding: 4px 12px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
.exam-timer.low { color: var(--bad); border-color: var(--bad); }
.exam-nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.exam-nav button { min-width: 44px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: .85rem; color: var(--muted); }
.exam-nav button.done { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-soft); }
.exam-nav button.on { border-color: var(--primary); color: var(--primary); }
.self-note { display: flex; gap: 10px; align-items: flex-start; }
.self-note > .ic { width: 26px; height: 26px; color: var(--primary); }
.rv { display: flex; flex-direction: column; gap: 4px; }
.rv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rv-pts { font-weight: 900; font-size: .85rem; color: var(--muted); }
.rv-pts.ok { color: var(--ok-d); } .rv-pts.bad { color: var(--bad-d); }
.rv-prompt { font-size: .92rem; color: var(--muted); }
.rv-total { display: flex; align-items: center; gap: 10px; }
.rv-score { font-size: 2rem; font-weight: 900; }
.rub { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 6px; font-size: .92rem; }
.rub .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--lock-d); flex: none; display: grid; place-items: center; color: var(--on-primary); }
.rub.on { border-color: var(--ok); background: var(--ok-soft); }
.rub.on .box { background: var(--ok); border-color: var(--ok); }
.ok-ic { color: var(--ok); } .bad-ic { color: var(--bad); }

/* ---------- pizarra (board.js) ---------- */
.board { --board-paper: #FFFFFF; --board-rule: #DCE3F0; --board-margin: #F3B3B6;
  position: fixed; inset: 0; z-index: 46; background: var(--bg); display: none; flex-direction: column; }
:root[data-theme="dark"] .board { --board-paper: #1A1836; --board-rule: #2E2B57; --board-margin: #6B3446; }
@media (prefers-color-scheme: dark) { :root:not([data-theme]) .board { --board-paper: #1A1836; --board-rule: #2E2B57; --board-margin: #6B3446; } }
.board.show { display: flex; }
.board.docked { left: auto; width: 50vw; border-left: 2px solid var(--line); }
body.board-docked #app { max-width: min(640px, 50vw); margin-left: max(0px, calc(25vw - 320px)); margin-right: auto; }
body.board-docked .nav, body.board-docked .ses-foot, body.board-docked .sheet, body.board-docked .learn { right: 50vw; }
body.board-full { overflow: hidden; }
.board.split { top: auto; height: 50dvh; border-top: 2px solid var(--line); }
.board.split .board-bar { padding-top: 6px; }
body.board-split { padding-bottom: 50dvh; }
body.board-split .nav, body.board-split .ses-foot, body.board-split .sheet, body.board-split .learn { bottom: 50dvh; }
body.board-split .ses-foot { padding-bottom: 14px; }
body.board-split .nav { padding-bottom: 0; }
.board-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: calc(6px + env(safe-area-inset-top)) 8px 6px; background: var(--card); border-bottom: 2px solid var(--line); }
.bgrp { display: flex; align-items: center; gap: 2px; }
.board-bar button { background: none; border: 0; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); padding: 0; }
.board-bar button .ic { width: 22px; height: 22px; }
.board-bar button.on { background: var(--primary-soft); color: var(--primary); }
.board-bar button:disabled { opacity: .35; cursor: default; }
.board-bar .bcolor { width: 32px; }
.bcolor i { width: 20px; height: 20px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.bcolor.on { background: none !important; }
.bcolor.on i { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary); }
.board-bar .bsize { width: 32px; }
.bsize i { width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; display: block; }
.bpage-n { min-width: 40px; text-align: center; font-weight: 800; font-size: .85rem; color: var(--muted); }
.bclose { margin-left: auto; }
.board-prompt { background: var(--card); border-bottom: 2px solid var(--line); }
.bprompt-h { border: 0; background: none; color: var(--ink); display: flex; width: 100%; justify-content: flex-start; align-items: center; gap: 6px; padding: 8px 12px; font-weight: 800; font-size: .85rem; }
.bprompt-h .ic:last-child { width: 18px; height: 18px; transition: transform .15s; }
.board-prompt.open .bprompt-h .ic:last-child { transform: rotate(90deg); }
.bprompt-body { display: none; max-height: 28dvh; overflow-y: auto; padding: 0 14px 10px; }
.board-prompt.open .bprompt-body { display: block; }
.board-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.board-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bc-live { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.board-hint { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 10px; font-weight: 800; font-size: .85rem; pointer-events: none; }
.board-btn { color: var(--primary); }
.board-btn.on { background: var(--primary-soft); }
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/katex/katex.min.js"></script>

<!-- ================= MOTOR (lógica pura, sin DOM) ================= -->
<script id="engine">
(function (root) {
  "use strict";
  const E = root.Efecen = { version: "0.1.0", courses: {}, courseOrder: [] };

  // ---------- RNG con semilla (mulberry32) ----------
  E.rng = function (seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const r = {
      seed, next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      nz: (lo, hi) => { let v; do v = r.int(lo, hi); while (v === 0); return v; },
      pick: arr => arr[Math.floor(next() * arr.length)],
      bool: (p = 0.5) => next() < p,
      sign: () => (next() < 0.5 ? -1 : 1),
      shuffle: arr => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; },
      sample: (arr, n) => r.shuffle(arr).slice(0, n),
      distinct: (n, lo, hi, opts = {}) => {
        const out = [];
        let guard = 0;
        while (out.length < n && guard++ < 1000) {
          const v = r.int(lo, hi);
          if (opts.nonzero && v === 0) continue;
          if (opts.exclude && opts.exclude.includes(v)) continue;
          if (!out.includes(v)) out.push(v);
        }
        return out;
      }
    };
    return r;
  };
  E.newSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---------- Helpers para escribir LaTeX ----------
  // métodos del lápiz `g` de las figuras interactivas (bloques `viz` de los apuntes; los dibuja la UI)
  E.VIZ_API = ["grid", "axes", "fn", "curve", "line", "arrow", "dot", "circle", "rect", "poly", "text", "px"];
  const H = E.H = {};
  H.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  // fracción reducida en LaTeX
  H.frac = (p, q) => {
    if (q === 0) return "\\text{indef.}";
    if (q < 0) { p = -p; q = -q; }
    const g = H.gcd(p, q); p /= g; q /= g;
    if (q === 1) return String(p);
    return (p < 0 ? "-" : "") + `\\frac{${Math.abs(p)}}{${q}}`;
  };
  // número "lindo": entero si lo es, si no hasta d decimales
  H.num = (x, d = 3) => {
    if (!isFinite(x)) return x > 0 ? "\\infty" : "-\\infty";
    const r = Math.round(x);
    if (Math.abs(x - r) < 1e-9) return String(r === 0 ? 0 : r);
    const s = String(+x.toFixed(d));
    return s === "-0" ? "0" : s;
  };
  H.m = s => `$\\displaystyle ${s}$`;
  H.xp = (n, v = "x") => (n === 0 ? "" : n === 1 ? v : `${v}^{${n}}`);
  // término con signo: term(-3,"x^{2}",false) -> " - 3x^{2}"
  H.term = (c, mono, first) => {
    if (c === 0) return "";
    const sign = c < 0 ? "-" : first ? "" : "+";
    const a = Math.abs(c);
    const body = mono ? (a === 1 ? mono : a + mono) : String(a);
    return first ? sign + body : ` ${sign} ${body}`;
  };
  // poly([[3,"x^{2}"],[-1,"x"],[5,""]]) -> "3x^{2} - x + 5"
  H.poly = terms => {
    let out = "", first = true;
    for (const [c, mono] of terms) {
      if (c === 0) continue;
      out += H.term(c, mono, first);
      first = false;
    }
    return out || "0";
  };
  // coeficientes de mayor a menor grado
  H.polyc = (coeffs, v = "x") => H.poly(coeffs.map((c, i) => [c, H.xp(coeffs.length - 1 - i, v)]));
  H.peval = (coeffs, x) => coeffs.reduce((acc, c) => acc * x + c, 0);
  // sustitución visible: psub([6,-4,1], 2) -> "6\cdot 2^{2} - 4\cdot 2 + 1"
  H.psub = (coeffs, v) => {
    const deg = coeffs.length - 1, pv = v < 0 ? `(${v})` : String(v);
    let out = "", first = true;
    coeffs.forEach((c, i) => {
      const k = deg - i;
      if (c === 0) return;
      const a = Math.abs(c), sign = c < 0 ? "-" : first ? "" : "+";
      const body = k === 0 ? String(a) : (a === 1 ? "" : a + "\\cdot ") + pv + (k > 1 ? `^{${k}}` : "");
      out += first ? sign + body : ` ${sign} ${body}`;
      first = false;
    });
    return out || "0";
  };
  // "x - 3", "x + 2", "x"
  H.xm = (r, v = "x") => (r === 0 ? v : r > 0 ? `${v} - ${r}` : `${v} + ${-r}`);
  // coeficiente delante de un paréntesis: 1 -> "", -1 -> "-"
  H.cf = c => (c === 1 ? "" : c === -1 ? "-" : String(c));
  H.kx = (k, v = "x") => (k === 1 ? v : k === -1 ? "-" + v : k + v);
  // número entre paréntesis si es negativo (para sustituciones)
  H.par = v => (typeof v === "number" && v < 0 ? `(${H.num(v)})` : typeof v === "number" ? H.num(v) : v);
  // " + 3" / " - 3"
  H.sg = v => (v < 0 ? ` - ${H.num(-v)}` : ` + ${H.num(v)}`);
  H.angles = [
    { v: Math.PI / 6, t: "\\frac{\\pi}{6}" }, { v: Math.PI / 4, t: "\\frac{\\pi}{4}" },
    { v: Math.PI / 3, t: "\\frac{\\pi}{3}" }, { v: Math.PI / 2, t: "\\frac{\\pi}{2}" }
  ];
  // armar opción múltiple: dedup + completar con fallbacks + mezclar
  H.mc = (r, correct, distractors, opts = {}) => {
    const seen = new Set([correct]);
    const ds = [];
    for (const d of [...distractors, ...(opts.fallback || [])]) {
      if (ds.length >= (opts.n || 4) - 1) break;
      if (d != null && !seen.has(d)) { seen.add(d); ds.push(d); }
    }
    const raw = opts.keepOrder ? [correct, ...ds] : r.shuffle([correct, ...ds]);
    const options = opts.text ? raw : raw.map(H.m);
    return { options, correct: raw.indexOf(correct) };
  };

  // ---------- Parser numérico seguro (sin eval) ----------
  const NAMES = ["sqrt", "exp", "sin", "cos", "tan", "ln", "log", "pi", "e"];
  const FN = { sqrt: Math.sqrt, ln: Math.log, log: Math.log10, sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp };
  E.parseNum = function (src) {
    if (src == null) return NaN;
    // notación científica: 1,3E-5, 1,3e7 (e pegada a un dígito y seguida de dígitos) y 1,3 x 10^7; «2e» sola sigue siendo 2·e
    let s = String(src).trim().replace(/(\d)\s*[xX×·*]\s*10\s*\^/g, "$1*10^").replace(/(\d)E([+-]?\d+)/g, "$1*10^($2)").replace(/(\d)e(\d+)/g, "$1*10^($2)").toLowerCase()
      .replace(/,/g, ".").replace(/π/g, "pi").replace(/√/g, "sqrt")
      .replace(/[·×]/g, "*").replace(/[−–]/g, "-").replace(/\s+/g, "");
    if (!s) return NaN;
    const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    if (open > 0) s += ")".repeat(open);
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      const num = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
      if (num) { toks.push({ t: "n", v: parseFloat(num[1]) }); i += num[1].length; continue; }
      if ("+-*/^()".includes(ch)) { toks.push({ t: ch }); i++; continue; }
      const name = NAMES.find(n => s.startsWith(n, i));
      if (name) { toks.push({ t: "id", v: name }); i += name.length; continue; }
      return NaN;
    }
    let k = 0;
    const eat = t => (toks[k] && toks[k].t === t ? (k++, true) : false);
    const expr = () => { let v = term(); for (;;) { if (eat("+")) v += term(); else if (eat("-")) v -= term(); else return v; } };
    const term = () => {
      let v = unary();
      for (;;) {
        if (eat("*")) v *= unary();
        else if (eat("/")) v /= unary();
        else { const p = toks[k]; if (p && (p.t === "n" || p.t === "id" || p.t === "(")) v *= power(); else return v; }
      }
    };
    const unary = () => (eat("-") ? -unary() : eat("+") ? unary() : power());
    const power = () => { const b = atom(); return eat("^") ? Math.pow(b, unary()) : b; };
    const atom = () => {
      const p = toks[k++];
      if (!p) throw 0;
      if (p.t === "n") return p.v;
      if (p.t === "(") { const v = expr(); if (!eat(")")) throw 0; return v; }
      if (p.t === "id") {
        if (p.v === "pi") return Math.PI;
        if (p.v === "e") return Math.E;
        return FN[p.v](power());
      }
      throw 0;
    };
    try { const v = expr(); return k === toks.length ? v : NaN; } catch (e) { return NaN; }
  };
  // ¿la respuesta numérica es correcta? tolerancia relativa, o redondeo a 2 decimales
  E.checkNumeric = function (user, answer, tol = 0.01) {
    if (!isFinite(user)) return false;
    const diff = Math.abs(user - answer);
    if (diff <= tol * Math.abs(answer) + 1e-9) return true;
    if (Math.abs(user - Math.round(answer * 100) / 100) < 1e-9) return true;
    return Math.abs(answer) < 1e-9 && Math.abs(user) < 1e-6;
  };

  // ---------- Fechas (siempre en hora local) ----------
  const pad = n => String(n).padStart(2, "0");
  E.fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  E.today = () => E.fmtDate(new Date());
  // la meta diaria es fija para todos (como en la liga compiten todos con las mismas reglas)
  E.DAILY_GOAL = 50;
  // liga semanal: la semana va de lunes a domingo; se identifica por la fecha de su lunes
  E.weekStart = str => { const [y, m, d] = str.split("-").map(Number), wd = (new Date(y, m - 1, d).getDay() + 6) % 7; return E.addDays(str, -wd); };
  E.weekXp = (s, date) => { const w = E.weekStart(date); let t = 0; for (let i = 0; i < 7; i++) t += s.xpByDay[E.addDays(w, i)] || 0; return t; };
  // nombre que se muestra en la liga: el primer nombre y la inicial del apellido
  E.leagueName = full => { const p = String(full || "").trim().split(/\s+/).filter(Boolean); return !p.length ? "Anónimo" : (p[0] + (p[1] ? " " + p[1][0].toUpperCase() + "." : "")).slice(0, 40); };
  E.addDays = (str, n) => { const [y, m, d] = str.split("-").map(Number); return E.fmtDate(new Date(y, m - 1, d + n)); };
  E.diffDays = (a, b) => { const [y1, m1, d1] = a.split("-").map(Number); const [y2, m2, d2] = b.split("-").map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };

  // ---------- Repetición espaciada (SM-2 simplificado, por concepto) ----------
  E.srs = {
    newCard: () => ({ ef: 2.5, int: 0, reps: 0, due: null, last: null, seen: 0, ok: 0 }),
    // nota 0-5 a partir del desempeño (sin autoevaluación)
    grade(ok, ms, difficulty = 1) {
      if (!ok) return 1;
      const s = ms / 1000 / difficulty;
      return s < 25 ? 5 : s < 70 ? 4 : 3;
    },
    update(card, q, today) {
      const c = Object.assign(E.srs.newCard(), card);
      if (q < 3) { c.reps = 0; c.int = 1; }
      else {
        c.reps += 1;
        c.int = c.reps === 1 ? 1 : c.reps === 2 ? 3 : Math.max(1, Math.round(c.int * c.ef));
      }
      c.ef = Math.max(1.3, +(c.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)).toFixed(3));
      c.due = E.addDays(today, c.int);
      c.last = today;
      return c;
    }
  };

  // ---------- Registro de cursos ----------
  // ---------- Registro de materias (una materia = un curso) ----------
  // Cada archivo de materia llama una vez a E.registerCourse y después a E.extendCourse por
  // cada unidad (conceptos, plantillas, lecciones y apuntes). Así se agrega contenido de a una unidad.
  E.cards = {};      // id -> ficha de apuntes (ids únicos entre materias)
  E.termIndex = [];  // [{ alias, id }] para el autolink
  E.career = null;
  E.registerCareer = def => { E.career = def; };
  E.registerCourse = function (c) {
    c.concepts = c.concepts || {};
    c.templates = c.templates || {};
    c.units = c.units || [];
    c.theory = { cards: {}, lessons: {} };
    E.courses[c.id] = c;
    if (!E.courseOrder.includes(c.id)) E.courseOrder.push(c.id);
    indexCourse(c);
    return c;
  };
  E.extendCourse = function (cid, ext) {
    const c = E.courses[cid];
    if (!c) throw new Error("Materia no registrada: " + cid);
    Object.assign(c.concepts, ext.concepts || {});
    Object.assign(c.templates, ext.templates || {});
    for (const u of ext.units || []) {
      const i = c.units.findIndex(x => x.id === u.id);
      if (i >= 0) c.units[i] = u; else c.units.push(u);
    }
    const defGroup = ext.units && ext.units.length === 1 ? ext.units[0].id : null;
    for (const [id, card] of Object.entries(ext.cards || {})) {
      card.id = id; card.course = cid; card.group = card.group || defGroup;
      c.theory.cards[id] = card;
      E.cards[id] = card;
      for (const a of card.aliases || []) E.termIndex.push({ alias: a.toLowerCase(), id });
    }
    Object.assign(c.theory.lessons, ext.lessons || {});
    E._termRe = null;
    indexCourse(c);
  };
  // figuras interactivas para fichas que ya existen: { "id-ficha": [bloque, …] }. Cada bloque va al final de la
  // sección `sec` (por defecto «La idea»).
  E.addFigures = function (cid, figs) {
    for (const [id, list] of Object.entries(figs)) {
      const card = E.cards[id];
      if (!card || card.course !== cid) throw new Error(`Ficha inexistente en ${cid}: ${id}`);
      for (const b of list) { const sec = b.sec || "idea"; (card[sec] = card[sec] || []).push(b); }
    }
  };
  // compatibilidad con el formato anterior de apuntes
  E.registerTheory = (cid, th) => E.extendCourse(cid, { cards: th.cards, lessons: th.lessons });
  function indexCourse(c) {
    c.units.sort((a, b) => (a.order || 0) - (b.order || 0));
    c.tplLesson = {}; c.conceptUnit = {}; c.lessonList = [];
    for (const [id, t] of Object.entries(c.templates)) t.id = id;
    c.units.forEach((u, ui) => {
      u.index = ui;
      u.lessons = u.lessons || [];
      u.lessons.forEach((l, li) => {
        l.unit = u; l.index = li;
        l.concepts = [...new Set(l.templates.flatMap(t => (c.templates[t] ? c.templates[t].concepts : [])))];
        l.templates.forEach(t => { c.tplLesson[t] = l; });
        l.concepts.forEach(k => { if (!c.conceptUnit[k]) c.conceptUnit[k] = u; });
        l.theory = c.theory.lessons[l.id] || l.theory || [];
        c.lessonList.push(l);
      });
    });
    // concepto -> fichas, priorizando el orden en que aparecen en las lecciones
    c.conceptCards = {};
    const order = [...new Set([...c.lessonList.flatMap(l => l.theory), ...Object.keys(c.theory.cards)])];
    for (const id of order) {
      const card = c.theory.cards[id];
      if (card) for (const k of card.concepts || []) (c.conceptCards[k] = c.conceptCards[k] || []).push(id);
    }
  }
  // test de una unidad: las plantillas declaradas o, si no hay, una de cada lección (las más difíciles)
  E.unitDiagnostic = function (c, u) {
    if (u.diagnostic && u.diagnostic.length) return u.diagnostic;
    const ls = u.lessons;
    const pick = ls.length <= 3 ? ls : [ls[0], ls[Math.floor(ls.length / 2)], ls[ls.length - 1]];
    return pick.map(l => l.templates.slice().sort((a, b) => c.templates[b].difficulty - c.templates[a].difficulty)[0]);
  };
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  E.termRegex = () => E._termRe || (E._termRe = E.termIndex.length
    ? new RegExp(`(?<![\\p{L}\\p{N}])(${E.termIndex.map(t => t.alias).sort((a, b) => b.length - a.length).map(escRe).join("|")})(?![\\p{L}\\p{N}])`, "giu")
    : null);
  // Convierte un trozo de texto (sin LaTeX) en HTML: [[id|texto]] -> link, **negrita**,
  // y si ctx.auto, los términos conocidos -> link (una vez por ficha y por bloque).
  E.linkText = function (text, ctx = {}) {
    const seen = ctx.seen || new Set();
    const link = (id, label) => `<a class="term" role="link" tabindex="0" data-act="learn" data-id="${id}">${label}</a>`;
    let out = String(text)
      .replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/g, (m, id, label) => {
        const card = E.cards[id];
        if (!card) return label || id;
        seen.add(id);
        return link(id, label || card.title);
      })
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const re = ctx.auto && E.termRegex();
    if (!re) return out;
    let inA = false;
    return out.split(/(<[^>]+>)/).map(piece => {
      if (piece.startsWith("<")) { if (/^<a\b/.test(piece)) inA = true; else if (/^<\/a>/.test(piece)) inA = false; return piece; }
      if (inA) return piece;
      return piece.replace(re, m => {
        const t = E.termIndex.find(x => x.alias === m.toLowerCase());
        if (!t || seen.has(t.id) || t.id === ctx.exclude) return m;
        seen.add(t.id);
        return link(t.id, m);
      });
    }).join("");
  };

  // genera una instancia reproducible de una plantilla
  E.instantiate = function (course, tplId, seed) {
    const t = course.templates[tplId];
    for (let tries = 0; tries < 30; tries++) {
      const inst = t.generate(E.rng(seed + tries * 7919), H);
      if (inst) { inst.type = inst.type || t.type; return inst; }
    }
    throw new Error("No se pudo generar " + tplId);
  };

  // ---------- evaluaciones: parciales y finales simulados ----------
  // E.exams[cid] = { self: { id: { concepts, generate(r, H, args) → { prompt, rubric: [{ text, w }], solution } } }, list: [examen] }
  // examen: { id, kind: "parcial" | "final", title, topics, minutes, pass, items: [{ title, parts: [parte] }] }
  // parte: { pts, tpl } (plantilla fija), { pts, pick: [...] } (una al azar), { pts, self, args } (de desarrollo,
  // autocorregida) o { pts, any: [alternativas] }: en cada intento se sortea una de las alternativas (cada una es
  // una parte sin pts), así un mismo examen puede traer ejercicios distintos, como pasa de un año a otro.
  // Las plantillas de nivel examen (corrección automática, con verify) van en `templates` y se buscan ahí si la
  // materia no tiene una con ese id.
  E.exams = {};
  E.registerExams = function (cid, def) {
    const prev = E.exams[cid] || { self: {}, templates: {}, list: [] };
    E.exams[cid] = { self: Object.assign(prev.self, def.self), templates: Object.assign(prev.templates, def.templates), list: prev.list.concat(def.exams || []) };
  };
  E.examTemplate = (cid, id) => (E.courses[cid].templates[id] || (E.exams[cid] && E.exams[cid].templates[id]));
  E.instantiateExam = function (cid, id, seed) {
    const t = E.examTemplate(cid, id);
    return E.instantiate({ templates: { [id]: t } }, id, seed);
  };
  E.instantiateSelf = function (cid, id, seed, args) {
    const g = E.exams[cid].self[id];
    for (let tries = 0; tries < 30; tries++) {
      const o = g.generate(E.rng(seed + tries * 7919), H, args);
      if (o) return Object.assign({ type: "self", concepts: g.concepts || [] }, o);
    }
    throw new Error("No se pudo generar " + id);
  };
  // reparte los puntos de una parte entre los criterios de la rúbrica (en medios puntos, sumando exacto)
  E.rubricPoints = function (rubric, pts) {
    const W = rubric.reduce((t, x) => t + x.w, 0);
    let acc = 0;
    return rubric.map((x, i) => {
      if (i === rubric.length - 1) return pts - acc;
      const v = Math.round(pts * x.w / W * 2) / 2;
      acc += v;
      return v;
    });
  };
  // arma un intento: cada parte con su plantilla (sorteada si hay varias) y su semilla
  E.buildExam = function (cid, examId, seed) {
    const ex = E.exams[cid].list.find(e => e.id === examId), r = E.rng(seed), parts = [];
    // un ítem también puede ser { any: [ítems] }: se sortea el ejercicio entero (todas las alternativas valen lo mismo)
    const items = ex.items.map(it => (it.any ? r.pick(it.any) : it));
    items.forEach((it, i) => it.parts.forEach((p0, j) => {
      const p = p0.any ? r.pick(p0.any) : p0;
      parts.push({
        item: i, label: it.parts.length > 1 ? `${i + 1}.${j + 1}` : `${i + 1}`, pts: p0.pts,
        tpl: p.tpl || (p.pick ? r.pick(p.pick) : null), self: p.self || null, args: p.args || null, seed: r.int(1, 1e9)
      });
    }));
    return { exam: Object.assign({}, ex, { items }), parts };
  };

  // ---------- Ejercicio del día ----------
  // Sale de las lecciones ya completadas y es el mismo todo el día (la semilla es la fecha).
  // Se queda con las plantillas más exigentes que tengas: dificultad 3 si hay al menos 3, si no 2 y 3.
  // `cands` es una lista de { cid, tpl, difficulty, type } en un orden fijo.
  E.dailySeed = date => { let h = 2166136261; for (const ch of "efecen-dia-" + date) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0; return h % 1e9 + 1; };
  E.dailyPick = (cands, date) => {
    const ok = cands.filter(c => c.type !== "tf" && c.difficulty >= 2);
    if (!ok.length) return null;
    const hard = ok.filter(c => c.difficulty >= 3), pool = hard.length >= 3 ? hard : ok;
    const r = E.rng(E.dailySeed(date));
    return Object.assign({ seed: r.int(1, 1e9) }, r.pick(pool));
  };

  // ---------- Estado persistente ----------
  E.store = {
    key: "efecen:v1",
    defaults: () => ({
      app: "efecen", version: 1,
      settings: { goal: 50, sound: true, theme: "auto", league: true },
      xp: 0, streak: 0, bestStreak: 0, lastActive: null,
      xpByDay: {}, activeCourse: null,
      courses: {}, srs: {}, log: [], answered: 0, answeredOk: 0, read: {},
      exams: {}, // "m101/p1" -> { best, attempts: [{ d, t, score }] } (los más nuevos primero)
      daily: {} // ejercicio del día: "2026-10-15" -> { cid, tpl, ok }
    }),
    migrate(s) {
      const d = E.store.defaults();
      for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
      s.settings = Object.assign(d.settings, s.settings);
      // materias renombradas al pasar a "la carrera" (calculo -> m101)
      for (const [o, n] of Object.entries(E.store.renamed)) {
        if (s.courses[o] && !s.courses[n]) s.courses[n] = s.courses[o];
        delete s.courses[o];
        for (const k of Object.keys(s.srs)) if (k.startsWith(o + "/")) { s.srs[n + k.slice(o.length)] = s.srs[k]; delete s.srs[k]; }
        if (s.activeCourse === o) s.activeCourse = n;
        for (const l of s.log) if (l.c === o) l.c = n;
      }
      return s;
    },
    renamed: { calculo: "m101" },
    valid: s => !!s && typeof s === "object" && s.app === "efecen" && typeof s.version === "number" && typeof s.srs === "object" && typeof s.courses === "object",
    load() {
      try {
        const raw = localStorage.getItem(E.store.key);
        if (!raw) return E.store.defaults();
        const s = JSON.parse(raw);
        return E.store.valid(s) ? E.store.migrate(s) : E.store.defaults();
      } catch (e) { return E.store.defaults(); }
    },
    save(s) { try { localStorage.setItem(E.store.key, JSON.stringify(s)); return true; } catch (e) { return false; } },
    // combina el progreso de dos dispositivos sin perder nada: todo lo acumulable se queda con el máximo
    // o la unión, y lo "de estado" (ajustes, materia activa, racha) se toma del más reciente.
    // Es idempotente y conmutativo en lo acumulable, así que sincronizar dos veces no cambia nada.
    merge(a, b) {
      a = E.store.migrate(JSON.parse(JSON.stringify(a))); b = E.store.migrate(JSON.parse(JSON.stringify(b)));
      const newer = (b.lastActive || "") > (a.lastActive || "") ? b : a, older = newer === a ? b : a;
      const out = JSON.parse(JSON.stringify(newer));
      const max = (x, y) => Math.max(x || 0, y || 0);
      out.xp = max(a.xp, b.xp); out.answered = max(a.answered, b.answered); out.answeredOk = max(a.answeredOk, b.answeredOk);
      out.bestStreak = max(a.bestStreak, b.bestStreak);
      if (a.lastActive === b.lastActive) out.streak = max(a.streak, b.streak);
      out.activeCourse = newer.activeCourse || older.activeCourse;
      for (const [d, x] of Object.entries(older.xpByDay)) out.xpByDay[d] = max(out.xpByDay[d], x);
      for (const id of Object.keys(older.read)) out.read[id] = true;
      // tarjetas de repaso: la que más se practicó (a igualdad, la de repaso más reciente)
      for (const [k, c] of Object.entries(older.srs)) {
        const o = out.srs[k];
        if (!o || c.seen > o.seen || (c.seen === o.seen && (c.last || "") > (o.last || ""))) out.srs[k] = c;
      }
      for (const [cid, oc] of Object.entries(older.courses)) {
        const st = out.courses[cid] = out.courses[cid] || { lessons: {}, diag: null };
        st.lessons = st.lessons || {}; st.unitsOpen = Object.assign({}, oc.unitsOpen || {}, st.unitsOpen || {});
        st.diag = st.diag || oc.diag || null;
        // juegos: un jefe vencido en algún dispositivo queda vencido; el récord del contrarreloj, el máximo
        if (oc.bosses) {
          st.bosses = st.bosses || {};
          for (const [uid, ob] of Object.entries(oc.bosses)) {
            const b = st.bosses[uid] = st.bosses[uid] || {};
            b.won = !!(b.won || ob.won); b.wins = max(b.wins, ob.wins);
          }
        }
        if (st.rush || oc.rush) st.rush = max(st.rush, oc.rush);
        for (const [lid, ol] of Object.entries(oc.lessons || {})) {
          const l = st.lessons[lid] = st.lessons[lid] || {};
          l.done = !!(l.done || ol.done); l.plays = max(l.plays, ol.plays); l.best = max(l.best, ol.best);
        }
      }
      for (const st of Object.values(out.courses)) { st.lessons = st.lessons || {}; st.unitsOpen = st.unitsOpen || {}; if (st.diag === undefined) st.diag = null; }
      // evaluaciones: la unión de los intentos (sin repetir) y la mejor nota
      for (const [k, oe] of Object.entries(older.exams)) {
        const e = out.exams[k] = out.exams[k] || { best: 0, attempts: [] }, have = new Set(e.attempts.map(x => x.t));
        e.best = max(e.best, oe.best);
        e.attempts = e.attempts.concat((oe.attempts || []).filter(x => !have.has(x.t))).sort((x, y) => y.t - x.t).slice(0, 30);
      }
      // ejercicio del día: si se resolvió bien en algún dispositivo, cuenta como resuelto
      for (const [d, od] of Object.entries(older.daily)) {
        const x = out.daily[d];
        if (!x || (od.ok && !x.ok)) out.daily[d] = od;
      }
      const seen = new Set();
      out.log = a.log.concat(b.log).filter(l => { const k = JSON.stringify(l); return seen.has(k) ? false : seen.add(k); })
        .sort((x, y) => (y.d > x.d ? 1 : y.d < x.d ? -1 : 0)).slice(0, 60);
      return out;
    }
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script id="app-script">
(function () {
  "use strict";
  const E = window.Efecen, H = E.H;

  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const app = $("#app");
  let S = E.store.load();
  const ui = { route: "home", params: {}, session: null, summary: null, graphs: new Map(), viz: new Map() };
  const save = () => { const okSave = E.store.save(S); if (E.sync) E.sync.changed(); return okSave; };
  const today = () => E.today();

  E.syncHooks = {
    get: () => S,

  };


  // ---------- utilidades de render ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="assets/icons/sprite.svg#i-${n}"/></svg>`;
  const kcache = new Map();
  function K(m, display) {
    const key = (display ? "D" : "I") + m;
    if (!kcache.has(key)) {
      let html;
      try { html = window.katex ? katex.renderToString(m, { displayMode: display, throwOnError: false, strict: false }) : esc(m); }
      catch (e) { html = esc(m); }
      kcache.set(key, html);
    }
    return kcache.get(key);
  }
  // texto con $...$ (inline) y $$...$$ (display). El contenido es propio y confiable.
  // Fuera del LaTeX: [[id|texto]] es un link a los apuntes y **negrita**; con { auto: true }
  // además se linkean solos los términos conocidos (ver E.linkText).
  function tex(s, opts) {
    if (s == null) return "";
    const ctx = Object.assign({ seen: new Set() }, opts);
    // la negrita puede envolver fórmulas, así que se resuelve antes de separar el LaTeX
    return String(s).replace(/\*\*([\s\S]+?)\*\*/g, "<b>$1</b>").split(/(\$\$[^$]+\$\$|\$[^$]+\$)/g).map(p => {
      if (p.startsWith("$$") && p.length > 4) return eqHtml(p.slice(2, -2), ctx.eq);
      if (p.startsWith("$") && p.length > 2) {
        const m = p.slice(1, -1);
        // en los apuntes, una fórmula larga en el medio del texto se corta mal: pasa a su propio renglón, centrada
        return ctx.eq && longInline(m) ? eqHtml(m, ctx.eq) : `<span class="km">${K(m, false)}</span>`;
      }
      return E.linkText(p, ctx);
    }).join("");
  }
  const texL = s => tex(s, { auto: true });
  // fórmulas destacadas: centradas y, en los apuntes (eq = contador de la ficha), numeradas (1), (2)… para poder citarlas
  function eqHtml(m, eq) {
    if (!eq) return K(m, true);
    return `<div class="eq"><div class="eq-m" data-tex="${esc(m)}">${K(m, true)}</div><span class="eq-n">(${++eq.n})</span></div>`;
  }
  // si una fórmula numerada no entra en el ancho, se achica (hasta 60 %) en vez de cortarse; las details cerradas
  // se ajustan al abrirse
  // Primero intenta partirla en renglones alineados en cada «=» (o ≤, ≈…) de primer nivel; si un lado sigue
  // siendo largo, también lo corta antes de cada «+» o «−» de primer nivel, como se hace a mano.
  const vlen = m => m.replace(/\\(left|right|big|Big|bigg|,|;|!|quad|qquad|displaystyle|dfrac|tfrac|frac|text)/g, "").replace(/\\[a-zA-Z]+/g, "x").replace(/[{}^_\s]/g, "").length;
  function topSplit(m, re) {
    const parts = [];
    let depth = 0, last = 0;
    for (let i = 0; i < m.length; i++) {
      const ch = m[i];
      if (ch === "\\" && (m[i + 1] === "{" || m[i + 1] === "}")) { i++; continue; }
      if (ch === "\\" && /^\\(left|right|big|Big|bigg|Bigg)l?(?![a-zA-Z])/.test(m.slice(i))) {
        const w = /^\\(left|right|big|Big|bigg|Bigg)l?/.exec(m.slice(i))[0];
        if (w === "\\left" || /^\\[bB]igg?l$/.test(w)) depth++; else if (w === "\\right" || /^\\[bB]igg?r/.test(m.slice(i))) depth--;

      }

      else if (ch === "}" || ch === ")" || ch === "]") depth--;

  }
  const REL = /^(=|<|>|\\(?:leq?|geq?|approx|Rightarrow|Longrightarrow|iff|equiv|neq)(?![a-zA-Z]))/;
  function splitEq(m, terms, alone, max = 22) {
    const rows = [];

    const chunk = seg => {
      if (!terms || vlen(seg) <= max - 4) return [seg];
      const out = [];
      let cur = "";
      for (const t of topSplit(seg, /^[+-]/)) { if (cur && vlen(cur + t) > max) { out.push(cur); cur = t; } else cur += t; }
      if (cur) out.push(cur);
      return out;
    };
    for (const piece of topSplit(m, /^,?\s*\\qquad(?![a-zA-Z])/).map(x => x.replace(/^,?\s*\\qquad/, ""))) {
      const segs = topSplit(piece, REL), start = rows.length;
      segs.forEach((seg, j) => chunk(seg).forEach((c, k) => {
        if (j === 0) rows.push(k === 0 ? c : "&\\quad " + c);
        // el primer signo queda en el mismo renglón que el lado izquierdo, y es el punto de alineación
        else if (j === 1 && k === 0 && rows.length === start + 1 && !alone) rows[start] += " &" + c;
        else if (j === 1 && k === 0 && rows.length === start + 1) { rows[start] += " &"; rows.push("&" + c); }
        else rows.push(k === 0 ? "&" + c : "&\\quad " + c);
      }));

          if (!alt) continue;

          if (ratio() >= 0.85) break;
        }

      if (r < 1) m.style.fontSize = Math.max(0.6, r * 0.98) + "em";
    }

  }

  window.addEventListener("resize", () => { clearTimeout(fitEqs.t); fitEqs.t = setTimeout(() => fitEqs(document), 150); });
  // largo «visual» aproximado de una fórmula: cada comando cuenta como un símbolo; las llaves y los ^ _ no cuentan

    && m.replace(/\\(left|right|big|Big|,|;|quad|qquad|displaystyle|dfrac|tfrac)/g, "").replace(/\\[a-zA-Z]+/g, "x").replace(/[{}^_\s]/g, "").length > 30;

  }).join(" L") + " Z";

        <path class="flap" d="M102 72 L117 62 L93 57 L80 72 Z"/>
        <g clip-path="url(#${clip})"><g class="cat">

          <g data-m="party"><path class="fur-s" stroke-width="8" d="M46 72 Q40 60 33 50 M74 72 Q80 60 87 50"/>
            <circle class="fur" cx="33" cy="49" r="5"/><circle class="fur" cx="87" cy="49" r="5"/></g>
          <ellipse class="fur" cx="60" cy="82" rx="18" ry="16"/>
          <path class="fur" d="M40 38 L41 17 L56 30 Z M80 38 L79 17 L64 30 Z"/>
          <path class="ear-in" d="M43.5 33 L44 22.5 L51.5 29.5 Z M76.5 33 L76 22.5 L68.5 29.5 Z"/>
          <ellipse class="fur" cx="60" cy="48" rx="23" ry="20"/>
          <ellipse class="muzzle" cx="60" cy="56.5" rx="10" ry="6.5"/>
          <path class="whisk" d="M38 54 L27 52 M38 57.5 L27 59 M82 54 L93 52 M82 57.5 L93 59"/>
          <g data-m="happy party streak"><ellipse class="cheek" cx="45" cy="55" rx="3.6" ry="2.3"/><ellipse class="cheek" cx="75" cy="55" rx="3.6" ry="2.3"/></g>
          <g data-m="idle">
            <g class="eyeA"><ellipse class="ink" cx="51" cy="47" rx="3.4" ry="4.4"/><circle class="white" cx="52.1" cy="45.4" r="1.1"/><path class="inks" d="M65.5 47.5 q3.5 2.5 7 0"/></g>
            <g class="eyeB"><path class="inks" d="M47.5 47.5 q3.5 2.5 7 0"/><ellipse class="ink" cx="69" cy="47" rx="3.4" ry="4.4"/><circle class="white" cx="70.1" cy="45.4" r="1.1"/></g>
          </g>
          <g data-m="think"><ellipse class="ink" cx="52.5" cy="44.8" rx="3.2" ry="4"/><ellipse class="ink" cx="70.5" cy="44.8" rx="3.2" ry="4"/></g>
          <g data-m="wow"><circle class="white" cx="51" cy="46.5" r="5.6"/><circle class="white" cx="69" cy="46.5" r="5.6"/>
            <circle class="ink" cx="51" cy="47" r="3.3"/><circle class="ink" cx="69" cy="47" r="3.3"/></g>

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>efecen</title>
<meta name="description" content="Repasá cálculo, física y álgebra lineal jugando, 5-10 minutos por día.">
<meta name="theme-color" content="#5B4BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="efecen">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/schrodi.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<style>
@font-face {
  font-family: "Nunito";
  src: url("assets/fonts/nunito-latin-wght.woff2") format("woff2");
  font-weight: 200 1000;
  font-display: swap;
}
:root {
  --bg: #F6F5FB; --card: #FFFFFF; --ink: #1E1B3A; --muted: #6B6890; --line: #E3E1F0;
  --primary: #5B4BDB; --primary-d: #4334B3; --primary-soft: #ECEAFD; --on-primary: #FFFFFF;
  --ok: #1FA866; --ok-d: #15804D; --ok-soft: #E3F7EC;
  --bad: #E5484D; --bad-d: #B8333A; --bad-soft: #FDE8E9;
  --gold: #FFC23D; --gold-d: #E0A21B; --fire: #FF8A1F; --lock: #CFCCE0; --lock-d: #B3AFCB;
  --heat0: #ECEAFD; --heat1: #C9C2F7; --heat2: #9D90EE; --heat3: #7363E3; --heat4: #4A39C2;
  --shadow: 0 1px 2px rgba(30, 27, 58, .06), 0 4px 16px rgba(30, 27, 58, .06);
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13112A; --card: #1E1B3D; --ink: #F0EFFF; --muted: #A3A0C8; --line: #322E5C;
    --primary: #7B6CF0; --primary-d: #5646D0; --primary-soft: #2A2560;
    --ok: #2BC27A; --ok-d: #1C8F58; --ok-soft: #163A2B;
    --bad: #F2626A; --bad-d: #C2414A; --bad-soft: #3F1D26;
    --lock: #3D3966; --lock-d: #2C2950;
    --heat0: #26224A; --heat1: #3B3380; --heat2: #5747B8; --heat3: #7B6CF0; --heat4: #A99FF7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13112A; --card: #1E1B3D; --ink: #F0EFFF; --muted: #A3A0C8; --line: #322E5C;
  --primary: #7B6CF0; --primary-d: #5646D0; --primary-soft: #2A2560;
  --ok: #2BC27A; --ok-d: #1C8F58; --ok-soft: #163A2B;
  --bad: #F2626A; --bad-d: #C2414A; --bad-soft: #3F1D26;
  --lock: #3D3966; --lock-d: #2C2950;
  --heat0: #26224A; --heat1: #3B3380; --heat2: #5747B8; --heat3: #7B6CF0; --heat4: #A99FF7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100dvh;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.ic { width: 1.2em; height: 1.2em; vertical-align: -0.22em; flex: none; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.katex { font-size: 1.08em; }
.katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.ov, .katex-display, .solution li { scrollbar-width: none; }
.ov::-webkit-scrollbar, .katex-display::-webkit-scrollbar, .solution li::-webkit-scrollbar { display: none; }
.ov { overflow-y: hidden; padding: 2px 0; }

/* ---------- layout ---------- */
#app { max-width: 640px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { flex: 1; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: env(safe-area-inset-top); }
.logo { font-weight: 900; font-size: 1.6rem; letter-spacing: -.02em; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.logo .schrodi { width: 34px; height: 34px; }
.chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 2px solid var(--line); }
.chip.fire .ic { color: var(--fire); }
.chip.fire.off .ic { color: var(--lock-d); }
.chip.xp .ic { color: var(--gold-d); }
.card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; }
.section-title { font-size: 1.1rem; font-weight: 900; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .75rem; font-weight: 800; color: var(--muted); }
.nav button .ic { width: 26px; height: 26px; }
.nav button.on { color: var(--primary); }

/* ---------- buttons ---------- */
.btn {
  --b: var(--primary); --bd: var(--primary-d); --fg: var(--on-primary);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--b); color: var(--fg); border: 0; border-radius: 16px;
  padding: 14px 20px; font-weight: 900; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--bd); transition: transform .06s, box-shadow .06s, filter .15s;
  min-height: 52px; user-select: none;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { --b: var(--lock); --bd: var(--lock-d); --fg: var(--muted); cursor: default; }
.btn.block { width: 100%; }
.btn.ok { --b: var(--ok); --bd: var(--ok-d); }
.btn.bad { --b: var(--bad); --bd: var(--bad-d); }
.btn.gold { --b: var(--gold); --bd: var(--gold-d); --fg: #3A2A00; }
.btn.ghost { --b: var(--card); --bd: var(--line); --fg: var(--primary); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.sm { min-height: 40px; padding: 8px 14px; font-size: .85rem; border-radius: 12px; }
.btn.big { min-height: 64px; font-size: 1.15rem; }
.linkbtn { background: none; border: 0; color: var(--primary); font-weight: 800; padding: 6px 0; }
.iconbtn { background: none; border: 0; padding: 8px; border-radius: 12px; color: var(--muted); display: inline-flex; }
.iconbtn .ic { width: 26px; height: 26px; }

/* segmented */
.seg { display: flex; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 8px 6px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow); }
.switch { width: 52px; height: 30px; border-radius: 999px; background: var(--lock); border: 0; position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch.on { background: var(--ok); }
.switch.on::after { transform: translateX(22px); }

/* ---------- mascota: Schrödi ---------- */
.schrodi { display: block; overflow: visible; }
.schrodi .shadow { fill: currentColor; opacity: .08; }
.schrodi .fur { fill: #ADA5EA; }
.schrodi .fur-s { stroke: #ADA5EA; fill: none; stroke-linecap: round; }
.schrodi .muzzle { fill: #DCD8F8; }
.schrodi .ear-in, .schrodi .nose { fill: #FF8FA8; }
.schrodi .cheek { fill: #FF8FA8; opacity: .5; }
.schrodi .ink { fill: #2A2448; }
.schrodi .inks { stroke: #2A2448; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.schrodi .whisk { stroke: #2A2448; opacity: .3; stroke-width: 1.5; stroke-linecap: round; }
.schrodi .white { fill: #fff; }
.schrodi .box { fill: #FFC23D; }
.schrodi .box-band { fill: #F0AE24; }
.schrodi .flap { fill: #E9A520; }
.schrodi .box-in { fill: #9A6512; }
.schrodi .psi { fill: #C9860F; font: italic 700 26px "Times New Roman", Georgia, serif; }
.schrodi .ghost { fill: none; stroke: #8E85D8; stroke-width: 2.2; stroke-dasharray: 3.5 3; }
.schrodi .hat { fill: #5B4BDB; }
.schrodi .hat-dot, .schrodi .pom { fill: #FFC23D; }
.schrodi .star { fill: #FF8A1F; }
.schrodi .flame { fill: #FF8A1F; } .schrodi .flame-in { fill: #FFC23D; }
.schrodi .drop { fill: #7CC4FF; }
.schrodi [data-m] { display: none; }
.schrodi[data-mood="idle"] [data-m~="idle"], .schrodi[data-mood="think"] [data-m~="think"],
.schrodi[data-mood="wow"] [data-m~="wow"], .schrodi[data-mood="happy"] [data-m~="happy"],
.schrodi[data-mood="sad"] [data-m~="sad"], .schrodi[data-mood="party"] [data-m~="party"],
.schrodi[data-mood="streak"] [data-m~="streak"] { display: inline; }
/* cuánto se asoma de la caja según el estado */
.schrodi { --y: 16px; }
.schrodi[data-mood="wow"] { --y: 10px; }
.schrodi[data-mood="happy"], .schrodi[data-mood="streak"] { --y: 2px; }
.schrodi[data-mood="party"] { --y: -8px; }
.schrodi[data-mood="sad"] { --y: 44px; }
.schrodi .cat { transform: translateY(var(--y)); }
.schrodi[data-mood="idle"] .cat, .schrodi[data-mood="think"] .cat, .schrodi[data-mood="wow"] .cat { animation: sc-peek .8s cubic-bezier(.2,.9,.3,1.15) both; }
.schrodi[data-mood="happy"] .cat, .schrodi[data-mood="streak"] .cat { animation: sc-pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.schrodi[data-mood="sad"] .cat { animation: sc-hide .35s ease-in both; }
.schrodi[data-mood="party"] .cat { animation: sc-jump 1.3s ease-out both; }
.schrodi[data-mood="sad"] .boxg { transform-box: view-box; transform-origin: 60px 112px; animation: sc-wobble .5s .3s ease both; }
.schrodi .ghost { animation: sc-ghost 3.2s ease-in-out infinite; }
.schrodi .eyeA { animation: sc-swap 4s infinite; }
.schrodi .eyeB { animation: sc-swap 4s -2s infinite; }
.schrodi .flameg { transform-box: fill-box; transform-origin: 50% 100%; animation: sc-flicker .7s ease-in-out infinite alternate; }
.schrodi .confetti-bits rect { transform-box: fill-box; transform-origin: center; animation: sc-twinkle 1.2s ease-in-out infinite alternate; }
.schrodi .confetti-bits rect:nth-child(2n) { animation-delay: -.6s; }
.schrodi[data-mood="happy"] { animation: hop .6s ease; }
@keyframes sc-peek { from { transform: translateY(46px); } to { transform: translateY(var(--y)); } }
@keyframes sc-pop { from { transform: translateY(34px); } to { transform: translateY(var(--y)); } }
@keyframes sc-hide { from { transform: translateY(14px); } to { transform: translateY(var(--y)); } }
@keyframes sc-jump { 0% { transform: translateY(46px); } 30% { transform: translateY(-20px); } 50% { transform: translateY(var(--y)); } 70% { transform: translateY(-15px); } 100% { transform: translateY(var(--y)); } }
@keyframes sc-wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } 75% { transform: rotate(-1.5deg); } }
@keyframes sc-ghost { 0%,100% { transform: translate(-7px,-3px); opacity: .25; } 50% { transform: translate(7px,-3px); opacity: .7; } }
@keyframes sc-swap { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes sc-flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.14) rotate(3deg); } }
@keyframes sc-twinkle { from { transform: rotate(0) scale(.7); } to { transform: rotate(90deg) scale(1.1); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-10px); } 65% { transform: translateY(0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.fb-quip { font-weight: 700; font-size: .95rem; color: var(--ink); opacity: .85; }
.bubble { position: relative; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; font-weight: 700; }
.center-col .bubble::before { display: none; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 22px; width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }

/* ---------- home ---------- */
.hero { display: flex; align-items: center; gap: 14px; }
.hero .schrodi { width: 92px; height: 92px; flex: none; }
.goal { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 8; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.ring text { font: 900 15px "Nunito", sans-serif; fill: var(--ink); }
.course-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: 0 3px 0 var(--line); }
.course-card:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.course-card:disabled { opacity: .6; cursor: default; }
.course-ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex: none; }
.course-ico .ic { width: 28px; height: 28px; }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; transition: width .5s ease; }
.bar.gold > i { background: var(--gold); }
.daily-sub { text-align: center; font-weight: 700; margin-top: -6px; }

/* ---------- course map ---------- */
.map-head { display: flex; align-items: center; gap: 8px; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.unit-head { width: 100%; border-radius: var(--radius); padding: 14px 16px; background: var(--primary); color: var(--on-primary); display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 var(--primary-d); margin-bottom: 18px; }
.unit-head .ic { width: 30px; height: 30px; }
.unit-head h3 { font-size: 1.1rem; }
.unit-head p { margin: 0; opacity: .9; font-size: .875rem; font-weight: 700; }
.unit.locked .unit-head { background: var(--lock); color: var(--muted); box-shadow: 0 4px 0 var(--lock-d); }
.unit.done .unit-head { background: var(--ok); box-shadow: 0 4px 0 var(--ok-d); }
.unit.soon .unit-head { background: var(--card); color: var(--muted); border: 2px dashed var(--line); box-shadow: none; margin-bottom: 8px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; position: relative; }
.node-wrap.has-tip { margin-top: 30px; }
.node { width: 74px; height: 70px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--primary); color: #fff; box-shadow: 0 6px 0 var(--primary-d); transition: transform .06s, box-shadow .06s; }
.node .ic { width: 32px; height: 32px; }
.node:active { transform: translateY(6px); box-shadow: 0 0 0 var(--primary-d); }
.node.done { background: var(--gold); color: #3A2A00; box-shadow: 0 6px 0 var(--gold-d); }
.node.locked { background: var(--lock); color: var(--muted); box-shadow: 0 6px 0 var(--lock-d); }
.node.current { animation: pulse 1.8s infinite; }
@keyframes pulse { 0%, 100% { outline: 0 solid transparent; } 50% { outline: 8px solid var(--primary-soft); } }
.node-label { font-weight: 800; font-size: .85rem; text-align: center; max-width: 170px; }
.node-wrap.locked .node-label { color: var(--muted); }
.start-tip { position: absolute; top: -34px; background: var(--card); color: var(--primary); border: 2px solid var(--line); font-weight: 900; font-size: .75rem; letter-spacing: .06em; padding: 3px 10px; border-radius: 10px; animation: bob 1.4s ease-in-out infinite; white-space: nowrap; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.diag-card { display: flex; gap: 12px; align-items: center; }
.diag-card .schrodi { width: 64px; height: 64px; flex: none; }

/* ---------- session ---------- */
.session { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
.ses-top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 8px; }
.ses-top .bar { flex: 1; height: 16px; }
.ses-top .bar > i { background: var(--ok); }
.ses-tag { font-size: .75rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); display: inline-flex; align-items: center; gap: 4px; }
.ses-tag.review { color: var(--fire); }
.ses-body { flex: 1; padding: 8px 16px 200px; display: flex; flex-direction: column; gap: 14px; }
.prompt { font-size: 1.12rem; font-weight: 700; }
.prompt p { margin: .3em 0; }
.ses-foot { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 2px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 10; }
.ses-foot-inner { max-width: 608px; margin: 0 auto; display: flex; gap: 10px; }
.graph { width: 100%; max-width: 380px; height: 230px; display: block; margin: 0 auto; background: var(--card); border: 2px solid var(--line); border-radius: 14px; }
.graph.mini { height: 120px; max-width: none; border-radius: 10px; }

.options { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 58px;
  box-shadow: 0 3px 0 var(--line); font-weight: 700; transition: transform .06s;
}
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .k { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .8rem; font-weight: 900; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.opt.sel .k { border-color: var(--primary); color: var(--primary); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
.opt .ov { overflow-x: auto; min-width: 0; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .opt { justify-content: center; font-size: 1.05rem; font-weight: 900; min-height: 72px; }

.numwrap { display: flex; flex-direction: column; gap: 8px; }
.numin { width: 100%; font: 800 1.35rem "Nunito", sans-serif; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); outline: none; }
.numin:focus { border-color: var(--primary); }
.numin.right { border-color: var(--ok); background: var(--ok-soft); }
.numin.wrong { border-color: var(--bad); background: var(--bad-soft); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { min-width: 44px; height: 40px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 800; box-shadow: 0 2px 0 var(--line); }
.preview { min-height: 1.4em; font-weight: 700; color: var(--muted); }

.steps-pool, .steps-ans { display: flex; flex-direction: column; gap: 8px; }
.steps-ans { min-height: 64px; padding: 10px; border: 2px dashed var(--line); border-radius: 16px; }
.steps-ans:empty::before { content: "Tocá los pasos en orden"; color: var(--muted); font-weight: 700; padding: 8px; }
.step { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 3px 0 var(--line); font-weight: 600; }
.step .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: .8rem; font-weight: 900; display: grid; place-items: center; margin-top: 2px; }
.step .ov { overflow-x: auto; min-width: 0; flex: 1; }
.step.sel { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 3px 0 var(--primary); }
.step.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.step.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.step:disabled { cursor: default; color: inherit; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.mitem { position: relative; width: 100%; min-height: 64px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 3px 0 var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mitem .ov { overflow-x: auto; max-width: 100%; }
.mitem.sel { border-color: var(--primary); background: var(--primary-soft); }
.mitem[data-pair] { border-color: var(--pc); box-shadow: 0 3px 0 var(--pc); }
.mitem .badge { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--pc); color: #fff; font-size: .7rem; font-weight: 900; display: grid; place-items: center; }
.mitem.right { border-color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.mitem.wrong { border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); }
.mitem:disabled { cursor: default; color: inherit; }
.mitem canvas { pointer-events: none; border: 0; background: none; }
.mitem:has(canvas) { padding: 4px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.9,.3,1.1); }
.sheet.show { transform: translateY(0); }
.sheet-inner { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; max-height: 78dvh; display: flex; flex-direction: column; gap: 10px; }
.sheet.ok .sheet-inner { background: var(--ok-soft); color: var(--ink); border-top: 3px solid var(--ok); }
.sheet.bad .sheet-inner { background: var(--bad-soft); color: var(--ink); border-top: 3px solid var(--bad); }
.fb-head { display: flex; align-items: center; gap: 12px; }
.fb-head .schrodi { width: 54px; height: 54px; flex: none; }
.fb-title { font-size: 1.35rem; font-weight: 900; }
.sheet.ok .fb-title { color: var(--ok-d); }
.sheet.bad .fb-title { color: var(--bad-d); }
[data-theme="dark"] .sheet.ok .fb-title, [data-theme="dark"] .sheet.bad .fb-title { filter: brightness(1.6); }
.fb-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.fb-answer { font-weight: 700; }
.solution { background: var(--card); border-radius: 14px; padding: 10px 14px; border: 2px solid var(--line); }
.solution ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.solution li { overflow-x: auto; }
.xp-pop { font-weight: 900; color: var(--gold-d); }

/* intro + summary */
.center-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 24px 16px calc(120px + env(safe-area-inset-bottom)); }
.center-col .schrodi { width: 120px; height: 120px; }
.intro-card { text-align: left; width: 100%; }
.intro-card h3 { margin-bottom: 6px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.tile { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--card); text-align: center; }
.tile .lab { font-size: .72rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 4px; color: #fff; background: var(--primary); }
.tile .val { font-size: 1.4rem; font-weight: 900; padding: 10px 4px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tile.gold .lab { background: var(--gold-d); }
.tile.ok .lab { background: var(--ok); }
.tile.fire .lab { background: var(--fire); }
.big-title { font-size: 1.7rem; font-weight: 900; }

/* stats */
.stat-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat-tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.stat-tile .ic { width: 28px; height: 28px; }
.stat-tile b { font-size: 1.3rem; display: block; line-height: 1.1; }
.stat-tile span { font-size: .8rem; color: var(--muted); font-weight: 700; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.hbar .name { font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .v { font-weight: 800; font-size: .85rem; color: var(--muted); text-align: right; }
.hbar .bar { grid-column: 1 / -1; height: 10px; margin-bottom: 8px; }
.hbar .bar > i { border-radius: 0 4px 4px 0; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--heat0); display: block; }
.heat i[data-l="1"] { background: var(--heat1); } .heat i[data-l="2"] { background: var(--heat2); }
.heat i[data-l="3"] { background: var(--heat3); } .heat i[data-l="4"] { background: var(--heat4); }
.heat i.future { background: transparent; }
.heat-legend { display: flex; align-items: center; gap: 3px; justify-content: flex-end; font-size: .75rem; color: var(--muted); font-weight: 700; margin-top: 6px; }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.weak { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 2px solid var(--line); }
.weak:first-child { border-top: 0; }
.log-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 2px solid var(--line); font-size: .9rem; }
.log-row:first-child { border-top: 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .8rem; font-weight: 700; padding: 4px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -120%); }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 2px solid var(--line); }
.set-row:first-child { border-top: 0; padding-top: 0; }
.set-row:last-child { padding-bottom: 0; }
.set-row .lbl { font-weight: 800; }
.set-row .desc { font-size: .85rem; color: var(--muted); }
.credits li { margin-bottom: 10px; }
.credits a { color: var(--primary); font-weight: 700; }

/* toast + confetti */
#toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -150%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 800; z-index: 60; transition: transform .3s; max-width: calc(100% - 32px); }
#toast.show { transform: translate(-50%, 0); }
.confetti { position: fixed; top: -12px; width: 10px; height: 14px; z-index: 70; pointer-events: none; animation: fall linear forwards; border-radius: 2px; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(720deg); } }
.shake { animation: shake .4s ease; }
.pop { animation: popin .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

@media (min-width: 720px) {
  .screen { padding-top: 24px; }
  .prompt { font-size: 1.2rem; }
  .graph { height: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/katex/katex.min.js"></script>

<!-- ================= MOTOR (lógica pura, sin DOM) ================= -->
<script id="engine">
(function (root) {
  "use strict";
  const E = root.Efecen = { version: "0.1.0", courses: {}, courseOrder: [] };

  // ---------- RNG con semilla (mulberry32) ----------
  E.rng = function (seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const r = {
      seed, next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      nz: (lo, hi) => { let v; do v = r.int(lo, hi); while (v === 0); return v; },
      pick: arr => arr[Math.floor(next() * arr.length)],
      bool: (p = 0.5) => next() < p,
      sign: () => (next() < 0.5 ? -1 : 1),
      shuffle: arr => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; },
      sample: (arr, n) => r.shuffle(arr).slice(0, n),
      distinct: (n, lo, hi, opts = {}) => {
        const out = [];
        let guard = 0;
        while (out.length < n && guard++ < 1000) {
          const v = r.int(lo, hi);
          if (opts.nonzero && v === 0) continue;
          if (opts.exclude && opts.exclude.includes(v)) continue;
          if (!out.includes(v)) out.push(v);
        }
        return out;
      }
    };
    return r;
  };
  E.newSeed = () => (Math.random() * 4294967296) >>> 0;

  // ---------- Helpers para escribir LaTeX ----------
  const H = E.H = {};
  H.gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
  // fracción reducida en LaTeX
  H.frac = (p, q) => {
    if (q === 0) return "\\text{indef.}";
    if (q < 0) { p = -p; q = -q; }
    const g = H.gcd(p, q); p /= g; q /= g;
    if (q === 1) return String(p);
    return (p < 0 ? "-" : "") + `\\frac{${Math.abs(p)}}{${q}}`;
  };
  // número "lindo": entero si lo es, si no hasta d decimales
  H.num = (x, d = 3) => {
    if (!isFinite(x)) return x > 0 ? "\\infty" : "-\\infty";
    const r = Math.round(x);
    if (Math.abs(x - r) < 1e-9) return String(r === 0 ? 0 : r);
    const s = String(+x.toFixed(d));
    return s === "-0" ? "0" : s;
  };
  H.m = s => `$\\displaystyle ${s}$`;
  H.xp = (n, v = "x") => (n === 0 ? "" : n === 1 ? v : `${v}^{${n}}`);
  // término con signo: term(-3,"x^{2}",false) -> " - 3x^{2}"
  H.term = (c, mono, first) => {
    if (c === 0) return "";
    const sign = c < 0 ? "-" : first ? "" : "+";
    const a = Math.abs(c);
    const body = mono ? (a === 1 ? mono : a + mono) : String(a);
    return first ? sign + body : ` ${sign} ${body}`;
  };
  // poly([[3,"x^{2}"],[-1,"x"],[5,""]]) -> "3x^{2} - x + 5"
  H.poly = terms => {
    let out = "", first = true;
    for (const [c, mono] of terms) {
      if (c === 0) continue;
      out += H.term(c, mono, first);
      first = false;
    }
    return out || "0";
  };
  // coeficientes de mayor a menor grado
  H.polyc = (coeffs, v = "x") => H.poly(coeffs.map((c, i) => [c, H.xp(coeffs.length - 1 - i, v)]));
  H.peval = (coeffs, x) => coeffs.reduce((acc, c) => acc * x + c, 0);
  // sustitución visible: psub([6,-4,1], 2) -> "6\cdot 2^{2} - 4\cdot 2 + 1"
  H.psub = (coeffs, v) => {
    const deg = coeffs.length - 1, pv = v < 0 ? `(${v})` : String(v);
    let out = "", first = true;
    coeffs.forEach((c, i) => {
      const k = deg - i;
      if (c === 0) return;
      const a = Math.abs(c), sign = c < 0 ? "-" : first ? "" : "+";
      const body = k === 0 ? String(a) : (a === 1 ? "" : a + "\\cdot ") + pv + (k > 1 ? `^{${k}}` : "");
      out += first ? sign + body : ` ${sign} ${body}`;
      first = false;
    });
    return out || "0";
  };
  // "x - 3", "x + 2", "x"
  H.xm = (r, v = "x") => (r === 0 ? v : r > 0 ? `${v} - ${r}` : `${v} + ${-r}`);
  // coeficiente delante de un paréntesis: 1 -> "", -1 -> "-"
  H.cf = c => (c === 1 ? "" : c === -1 ? "-" : String(c));
  H.kx = (k, v = "x") => (k === 1 ? v : k === -1 ? "-" + v : k + v);
  // número entre paréntesis si es negativo (para sustituciones)
  H.par = v => (typeof v === "number" && v < 0 ? `(${H.num(v)})` : typeof v === "number" ? H.num(v) : v);
  // " + 3" / " - 3"
  H.sg = v => (v < 0 ? ` - ${H.num(-v)}` : ` + ${H.num(v)}`);
  H.angles = [
    { v: Math.PI / 6, t: "\\frac{\\pi}{6}" }, { v: Math.PI / 4, t: "\\frac{\\pi}{4}" },
    { v: Math.PI / 3, t: "\\frac{\\pi}{3}" }, { v: Math.PI / 2, t: "\\frac{\\pi}{2}" }
  ];
  // armar opción múltiple: dedup + completar con fallbacks + mezclar
  H.mc = (r, correct, distractors, opts = {}) => {
    const seen = new Set([correct]);
    const ds = [];
    for (const d of [...distractors, ...(opts.fallback || [])]) {
      if (ds.length >= (opts.n || 4) - 1) break;
      if (d != null && !seen.has(d)) { seen.add(d); ds.push(d); }
    }
    const raw = opts.keepOrder ? [correct, ...ds] : r.shuffle([correct, ...ds]);
    const options = opts.text ? raw : raw.map(H.m);
    return { options, correct: raw.indexOf(correct) };
  };

  // ---------- Parser numérico seguro (sin eval) ----------
  const NAMES = ["sqrt", "exp", "sin", "cos", "tan", "ln", "log", "pi", "e"];
  const FN = { sqrt: Math.sqrt, ln: Math.log, log: Math.log10, sin: Math.sin, cos: Math.cos, tan: Math.tan, exp: Math.exp };
  E.parseNum = function (src) {
    if (src == null) return NaN;
    let s = String(src).trim().toLowerCase()
      .replace(/,/g, ".").replace(/π/g, "pi").replace(/√/g, "sqrt")
      .replace(/[·×]/g, "*").replace(/[−–]/g, "-").replace(/\s+/g, "");
    if (!s) return NaN;
    const open = (s.match(/\(/g) || []).length - (s.match(/\)/g) || []).length;
    if (open > 0) s += ")".repeat(open);
    const toks = [];
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      const num = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
      if (num) { toks.push({ t: "n", v: parseFloat(num[1]) }); i += num[1].length; continue; }
      if ("+-*/^()".includes(ch)) { toks.push({ t: ch }); i++; continue; }
      const name = NAMES.find(n => s.startsWith(n, i));
      if (name) { toks.push({ t: "id", v: name }); i += name.length; continue; }
      return NaN;
    }
    let k = 0;
    const eat = t => (toks[k] && toks[k].t === t ? (k++, true) : false);
    const expr = () => { let v = term(); for (;;) { if (eat("+")) v += term(); else if (eat("-")) v -= term(); else return v; } };
    const term = () => {
      let v = unary();
      for (;;) {
        if (eat("*")) v *= unary();
        else if (eat("/")) v /= unary();
        else { const p = toks[k]; if (p && (p.t === "n" || p.t === "id" || p.t === "(")) v *= power(); else return v; }
      }
    };
    const unary = () => (eat("-") ? -unary() : eat("+") ? unary() : power());
    const power = () => { const b = atom(); return eat("^") ? Math.pow(b, unary()) : b; };
    const atom = () => {
      const p = toks[k++];
      if (!p) throw 0;
      if (p.t === "n") return p.v;
      if (p.t === "(") { const v = expr(); if (!eat(")")) throw 0; return v; }
      if (p.t === "id") {
        if (p.v === "pi") return Math.PI;
        if (p.v === "e") return Math.E;
        return FN[p.v](power());
      }
      throw 0;
    };
    try { const v = expr(); return k === toks.length ? v : NaN; } catch (e) { return NaN; }
  };
  // ¿la respuesta numérica es correcta? tolerancia relativa, o redondeo a 2 decimales
  E.checkNumeric = function (user, answer, tol = 0.01) {
    if (!isFinite(user)) return false;
    const diff = Math.abs(user - answer);
    if (diff <= tol * Math.abs(answer) + 1e-9) return true;
    if (Math.abs(user - Math.round(answer * 100) / 100) < 1e-9) return true;
    return Math.abs(answer) < 1e-9 && Math.abs(user) < 1e-6;
  };

  // ---------- Fechas (siempre en hora local) ----------
  const pad = n => String(n).padStart(2, "0");
  E.fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  E.today = () => E.fmtDate(new Date());
  E.addDays = (str, n) => { const [y, m, d] = str.split("-").map(Number); return E.fmtDate(new Date(y, m - 1, d + n)); };
  E.diffDays = (a, b) => { const [y1, m1, d1] = a.split("-").map(Number); const [y2, m2, d2] = b.split("-").map(Number); return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 864e5); };

  // ---------- Repetición espaciada (SM-2 simplificado, por concepto) ----------
  E.srs = {
    newCard: () => ({ ef: 2.5, int: 0, reps: 0, due: null, last: null, seen: 0, ok: 0 }),
    // nota 0-5 a partir del desempeño (sin autoevaluación)
    grade(ok, ms, difficulty = 1) {
      if (!ok) return 1;
      const s = ms / 1000 / difficulty;
      return s < 25 ? 5 : s < 70 ? 4 : 3;
    },
    update(card, q, today) {
      const c = Object.assign(E.srs.newCard(), card);
      if (q < 3) { c.reps = 0; c.int = 1; }
      else {
        c.reps += 1;
        c.int = c.reps === 1 ? 1 : c.reps === 2 ? 3 : Math.max(1, Math.round(c.int * c.ef));
      }
      c.ef = Math.max(1.3, +(c.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)).toFixed(3));
      c.due = E.addDays(today, c.int);
      c.last = today;
      return c;
    }
  };

  // ---------- Registro de cursos ----------
  E.registerCourse = function (c) {
    c.tplLesson = {};
    c.conceptUnit = {};
    c.lessonList = [];
    for (const [id, t] of Object.entries(c.templates)) t.id = id;
    c.units.forEach((u, ui) => {
      u.index = ui;
      u.lessons = u.lessons || [];
      u.lessons.forEach((l, li) => {
        l.unit = u; l.index = li;
        l.concepts = [...new Set(l.templates.flatMap(t => c.templates[t].concepts))];
        l.templates.forEach(t => { c.tplLesson[t] = l; });
        l.concepts.forEach(k => { if (!c.conceptUnit[k]) c.conceptUnit[k] = u; });
        c.lessonList.push(l);
      });
    });
    E.courses[c.id] = c;
    if (!E.courseOrder.includes(c.id)) E.courseOrder.push(c.id);
  };
  // genera una instancia reproducible de una plantilla
  E.instantiate = function (course, tplId, seed) {
    const t = course.templates[tplId];
    for (let tries = 0; tries < 30; tries++) {
      const inst = t.generate(E.rng(seed + tries * 7919), H);
      if (inst) { inst.type = inst.type || t.type; return inst; }
    }
    throw new Error("No se pudo generar " + tplId);
  };

  // ---------- Estado persistente ----------
  E.store = {
    key: "efecen:v1",
    defaults: () => ({
      app: "efecen", version: 1,
      settings: { goal: 50, sound: true, theme: "auto" },
      xp: 0, streak: 0, bestStreak: 0, lastActive: null,
      xpByDay: {}, activeCourse: null,
      courses: {}, srs: {}, log: [], answered: 0, answeredOk: 0
    }),
    migrate(s) {
      const d = E.store.defaults();
      for (const k of Object.keys(d)) if (s[k] === undefined) s[k] = d[k];
      s.settings = Object.assign(d.settings, s.settings);
      return s;
    },
    valid: s => !!s && typeof s === "object" && s.app === "efecen" && typeof s.version === "number" && typeof s.srs === "object" && typeof s.courses === "object",
    load() {
      try {
        const raw = localStorage.getItem(E.store.key);
        if (!raw) return E.store.defaults();
        const s = JSON.parse(raw);
        return E.store.valid(s) ? E.store.migrate(s) : E.store.defaults();
      } catch (e) { return E.store.defaults(); }
    },
    save(s) { try { localStorage.setItem(E.store.key, JSON.stringify(s)); return true; } catch (e) { return false; } }
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<!-- ================= APP / UI ================= -->
<script id="app-script">
(function () {
  "use strict";
  const E = window.Efecen, H = E.H;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const app = $("#app");
  let S = E.store.load();
  const ui = { route: "home", params: {}, session: null, summary: null, graphs: new Map() };
  const save = () => E.store.save(S);
  const today = () => E.today();

  const UPCOMING = [
    { id: "fisica", title: "Física Universitaria", icon: "atom", note: "Cinemática y dinámica · Fase 2" },
    { id: "algebra", title: "Álgebra lineal", icon: "grid-3x3", note: "Sistemas, matrices, autovalores · Fase 3" }
  ];

  // ---------- utilidades de render ----------
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="assets/icons/sprite.svg#i-${n}"/></svg>`;
  const kcache = new Map();
  function K(m, display) {
    const key = (display ? "D" : "I") + m;

  // ---------- sonido (Kenney CC0 + síntesis de respaldo) ----------
  const Snd = {
    ctx: null, buf: {},
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      for (const n of ["correct", "wrong", "tap", "complete", "streak"]) {
        fetch(`assets/sounds/${n}.ogg`).then(r => r.arrayBuffer())
          .then(b => new Promise((ok, ko) => this.ctx.decodeAudioData(b, ok, ko)))
          .then(d => { this.buf[n] = d; }).catch(() => {});
      }
    },
    play(n) {
      if (!S.settings.sound) return;
      this.init();
      const c = this.ctx;
      if (!c) return;
      if (c.state === "suspended") c.resume();
      const b = this.buf[n];
      if (b) {
        const src = c.createBufferSource(), g = c.createGain();
        src.buffer = b; g.gain.value = 0.55;
        src.connect(g); g.connect(c.destination); src.start();
      } else this.synth(n);
    },
    synth(n) {
      const c = this.ctx;
      const notes = { correct: [[660, 0], [880, .09]], wrong: [[220, 0], [175, .13]], tap: [[520, 0]],
        complete: [[523, 0], [659, .12], [784, .24], [1047, .36]], streak: [[784, 0], [988, .1], [1175, .2]] }[n] || [];
      for (const [f, t] of notes) {
        const o = c.createOscillator(), g = c.createGain();
        o.type = n === "wrong" ? "square" : "triangle";
        o.frequency.value = f;
        const t0 = c.currentTime + t;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(n === "wrong" ? 0.06 : 0.18, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + 0.22);
      }
    }
  };

  // ---------- gráficos con canvas ----------
  let gid = 0;
  function graphHtml(spec, cls = "") {
    const id = "g" + (++gid);

  function drawGraphs(root = app) {
    for (const cv of $$("canvas[data-g]", root)) {
      const spec = ui.graphs.get(cv.dataset.g);
      if (spec) drawGraph(cv, spec);
    }
  }
  function drawGraph(cv, g) {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const col = n => css.getPropertyValue(n).trim();
    const [x0, x1] = g.xr || [-5, 5], [y0, y1] = g.yr || [-5, 5];
    const X = x => (x - x0) / (x1 - x0) * w, Y = y => h - (y - y0) / (y1 - y0) * h;
    const mini = cv.classList.contains("mini");
    // grilla
    ctx.lineWidth = 1; ctx.strokeStyle = col("--line");
    const step = (x1 - x0) > 14 ? 2 : 1;
    ctx.beginPath();
    for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) { ctx.moveTo(X(x) + .5, 0); ctx.lineTo(X(x) + .5, h); }
    for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) { ctx.moveTo(0, Y(y) + .5); ctx.lineTo(w, Y(y) + .5); }
    ctx.stroke();
    // ejes
    ctx.strokeStyle = col("--muted"); ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (y0 <= 0 && y1 >= 0) { ctx.moveTo(0, Y(0)); ctx.lineTo(w, Y(0)); }
    if (x0 <= 0 && x1 >= 0) { ctx.moveTo(X(0), 0); ctx.lineTo(X(0), h); }
    ctx.stroke();
    if (!mini) {
      ctx.fillStyle = col("--muted"); ctx.font = "700 11px Nunito, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) if (x !== 0 && x % 2 === 0) ctx.fillText(x, X(x), Math.min(h - 13, Y(0) + 3));
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) if (y !== 0 && y % 2 === 0) ctx.fillText(y, Math.max(16, X(0) - 4), Y(y));
    }
    // asíntotas
    ctx.setLineDash([5, 5]); ctx.strokeStyle = col("--bad"); ctx.lineWidth = 1.5;
    for (const ax of (g.asym && g.asym.x) || []) { ctx.beginPath(); ctx.moveTo(X(ax), 0); ctx.lineTo(X(ax), h); ctx.stroke(); }
    for (const ay of (g.asym && g.asym.y) || []) { ctx.beginPath(); ctx.moveTo(0, Y(ay)); ctx.lineTo(w, Y(ay)); ctx.stroke(); }
    ctx.setLineDash([]);
    // curvas
    const pieces = g.pieces || (g.fns || []).map(f => ({ f }));
    ctx.lineWidth = mini ? 2.5 : 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = col("--primary");
    const span = y1 - y0;
    for (const p of pieces) {
      // los tramos con extremo propio se muestrean apenas adentro, para no unir saltos
      const eps = (x1 - x0) * 1e-6;
      const a = p.from != null ? p.from + eps : x0, b = p.to != null ? p.to - eps : x1, N = 400;
      ctx.beginPath();
      let pen = false, prev = null;
      for (let i = 0; i <= N; i++) {
        const x = a + (b - a) * i / N;
        const y = p.f(x);
        if (!isFinite(y) || Math.abs(y - (y0 + y1) / 2) > span * 4 || (prev !== null && Math.abs(y - prev) > span)) { pen = false; prev = isFinite(y) ? y : null; continue; }
        if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }
        prev = y;
      }
      ctx.stroke();
    }
    // puntos (abiertos/cerrados)
    for (const pt of g.points || []) {
      ctx.beginPath(); ctx.arc(X(pt.x), Y(pt.y), mini ? 3.5 : 5, 0, Math.PI * 2);
      ctx.fillStyle = pt.open ? col("--card") : col("--primary");
      ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = col("--primary"); ctx.stroke();
    }
  }

  // ---------- estado de cursos ----------
  const course = id => E.courses[id];

  const lessonDone = (cid, l) => !!(cState(cid).lessons[l.id] || {}).done;

  function unitUnlocked(cid, u) {
    if (u.comingSoon) return false;

  }
  function lessonUnlocked(cid, l) {

  function dueConcepts(cid) {
    const c = course(cid), t = today();

      .map(k => ({ k, card: S.srs[ckey(cid, k)] }))
      .filter(x => x.card && x.card.due && x.card.due <= t)
      .sort((a, b) => (a.card.due < b.card.due ? -1 : a.card.due > b.card.due ? 1 : a.card.ef - b.card.ef));

  // ---------- construcción de sesiones ----------
  function lessonItems(cid, l, n = 8) {
    const c = course(cid);
    const tpls = l.templates.slice().sort((a, b) => c.templates[a].difficulty - c.templates[b].difficulty);
    const items = [];
    let pool = tpls.slice();
    while (items.length < n) {
      if (!pool.length) pool = E.rng(E.newSeed()).shuffle(tpls);
      items.push({ tpl: pool.shift(), seed: E.newSeed(), src: "lesson" });
    }
    return items;
  }
  function reviewItems(cid, concepts, max) {
    const r = E.rng(E.newSeed());
    const out = [];
    for (const k of concepts) {
      if (out.length >= max) break;
      const ts = templatesFor(cid, k);
      if (ts.length) out.push({ tpl: r.pick(ts), seed: E.newSeed(), src: "review", focus: k });
    }
    return out;
  }
  function weakConcepts(cid) {
    return Object.keys(course(cid).concepts)
      .map(k => ({ k, card: S.srs[ckey(cid, k)] }))
      .filter(x => x.card && x.card.seen > 0)
      .sort((a, b) => (a.card.ok / a.card.seen - b.card.ok / b.card.seen) || (a.card.ef - b.card.ef));
  }
  function startDaily() {
    const cid = activeCourse();
    const c = cState(cid);

    const reviews = reviewItems(cid, dueConcepts(cid).map(x => x.k), 5);
    const l = currentLesson(cid);
    let items = reviews;
    if (l) items = items.concat(lessonItems(cid, l, 8));
    else if (items.length < 8) items = items.concat(reviewItems(cid, weakConcepts(cid).map(x => x.k), 8 - items.length));
    if (!items.length) { toast("No hay nada pendiente. ¡Volvé mañana!"); return; }
    startSession({ kind: "daily", cid, lessonId: l && l.id, items, intro: !!l && !lessonDone(cid, l) && !(cState(cid).lessons[l.id] || {}).plays });
  }
  function startLesson(cid, lessonId) {

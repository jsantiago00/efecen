  function lessonUnlocked(cid, l) {
    if (!unitUnlocked(cid, l.unit)) return false;
    return l.index === 0 || lessonDone(cid, l.unit.lessons[l.index - 1]);
  }
  const currentLesson = cid => course(cid).lessonList.find(l => !lessonDone(cid, l) && lessonUnlocked(cid, l)) || null;
  function courseProgress(cid) {
    const ls = course(cid).lessonList;
    return ls.length ? ls.filter(l => lessonDone(cid, l)).length / ls.length : 0;
  }
  // materias de la carrera en orden sugerido (las que todavía no tienen contenido quedan marcadas)
  function careerSubjects() {
    const out = [];
    if (!E.career) return E.courseOrder.map((id, i) => ({ code: course(id).code || id, title: course(id).title, course: id, step: i + 1, year: 1, sem: 1 }));
    for (const y of E.career.years) for (const sm of y.semesters) for (const sub of sm.subjects) out.push(Object.assign({ year: y.n, sem: sm.n }, sub));
    return out.sort((a, b) => a.step - b.step);
  }
  const hasContent = sub => !!(sub.course && E.courses[sub.course] && E.courses[sub.course].lessonList.length);
  // la próxima materia sugerida: la primera del trayecto con contenido y sin terminar
  const suggestedSubject = () => careerSubjects().find(sub => hasContent(sub) && courseProgress(sub.course) < 1) || null;
  const activeCourse = () => {
    if (S.activeCourse && E.courses[S.activeCourse] && E.courses[S.activeCourse].lessonList.length) return S.activeCourse;
    const sg = suggestedSubject();
    return sg ? sg.course : E.courseOrder[0];
  };
  const ckey = (cid, k) => cid + "/" + k;
  function dueConcepts(cid) {
    const c = course(cid), t = today();
    return Object.keys(c.concepts)
      .map(k => ({ k, cid, card: S.srs[ckey(cid, k)] }))
      .filter(x => x.card && x.card.due && x.card.due <= t)
      .sort((a, b) => (a.card.due < b.card.due ? -1 : a.card.due > b.card.due ? 1 : a.card.ef - b.card.ef));
  }
  // repasos vencidos de todas las materias (los más atrasados primero)
  const allDue = () => E.courseOrder.flatMap(dueConcepts)
    .sort((a, b) => (a.card.due < b.card.due ? -1 : a.card.due > b.card.due ? 1 : a.card.ef - b.card.ef));
  // plantillas disponibles para repasar un concepto (solo de lecciones desbloqueadas)
  function templatesFor(cid, k) {
    const c = course(cid);
    return Object.values(c.templates).filter(t => t.concepts.includes(k) && c.tplLesson[t.id] && lessonUnlocked(cid, c.tplLesson[t.id])).map(t => t.id);
  }
  const xpToday = () => S.xpByDay[today()] || 0;
  function shownStreak() {
    if (!S.lastActive) return 0;
    const d = E.diffDays(S.lastActive, today());
    return d <= 1 ? S.streak : 0;
  }

  // ---------- construcción de sesiones ----------
  // cada ítem lleva su materia (cid): la sesión del día mezcla repasos de varias materias
  function lessonItems(cid, l, n = 8) {
    const c = course(cid);
    const tpls = l.templates.slice().sort((a, b) => c.templates[a].difficulty - c.templates[b].difficulty);
    const items = [];
    let pool = tpls.slice();
    while (items.length < n) {
      if (!pool.length) pool = E.rng(E.newSeed()).shuffle(tpls);
      items.push({ cid, tpl: pool.shift(), seed: E.newSeed(), src: "lesson" });
    }
    return items;
  }
  function reviewItems(list, max) {
    const r = E.rng(E.newSeed());
    const out = [];
    for (const { cid, k } of list) {
      if (out.length >= max) break;
      const ts = templatesFor(cid, k);
      if (ts.length) out.push({ cid, tpl: r.pick(ts), seed: E.newSeed(), src: "review", focus: k });
    }
    return out;
  }
  function weakConcepts(cid) {
    return Object.keys(course(cid).concepts)
      .map(k => ({ k, cid, card: S.srs[ckey(cid, k)] }))
      .filter(x => x.card && x.card.seen > 0)
      .sort((a, b) => (a.card.ok / a.card.seen - b.card.ok / b.card.seen) || (a.card.ef - b.card.ef));
  }
  const firstTimeIn = cid => !cState(cid).diag && !course(cid).lessonList.some(l => lessonDone(cid, l));
  function startDaily() {
    const cid = activeCourse();
    if (firstTimeIn(cid)) { go("course", { id: cid }); return; }
    const reviews = reviewItems(allDue(), 5);
    const l = currentLesson(cid);
    let items = reviews;
    if (l) items = items.concat(lessonItems(cid, l, 8));
    else if (items.length < 8) items = items.concat(reviewItems(weakConcepts(cid), 8 - items.length));
    if (!items.length) { toast("No hay nada pendiente. ¡Volvé mañana!"); return; }
    startSession({ kind: "daily", cid, lessonId: l && l.id, items, intro: !!l && !lessonDone(cid, l) && !(cState(cid).lessons[l.id] || {}).plays });
  }
  function startLesson(cid, lessonId) {
    const l = course(cid).lessonList.find(x => x.id === lessonId);
    if (!l || !lessonUnlocked(cid, l)) return;
    startSession({ kind: "lesson", cid, lessonId, items: lessonItems(cid, l, 8), intro: true });
  }
  function startPractice(cid, k) {
    const ts = templatesFor(cid, k);
    if (!ts.length) return;
    const r = E.rng(E.newSeed());
    const items = Array.from({ length: 6 }, () => ({ cid, tpl: r.pick(ts), seed: E.newSeed(), src: "review", focus: k }));
    startSession({ kind: "practice", cid, items, title: course(cid).concepts[k].name });
  }
  // diagnóstico de la materia: unidad por unidad, corta en la primera que no aprobás
  function startDiagnostic(cid) {
    const u = realUnits(course(cid))[0];
    startSession({ kind: "diag", cid, items: diagItems(cid, u), diag: { unit: 0, passed: [] } });
  }
  // test de una sola unidad: si lo aprobás, se abre esa unidad aunque la anterior no esté completa
  function startUnitTest(cid, unitId) {
    const units = realUnits(course(cid)), idx = units.findIndex(u => u.id === unitId);
    if (idx < 0) return;
    startSession({ kind: "diag", cid, items: diagItems(cid, units[idx]), diag: { unit: idx, passed: [], single: true } });
  }
  const diagItems = (cid, u) => E.unitDiagnostic(course(cid), u).map(t => ({ cid, tpl: t, seed: E.newSeed(), src: "diag", unit: u.index }));

  // ---------- JUEGOS ----------
  // Jefe de unidad: al completar una unidad aparece su jefe (una paradoja famosa). Tenés 3 vidas;
  // cada acierto le saca vida y 3 seguidos pegan doble. Contrarreloj: 60 s de preguntas rápidas
  // de las lecciones abiertas, con multiplicador por racha. Los dos califican el repaso espaciado.
  const BOSSES = [
    { name: "Zenón de Elea", color: "#8E7CF0", taunt: "Para llegar a la respuesta primero tenés que llegar a la mitad…" },
    { name: "el demonio de Maxwell", color: "#E5484D", taunt: "Yo separo las respuestas buenas de las malas. ¿Y vos?" },
    { name: "el hotel de Hilbert", color: "#0EA5C6", taunt: "Siempre tengo lugar para un ejercicio más." },
    { name: "el monstruo de Weierstrass", color: "#1FA866", taunt: "Soy continuo en todos lados y derivable en ninguno." },
    { name: "la trompeta de Gabriel", color: "#E0A21B", taunt: "Volumen finito, superficie infinita. Pintame si podés." },
    { name: "el genio de Laplace", color: "#5B4BDB", taunt: "Conozco todas las condiciones iniciales. Hasta las tuyas." },
    { name: "la paradoja de los gemelos", color: "#FF8A1F", taunt: "Mientras dudás, tu gemelo ya envejeció." },
    { name: "Banach-Tarski", color: "#C2414A", taunt: "De una esfera saco dos. De un error, saco dos más." },
    { name: "la curva de Peano", color: "#15804D", taunt: "Lleno todo el cuadrado. ¿Te queda lugar para pensar?" }
  ];
  function bossFor(cid, u) {
    const ci = Math.max(0, E.courseOrder.indexOf(cid));
    return BOSSES[(ci * 4 + u.index) % BOSSES.length];
  }
  function bossSvg(b) {
    const mouth = b.hp <= 0 ? "M30 58 Q40 50 50 58" : b.anim === "atk" ? "M30 52 Q40 62 50 52" : "M31 55 L36 52 L40 56 L44 52 L49 55";
    return `<svg class="boss-svg ${b.anim || ""}" viewBox="0 0 80 80" aria-hidden="true">
      <path d="M12 68 Q6 28 40 10 Q74 28 68 68 Q61 61 54 68 Q47 61 40 68 Q33 61 26 68 Q19 61 12 68Z" fill="${b.color}"/>
      <ellipse cx="29" cy="36" rx="7" ry="8" fill="#fff"/><ellipse cx="51" cy="36" rx="7" ry="8" fill="#fff"/>
      <circle cx="31" cy="38" r="3.5" fill="#1B1B2F"/><circle cx="49" cy="38" r="3.5" fill="#1B1B2F"/>
      <path d="M20 25 L36 30 M60 25 L44 30" stroke="#1B1B2F" stroke-width="3.5" stroke-linecap="round"/>
      <path d="${mouth}" stroke="#1B1B2F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const RUSH_MS = 60000;
  let rushTimer = null;
  const rushLeft = () => { const s = ui.session; return s && s.rush ? Math.max(0, s.rush.end - Date.now()) : 0; };
  const rushMult = st => Math.min(4, 1 + Math.floor(st / 3));
  function gameHud(s) {
    if (s.boss) {
      const b = s.boss;
      return `<div class="game-hud">${bossSvg(b)}<div class="grow"><b>${esc(b.name[0].toUpperCase() + b.name.slice(1))}</b>
        ${b.anim ? "" : `<div class="muted small boss-say">«${esc(b.taunt)}»</div>`}
        <div class="bar"><i style="width:${b.hp / b.max * 100}%"></i></div>
        <div class="hearts">${[0, 1, 2].map(i => `<span class="${i < b.lives ? "" : "off"}">${icon("heart")}</span>`).join("")}${b.streak >= 2 ? `<span class="combo">${icon("zap")}racha ${b.streak}${b.streak >= 3 ? " · golpe doble" : ""}</span>` : ""}</div></div></div>`;
    }
    const r = s.rush;
    return `<div class="game-hud"><div class="grow"><span class="muted small">Puntos</span><div class="rush-score">${r.score}</div></div>
      <div style="text-align:right">${r.streak >= 3 ? `<span class="combo">${icon("zap")}×${rushMult(r.streak)}</span>` : `<span class="muted small">racha ${r.streak}</span>`}</div></div>
      ${r.flash ? `<div class="rush-flash ${r.flash.ok ? "ok" : "bad"}" style="margin-top:8px">${r.flash.html}</div>` : ""}`;
  }
  // ítems de un juego: del jefe, las plantillas de la unidad de menor a mayor dificultad; del contrarreloj, preguntas rápidas
  function gameItems(s, n) {
    const c = course(s.cid), r = E.rng(E.newSeed()), out = [];
    let pool = r.shuffle(s.pool.slice());
    if (s.boss) pool.sort((a, b) => c.templates[a].difficulty - c.templates[b].difficulty);
    while (out.length < n) {
      if (!pool.length) pool = r.shuffle(s.pool.slice());
      out.push({ cid: s.cid, tpl: pool.shift(), seed: E.newSeed(), src: s.kind });
    }
    return out;
  }
  function startBoss(cid, unitId) {
    const c = course(cid), units = realUnits(c), u = units.find(x => x.id === unitId);
    if (!u || !unitDone(cid, u)) return;
    const b = bossFor(cid, u);
    const pool = u.lessons.flatMap(l => l.templates);
    const s0 = { kind: "boss", cid, pool, boss: Object.assign({ unit: u.id, idx: u.index, hp: 8, max: 8, lives: 3, streak: 0 }, b) };
    s0.items = gameItems(s0, 12);
    startSession(s0);
  }
  function bossAnswered(ok) {
    const b = ui.session.boss;
    if (ok) {
      b.streak++;
      const dmg = b.streak >= 3 ? 2 : 1;
      b.hp = Math.max(0, b.hp - dmg); b.anim = "hit";
      return b.hp <= 0 ? "¡Golpe final! El jefe cayó." : dmg > 1 ? `¡Golpe doble! Le quedan ${b.hp} de vida.` : `¡Le pegaste! Le quedan ${b.hp} de vida.`;
    }
    b.lives--; b.streak = 0; b.anim = "atk";
    return b.lives <= 0 ? "Te quedaste sin vidas. Mirá la resolución antes de seguir." : `Te sacó una vida (te ${b.lives === 1 ? "queda 1" : "quedan " + b.lives}).`;
  }
  // preguntas rápidas: opción múltiple, V/F y encontrar el error; si hay pocas, también numéricas fáciles
  function startRush(cid) {
    const c = course(cid), ls = c.lessonList.filter(l => lessonUnlocked(cid, l));
    const all = ls.flatMap(l => l.templates);
    let pool = all.filter(t => ["mc", "tf", "error"].includes(c.templates[t].type));
    if (pool.length < 6) pool = pool.concat(all.filter(t => c.templates[t].type === "numeric" && c.templates[t].difficulty <= 2));
    if (!pool.length) pool = all;
    if (!pool.length) return;
    const s0 = { kind: "rush", cid, pool, rush: { end: Date.now() + RUSH_MS, score: 0, ok: 0, streak: 0, bestStreak: 0 } };
    s0.items = gameItems(s0, 20);
    startSession(s0);
    clearInterval(rushTimer);
    rushTimer = setInterval(() => {
      const s = ui.session;
      if (!s || !s.rush) { clearInterval(rushTimer); return; }
      const left = rushLeft(), el = $("#rushTime"), bar = $(".ses-top .bar > i");
      if (el) { el.textContent = Math.ceil(left / 1000); el.classList.toggle("low", left < 10000); }
      if (bar) bar.style.width = left / RUSH_MS * 100 + "%";
      if (left <= 0 && s.phase === "answer") { clearInterval(rushTimer); Snd.play("complete"); finish(); }
    }, 200);
  }
  function rushAnswered(ok) {
    const s = ui.session, r = s.rush;
    if (ok) { r.streak++; r.ok++; r.bestStreak = Math.max(r.bestStreak, r.streak); const p = 10 * rushMult(r.streak); r.score += p; r.flash = { ok, html: `+${p}` }; }
    else { r.streak = 0; r.flash = { ok, html: correctText(s.inst) }; }
    Snd.play(ok ? "correct" : "wrong");
    if (!ok && navigator.vibrate) navigator.vibrate(40);
    rerenderAnswer();
    $("#hud").innerHTML = gameHud(s);
    r.flash = null;
    r.adv = setTimeout(next, ok ? 550 : 1800);
  }
  function gamesCard(cid) {
    const c = course(cid), cs = cState(cid), units = realUnits(c);
    const won = units.filter(u => (cs.bosses || {})[u.id] && cs.bosses[u.id].won).length;
    return `<section class="card games-card"><div class="row" style="gap:10px">${icon("swords")}<div class="grow"><b>Juegos</b>
      <p class="muted small" style="margin:2px 0 0">Al completar cada unidad aparece su jefe al final del camino (${won}/${units.length} vencidos). El contrarreloj te da 60 segundos de preguntas rápidas de lo que ya abriste.</p></div></div>
      <button class="exam-row" data-act="rush" data-cid="${cid}"><span class="grow"><b>Contrarreloj</b><span class="muted small" style="display:block">60 s · 3 aciertos seguidos multiplican los puntos</span></span>
        <span class="exam-best ${cs.rush ? "pass" : ""}">${cs.rush ? `récord ${cs.rush}` : "Sin jugar"}</span>${icon("chevron-right")}</button></section>`;
  }

  // ---------- EJERCICIO DEL DÍA ----------
  // uno por día, de lo que ya completaste, de los más exigentes; un solo intento
  function dailyChallenge() {
    const cands = [];
    for (const cid of E.courseOrder) {
      const c = course(cid);
      for (const l of c.lessonList) if (lessonDone(cid, l)) for (const t of l.templates) cands.push({ cid, tpl: t, difficulty: c.templates[t].difficulty, type: c.templates[t].type });
    }
    return E.dailyPick(cands, today());
  }
  // días seguidos con el ejercicio del día bien resuelto (hoy cuenta solo si ya lo hiciste)
  function dailyStreak() {
    let n = 0, d = today();
    if (!S.daily[d]) d = E.addDays(d, -1);
    while (S.daily[d] && S.daily[d].ok) { n++; d = E.addDays(d, -1); }
    return n;
  }
  function dailyCard() {
    const t = today(), done = S.daily[t], ch = done || dailyChallenge();
    if (!ch || !course(ch.cid) || !course(ch.cid).templates[ch.tpl]) return "";
    const c = course(ch.cid), tp = c.templates[ch.tpl], ds = dailyStreak();
    const st = done ? (done.ok ? `<span class="exam-best pass">${icon("check")}Resuelto</span>` : `<span class="exam-best fail">Mañana hay otro</span>`)
      : `<span class="exam-best">+${DAILY_XP} XP</span>`;
    return `<button class="card daily-card" data-act="challenge" ${done ? "disabled" : ""}>
      <span class="daily-ico">${icon("calendar")}</span>
      <span class="grow"><b>Ejercicio del día</b>
        <span class="muted small" style="display:block">${esc(c.code || c.title)} · ${esc(c.concepts[tp.concepts[0]].name)} · ${"★".repeat(tp.difficulty)}</span>
        ${ds >= 2 ? `<span class="muted small" style="display:block">${icon("flame")}${ds} días seguidos</span>` : ""}</span>${st}</button>`;
  }
  const DAILY_XP = 30;
  function startChallenge() {
    const t = today();
    if (S.daily[t]) return;
    const ch = dailyChallenge();
    if (!ch) return;
    startSession({ kind: "challenge", cid: ch.cid, challenge: ch, items: [{ cid: ch.cid, tpl: ch.tpl, seed: ch.seed, src: "challenge" }] });
  }

  function startSession(opts) {
    S.activeCourse = opts.cid;
    ui.session = Object.assign({
      i: 0, xp: 0, firstN: 0, firstOk: 0, lessonN: 0, lessonOk: 0,
      grades: {}, t0: Date.now(), phase: "answer", ans: null, inst: null
    }, opts);
    ui.route = "session";
    if (location.hash !== "#/sesion") history.pushState(null, "", "#/sesion");
    if (opts.intro) renderIntro(); else renderExercise();
  }

  // ---------- navegación ----------
  function go(route, params = {}) {
    const hash = { home: "#/", league: "#/liga", career: "#/carrera", course: "#/curso/" + params.id, learn: "#/aprender", stats: "#/stats", settings: "#/ajustes", credits: "#/creditos" }[route] || "#/";
    if (location.hash !== hash) history.pushState(null, "", hash);
    ui.route = route; ui.params = params;
    render();
  }
  function fromHash() {
    const h = location.hash.replace(/^#\/?/, "");
    if (h.startsWith("curso/")) { ui.route = "course"; ui.params = { id: h.slice(6) }; }
    else if (h === "stats") ui.route = "stats";
    else if (h === "carrera") ui.route = "career";
    else if (h === "liga") ui.route = "league";
    else if (h === "aprender") ui.route = "learn";
    else if (h === "ajustes") ui.route = "settings";
    else if (h === "creditos") ui.route = "credits";
    else ui.route = "home";
    if (ui.route === "course" && !E.courses[ui.params.id]) ui.route = "home";
  }
  window.addEventListener("popstate", () => {
    if (ui.learn) {
      const after = ui.learn.after;
      if (ui.learn.closing) ui.learn = null;
      else { ui.learn.stack.pop(); if (!ui.learn.stack.length) ui.learn = null; }
      renderLearn();
      if (!ui.learn && after) after();
      return;
    }
    if (ui.session) {
      if (!confirm("¿Salir de la sesión? Se pierde el progreso de esta sesión.")) { history.pushState(null, "", "#/sesion"); return; }
      if (ui.session.rush) { clearTimeout(ui.session.rush.adv); clearInterval(rushTimer); }
      ui.session = null;
    }
    fromHash(); render();
  });

  function nav(active) {
    const b = (r, ic, label, params) => `<button class="${active === r ? "on" : ""}" data-act="go" data-r="${r}" ${params ? `data-id="${params}"` : ""}>${icon(ic)}<span>${label}</span></button>`;
    return `<nav class="nav" aria-label="Principal"><div class="nav-inner">
      ${b("home", "house", "Inicio")}${b("career", "map", "Carrera")}${b("learn", "graduation-cap", "Aprender")}
      ${b("stats", "chart-column", "Stats")}${b("settings", "settings", "Ajustes")}</div></nav>`;
  }
  function topbar() {
    const st = shownStreak();
    return `<header class="topbar">
      <div class="logo">${mascot("idle")}efecen</div>
      <div class="chips">
        ${boardBtn()}
        <span class="chip fire ${st ? "" : "off"}" title="Racha de días">${icon("flame")}${st}</span>
        <span class="chip xp" title="XP total">${icon("star")}${S.xp}</span>
      </div></header>`;
  }

  // pizarra (board.js): solo aparece en tablets o si ya se usó un lápiz
  const boardBtn = (cls = "") => E.board && E.board.available() ? `<button class="iconbtn board-btn ${cls} ${E.board.isOpen ? "on" : ""}" data-act="board" aria-label="Pizarra" title="Pizarra">${icon("pen-line")}</button>` : "";
  function boardContext(info) { if (E.board) E.board.context(info); }
  let boardAvail = E.board && E.board.available();
  if (E.board) E.board.onChange(() => {
    for (const b of $$(".board-btn")) b.classList.toggle("on", E.board.isOpen);
    // al detectar un lápiz por primera vez aparece el botón
    if (E.board.available() !== boardAvail) { boardAvail = !boardAvail; if (!ui.session && !ui.learn) render(); }
  });
  function render() {
    ui.graphs.clear();
    for (const st of ui.viz.values()) st.playing = false;
    ui.viz.clear();
    if (ui.route !== "session") boardContext(null);
    document.documentElement.toggleAttribute("data-theme", S.settings.theme !== "auto");
    if (S.settings.theme !== "auto") document.documentElement.dataset.theme = S.settings.theme;
    const screens = { home: renderHome, career: renderCareer, course: renderCourse, learn: renderLearnIndex, stats: renderStats, settings: renderSettings, credits: renderCredits, league: renderLeague, summary: renderSummary, "exam-result": renderExamResult };
    if (ui.route === "session" && ui.session) return;
    (screens[ui.route] || renderHome)();
    window.scrollTo(0, 0);
    askLogin();
  }

  // ---------- INICIO ----------
  function ring(value, goal) {
    const r = 26, C = 2 * Math.PI * r, p = Math.min(1, value / goal);
    return `<svg class="ring" viewBox="0 0 64 64" role="img" aria-label="${value} de ${goal} XP hoy">
      <circle class="bg" cx="32" cy="32" r="${r}"/>
      <circle class="fg" cx="32" cy="32" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 32 32)"/>
      <text x="32" y="37" text-anchor="middle">${Math.round(p * 100)}%</text></svg>`;
  }
  function subjectCard(sub, extra = "") {
    const ok = hasContent(sub), p = ok ? courseProgress(sub.course) : 0, c = ok && course(sub.course);

  // ---------- SESIÓN: ejercicio ----------
  const TYPE_LABEL = { mc: "Elegí la opción correcta", numeric: "Respuesta numérica", tf: "Verdadero o falso", order: "Ordená los pasos", match: "Uní los pares", error: "Encontrá el error" };
  function renderExercise() {
    const s = ui.session, item = s.items[s.i], c = course(item.cid || s.cid);
    if (!item.inst) item.inst = E.instantiate(c, item.tpl, item.seed);
    const inst = s.inst = item.inst;
    s.phase = "answer"; s.ans = initAns(inst); s.tStart = Date.now();
    const prog = s.kind === "boss" ? 1 - s.boss.hp / s.boss.max : s.kind === "rush" ? rushLeft() / RUSH_MS : s.i / s.items.length;
    const tag = item.src === "review" ? `<span class="ses-tag review">${icon("rotate-ccw")}Repaso · ${esc(c.concepts[item.focus || c.templates[item.tpl].concepts[0]].name)}</span>`
      : item.src === "diag" ? `<span class="ses-tag">${icon("target")}Diagnóstico · Unidad ${item.unit + 1}</span>`
      : item.src === "challenge" ? `<span class="ses-tag review">${icon("calendar")}Ejercicio del día · un solo intento</span>`

    app.innerHTML = `<div class="session">
      <div class="ses-top"><button class="iconbtn" data-act="quit" aria-label="Salir">${icon("x")}</button><div class="bar ${s.kind === "rush" ? "gold" : ""}"><i style="width:${prog * 100}%"></i></div>${s.kind === "rush" ? `<span class="rush-time" id="rushTime">${Math.ceil(rushLeft() / 1000)}</span>` : ""}${boardBtn()}</div>
      <div class="ses-body">${s.kind === "boss" || s.kind === "rush" ? `<div id="hud">${gameHud(s)}</div>` : ""}${tag}
        <div class="prompt">${texL(inst.prompt)}</div>
        ${inst.graph ? graphHtml(inst.graph) : ""}
        <div id="answer">${answerHtml(inst, s.ans)}</div>
      </div>
      <div class="ses-foot"><div class="ses-foot-inner"><button class="btn block" data-act="check" id="checkBtn" disabled>Comprobar</button></div></div>
      <div class="sheet" id="sheet"></div></div>`;
    drawGraphs();
    updateCheck();
    // cada ejercicio tiene su hoja en la pizarra; el enunciado va sin links (la pizarra tapa los apuntes)
    if (!item.boardKey) item.boardKey = s.t0 + "-" + s.i;
    boardContext(ui.boardCtx = { key: item.boardKey, label: c.code + " · " + (c.concepts[c.templates[item.tpl].concepts[0]] || {}).name,
      prompt: tex(inst.prompt).replace(/<a class="term"[^>]*>([\s\S]*?)<\/a>/g, "$1") });
    const ni = $(".numin");
    if (ni && matchMedia("(pointer: fine)").matches) ni.focus();
  }
  function initAns(inst) {
    switch (inst.type) {
      case "order": return { placed: [], order: E.rng(E.newSeed()).shuffle(inst.steps.map((_, i) => i)) };
      case "match": {
        const r = E.rng(E.newSeed());
        return { right: r.shuffle(inst.pairs.map((_, i) => i)), pairs: {}, sel: null };
      }
      default: return { v: null };
    }
  }
  function answerHtml(inst, a, done) {
    const dis = done ? "disabled" : "";
    switch (inst.type) {
      case "mc":
        return `<div class="options">${inst.options.map((o, i) => {
          let cls = a.v === i ? "sel" : "";
          if (done) cls = i === inst.correct ? "right" : a.v === i ? "wrong" : "";
          return `<button class="opt ${cls}" data-act="opt" data-i="${i}" ${dis}><span class="k">${i + 1}</span><span class="ov">${tex(o)}</span></button>`;
        }).join("")}</div>`;
      case "tf":
        return `<div class="tf">${[true, false].map((v, i) => {
          let cls = a.v === v ? "sel" : "";
          if (done) cls = v === inst.answer ? "right" : a.v === v ? "wrong" : "";
          return `<button class="opt ${cls}" data-act="tf" data-v="${v}" ${dis}>${icon(v ? "check" : "x")}${v ? "Verdadero" : "Falso"}</button>`;
        }).join("")}</div>`;
      case "numeric":
        return `<div class="numwrap">
          <input class="numin ${done ? (s_ok() ? "right" : "wrong") : ""}" id="numin" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta" value="${esc(a.v || "")}" ${dis} aria-label="Respuesta">
          <div class="preview" id="preview">${previewText(a.v)}</div>
          ${done ? "" : `<div class="keys">${["π", "√(", "/", "^", "(", ")", "-", "e", "×10^"].map(k => `<button data-act="key" data-k="${k}" tabindex="-1">${k}</button>`).join("")}</div>`}
          <div class="muted small">Podés escribir fracciones, π, √, e y notación científica (1,6×10^-19). Se acepta ±1%.</div></div>`;
      case "order": {
        const step = (i, n, act, cls = "") => `<button class="step ${cls}" data-act="${act}" data-i="${i}" ${dis}>${n != null ? `<span class="n">${n}</span>` : ""}<span class="ov">${tex(inst.steps[i])}</span></button>`;
        const placed = a.placed.map((i, k) => step(i, k + 1, "ord-rem", done ? (i === k ? "right" : "wrong") : "")).join("");
        const pool = a.order.filter(i => !a.placed.includes(i)).map(i => step(i, null, "ord-add")).join("");
        return `<div class="steps-ans">${placed}</div><div class="muted small" style="margin:4px 0">${done ? "" : "Pasos disponibles:"}</div><div class="steps-pool">${pool}</div>`;
      }
      case "match": {
        const PC = ["#5B4BDB", "#FF8A1F", "#1FA866", "#E5484D", "#0EA5C6"];
        const pairNo = {};
        Object.entries(a.pairs).forEach(([l, r], k) => { pairNo["L" + l] = k; pairNo["R" + r] = k; });
        const item = (side, i, content) => {
          const key = side + i, p = pairNo[key];
          let cls = a.sel === key ? "sel" : "";
          if (done && side === "L") cls = a.pairs[i] === i ? "right" : "wrong";
          if (done && side === "R") { const l = Object.keys(a.pairs).find(x => a.pairs[x] === i); cls = l != null && +l === i ? "right" : "wrong"; }
          const st = p != null ? `style="--pc:${PC[p % PC.length]}" data-pair="${p}"` : "";
          return `<button class="mitem ${cls}" data-act="m" data-k="${key}" ${st} ${dis}>${p != null ? `<span class="badge">${p + 1}</span>` : ""}${content}</button>`;
        };
        const cont = it => it.graph ? graphHtml(it.graph, "mini") : `<span class="ov">${tex(H.m(it.tex))}</span>`;
        return `<div class="match"><div class="col">${inst.pairs.map((p, i) => item("L", i, cont(p[0]))).join("")}</div>
          <div class="col">${a.right.map(i => item("R", i, cont(inst.pairs[i][1]))).join("")}</div></div>`;
      }
      case "error":
        return `<div class="steps-pool">${inst.steps.map((st, i) => {
          let cls = a.v === i ? "sel" : "";
          if (done) cls = i === inst.wrongIndex ? "right" : a.v === i ? "wrong" : "";
          return `<button class="step ${cls}" data-act="err" data-i="${i}" ${dis}><span class="n">${i + 1}</span><span class="ov">${tex(st)}</span></button>`;
        }).join("")}</div>`;
    }
    return "";
  }
  const s_ok = () => ui.session && ui.session.lastOk;
  // respuesta numérica en TeX: notación científica si es muy chica o muy grande
  function ansTex(x) {
    const a = Math.abs(x);
    if (!isFinite(x) || !a || (a >= 1e-3 && a < 1e6)) return H.num(x, 4);
    const ex = Math.floor(Math.log10(a));
    return `${String(+(x / 10 ** ex).toFixed(3)).replace(".", "{,}")} \\times 10^{${ex}}`;
  }
  function previewText(v) {
    if (!v) return "";
    const x = E.parseNum(v);
    if (!isFinite(x)) return "…";
    const a = Math.abs(x);
    if (a && (a < 1e-3 || a >= 1e6)) { const ex = Math.floor(Math.log10(a)); return `= ${String(+(x / 10 ** ex).toFixed(3)).replace(".", ",")} × 10^${ex}`; }
    return "= " + H.num(x, 4);
  }
  function ready(inst, a) {
    switch (inst.type) {
      case "numeric": return isFinite(E.parseNum(a.v));
      case "order": return a.placed.length === inst.steps.length;
      case "match": return Object.keys(a.pairs).length === inst.pairs.length;
      default: return a.v !== null;
    }
  }
  function isCorrect(inst, a) {
    switch (inst.type) {
      case "mc": return a.v === inst.correct;
      case "tf": return a.v === inst.answer;
      case "numeric": return E.checkNumeric(E.parseNum(a.v), inst.answer, inst.tolerance ?? 0.01);
      case "order": return a.placed.every((v, i) => v === i);
      case "match": return inst.pairs.every((_, i) => a.pairs[i] === i);
      case "error": return a.v === inst.wrongIndex;
    }
    return false;
  }
  function updateCheck() {
    const b = $("#checkBtn"), s = ui.session;
    if (b && s && s.phase === "answer") b.disabled = !ready(s.inst, s.ans);
  }
  function rerenderAnswer() {
    const s = ui.session;
    $("#answer").innerHTML = answerHtml(s.inst, s.ans, s.phase !== "answer");
    drawGraphs($("#answer"));
    updateCheck();
    if (s.kind === "exam") examNavRefresh();
  }
  function correctText(inst) {
    switch (inst.type) {
      case "mc": return `Respuesta correcta: ${tex(inst.options[inst.correct])}`;
      case "tf": return `Era <b>${inst.answer ? "Verdadero" : "Falso"}</b>.`;
      case "numeric": return `Respuesta: ${tex("$" + (inst.answerTex || ansTex(inst.answer)) + "$")}${inst.answerTex && !Number.isInteger(inst.answer) ? ` ≈ ${H.num(inst.answer, 4)}` : ""}`;
      case "order": return "Mirá el orden correcto en la resolución.";
      case "match": return "Los pares correctos quedaron en verde.";
      case "error": return `El error estaba en el paso ${inst.wrongIndex + 1}. ${texL(inst.fix || "")}`;
    }
    return "";
  }

  function check() {
    const s = ui.session;
    if (s && s.kind === "exam") { if (s.phase === "answer") s.i < s.parts.length - 1 ? examGo(s.i + 1) : submitExam(); return; }
    if (!s || s.phase !== "answer" || !ready(s.inst, s.ans)) return;
    const item = s.items[s.i], icid = item.cid || s.cid, c = course(icid), t = c.templates[item.tpl];
    const ok = isCorrect(s.inst, s.ans);
    const ms = Date.now() - s.tStart;
    s.phase = "feedback"; s.lastOk = ok;
    const first = !item.retry;
    let gain = 0;
    if (first) {
      s.firstN++; if (ok) s.firstOk++;
      if (item.src === "lesson") { s.lessonN++; if (ok) s.lessonOk++; }
      const q = E.srs.grade(ok, ms, t.difficulty);
      for (const k of t.concepts) (s.grades[ckey(icid, k)] = s.grades[ckey(icid, k)] || []).push(q);
      S.answered++; if (ok) S.answeredOk++;
      gain = ok ? (item.src === "diag" ? 5 : s.kind === "rush" ? 3 : s.challenge ? DAILY_XP : 10) : 0;
    } else if (ok) gain = 5;
    s.xp += gain;
    if (s.kind === "rush") return rushAnswered(ok);
    const bossMsg = s.kind === "boss" ? bossAnswered(ok) : "";
    // si falló, vuelve al final de la cola con valores nuevos (salvo en el diagnóstico y los juegos)
    if (!ok && first && item.src !== "diag" && !s.boss && !s.challenge) s.items.push({ cid: icid, tpl: item.tpl, seed: E.newSeed(), src: item.src, focus: item.focus, retry: true });
    if (item.src === "diag") diagProgress(item, ok);
    Snd.play(ok ? "correct" : "wrong");
    if (!ok && navigator.vibrate) navigator.vibrate(40);
    rerenderAnswer();
    if (s.boss) { $("#hud").innerHTML = gameHud(s); $(".ses-top .bar > i").style.width = (1 - s.boss.hp / s.boss.max) * 100 + "%"; }
    else $(".ses-top .bar > i").style.width = ((s.i + 1) / s.items.length * 100) + "%";
    const titles = ok ? ["¡Bien!", "¡Excelente!", "¡Eso!", "¡Joya!", "¡Genial!", "¡Impecable!"] : ["Casi...", "Ojo acá", "Uy, no", "Mmm…"];
    const sol = s.inst.solution || [];
    const sheet = $("#sheet");
    sheet.className = "sheet " + (ok ? "ok" : "bad");
    sheet.innerHTML = `<div class="sheet-inner">
      <div class="fb-head">${mascot(ok ? "happy" : "sad")}<div class="grow"><div class="fb-title">${titles[Math.floor(Math.random() * titles.length)]}</div>
        <div class="fb-quip">${esc(bossMsg || quip(ok ? "ok" : "bad"))}${gain ? ` <span class="xp-pop pop">+${gain} XP</span>` : ""}</div></div></div>
      <div class="fb-scroll">
        ${ok && s.inst.type !== "tf" && s.inst.type !== "error" ? "" : `<div class="fb-answer">${correctText(s.inst)}</div>`}
        ${s.inst.explanation ? `<div>${texL(s.inst.explanation)}</div>` : ""}
        ${sol.length ? `<button class="linkbtn" data-act="sol">${icon("book-open")} ${ok ? "Ver resolución" : "Ocultar resolución"}</button>
        <div class="solution" id="sol" ${ok ? "hidden" : ""}><ol>${sol.map(x => `<li>${texL(x)}</li>`).join("")}</ol></div>` : ""}
        ${theoryChips(icid, t.concepts, ok ? "Teoría:" : "Repasá la teoría:")}
      </div>
      <button class="btn block ${ok ? "ok" : "bad"}" data-act="next">Continuar</button></div>`;
    $(".ses-foot").style.visibility = "hidden";
    requestAnimationFrame(() => sheet.classList.add("show"));
  }
  function next() {
    const s = ui.session;
    if (!s) return;
    if (s.boss && (s.boss.hp <= 0 || s.boss.lives <= 0)) return finish();
    if (s.rush) { clearTimeout(s.rush.adv); if (rushLeft() <= 0) return finish(); }
    s.i++;
    // los juegos no tienen largo fijo: siguen hasta que gana alguien o se acaba el tiempo
    if (s.i >= s.items.length && (s.boss || s.rush)) s.items.push(...gameItems(s, 10));
    if (s.i >= s.items.length) return finish();
    renderExercise();
  }

  // diagnóstico: 3 ejercicios por unidad, aprueba con 2/3, corta en la primera que no aprueba
  function diagProgress(item, ok) {
    const s = ui.session, d = s.diag;
    d.ok = (d.ok || 0) + (ok ? 1 : 0);
    d.n = (d.n || 0) + 1;
    const u = realUnits(course(s.cid))[d.unit];
    if (d.n < E.unitDiagnostic(course(s.cid), u).length) return;
    const pass = d.ok >= Math.ceil(d.n * 2 / 3);
    d.ok = 0; d.n = 0;
    if (pass) {
      d.passed.push(u.index);
      const nextU = !d.single && realUnits(course(s.cid))[d.unit + 1];
      if (nextU) { d.unit++; s.items.push(...diagItems(s.cid, nextU)); }
    }
  }
  function applyDiagnostic(s) {
    const c = course(s.cid), cs = cState(s.cid), t = today();
    const r = E.rng(E.newSeed());
    for (const ui2 of s.diag.passed) {
      const u = c.units[ui2];
      cs.unitsOpen[u.id] = true;
      for (const l of u.lessons) {
        cs.lessons[l.id] = Object.assign(cs.lessons[l.id] || {}, { done: true, tested: true, best: 1 });
        for (const k of l.concepts) {
          const key = ckey(s.cid, k);
          const card = S.srs[key] || E.srs.newCard();
          if (!card.last) Object.assign(card, { ef: 2.5, reps: 2, int: 4, due: E.addDays(t, r.int(2, 6)), last: t });
          S.srs[key] = card;
        }
      }
    }
    if (!s.diag.single) cs.diag = "done";
  }

  // suma XP del día y actualiza la racha (lecciones, repasos y evaluaciones)
  function addXp(xp) {
    const t = today(), before = xpToday();
    S.xp += xp;
    S.xpByDay[t] = before + xp;
    let streakUp = false;
    if (S.lastActive !== t) {
      S.streak = S.lastActive && E.diffDays(S.lastActive, t) === 1 ? S.streak + 1 : 1;
      S.lastActive = t; streakUp = true;
      S.bestStreak = Math.max(S.bestStreak, S.streak);
    }
    return { streakUp, goalHit: before < E.DAILY_GOAL && S.xpByDay[t] >= E.DAILY_GOAL };
  }
  function finish() {
    const s = ui.session, cid = s.cid, cs = cState(cid), t = today();
    // 1) repetición espaciada: una actualización por concepto y por día
    for (const [key, qs] of Object.entries(s.grades)) {
      const card = S.srs[key] || E.srs.newCard();
      card.seen += qs.length;
      card.ok += qs.filter(q => q >= 3).length;
      const q = Math.round(qs.reduce((a, b) => a + b, 0) / qs.length);
      S.srs[key] = (card.last === t && s.kind !== "diag") ? card : (s.kind === "diag" ? card : E.srs.update(card, q, t));
    }
    // 2) lección
    let lessonDoneNow = false, lessonAcc = null;
    if (s.lessonId && s.lessonN) {
      const st = cs.lessons[s.lessonId] = cs.lessons[s.lessonId] || {};
      lessonAcc = s.lessonOk / s.lessonN;
      st.plays = (st.plays || 0) + 1;
      st.best = Math.max(st.best || 0, lessonAcc);
      if (lessonAcc >= 0.75 && !st.done) { st.done = true; lessonDoneNow = true; s.xp += 10; if (lessonAcc === 1) s.xp += 5; }
    }
    if (s.kind === "diag") applyDiagnostic(s);
    let record = false;
    if (s.boss) {
      const b = s.boss, bs = (cs.bosses = cs.bosses || {})[b.unit] = cs.bosses[b.unit] || { won: false, wins: 0 };
      b.won = b.hp <= 0;
      if (b.won) { s.xp += bs.won ? 15 : 30; bs.won = true; bs.wins = (bs.wins || 0) + 1; }
    }
    if (s.challenge) {
      const d = s.challenge;
      S.daily[t] = { cid: d.cid, tpl: d.tpl, ok: s.firstOk > 0 };
      // se guardan los últimos 120 días
      for (const k of Object.keys(S.daily).sort().slice(0, -120)) delete S.daily[k];
    }
    if (s.rush) { record = s.rush.score > (cs.rush || 0); if (record) cs.rush = s.rush.score; clearInterval(rushTimer); }
    // 3) XP, racha y registro
    const { streakUp, goalHit } = addXp(s.xp);
    const lesson = s.lessonId && course(cid).lessonList.find(x => x.id === s.lessonId);
    const title = s.kind === "diag" ? "Test diagnóstico" : s.kind === "practice" ? "Práctica: " + s.title : s.boss ? "Jefe: " + s.boss.name : s.rush ? "Contrarreloj" : s.challenge ? "Ejercicio del día" : lesson ? lesson.title : "Repaso";
    S.log.unshift({ d: t, kind: s.kind, title, n: s.firstN, ok: s.firstOk, xp: s.xp, c: cid });
    S.log = S.log.slice(0, 60);
    save();
    ui.summary = { s, lessonDoneNow, lessonAcc, streakUp, goalHit, record, ms: Date.now() - s.t0 };
    ui.session = null;
    ui.route = "summary";
    history.replaceState(null, "", "#/");
    renderSummary();
    Snd.play(lessonDoneNow || goalHit ? "complete" : streakUp ? "streak" : "complete");
    if (lessonDoneNow || goalHit || (s.kind === "diag" && s.diag.passed.length) || (s.boss && s.boss.won) || (record && s.rush.score) || (s.challenge && s.firstOk)) confetti();
  }

  // ---------- RESUMEN ----------
  function renderSummary() {
    const z = ui.summary;
    if (!z) { ui.route = "home"; return render(); }
    const s = z.s, acc = s.firstN ? s.firstOk / s.firstN : 0;
    const mm = Math.floor(z.ms / 60000), ss = Math.floor(z.ms / 1000) % 60;
    let title = "¡Sesión terminada!", sub = "";
    if (s.kind === "diag") {
      const units = s.diag.passed.map(i => course(s.cid).units[i].title);
      title = units.length ? (s.diag.single ? "¡Unidad desbloqueada!" : "¡Diagnóstico listo!") : s.diag.single ? "Todavía no" : "Arrancamos desde el principio";
      sub = units.length ? `Desbloqueaste: ${units.join(", ")}. Esos temas van a volver como repaso.`
        : s.diag.single ? "Para abrir la unidad necesitás 2 de 3. Pegale una leída a los apuntes y probá de nuevo cuando quieras."
        : "No pasa nada: así repasás todo con calma, desde la primera lección.";
    } else if (s.boss) {
      const b = s.boss;
      title = b.won ? `¡Venciste a ${b.name}!` : `${b.name} ganó esta vez`;
      sub = b.won ? `La unidad «${course(s.cid).units[b.idx].title}» ya tiene su corona. Podés volver a desafiarlo cuando quieras.`
        : `Le sacaste ${b.max - b.hp} de ${b.max} puntos de vida. Repasá lo que te costó y volvé a desafiarlo.`;
    } else if (s.challenge) {
      const ds = dailyStreak();
      title = s.firstOk ? "¡Ejercicio del día resuelto!" : "Hoy no salió";
      sub = s.firstOk ? (ds >= 2 ? `Llevás ${ds} días seguidos resolviéndolo.` : "Mañana te espera otro, de lo que ya aprendiste.")
        : "Mirá bien la resolución: este tema va a volver en tus repasos. Mañana hay otro.";
    } else if (s.rush) {
      title = z.record && s.rush.score ? "¡Nuevo récord!" : "¡Se acabó el tiempo!";
      sub = `Hiciste ${s.rush.score} puntos con ${s.rush.ok} aciertos (mejor racha: ${s.rush.bestStreak}). Tu récord en ${course(s.cid).code || course(s.cid).title}: ${cState(s.cid).rush || 0}.`;
    } else if (z.lessonDoneNow) { title = "¡Lección completada!"; sub = "Se desbloqueó lo que sigue en el mapa."; }
    else if (z.lessonAcc != null && z.lessonAcc < 0.75) { title = "¡Casi!"; sub = `Para completar la lección necesitás 75% de aciertos al primer intento (sacaste ${Math.round(z.lessonAcc * 100)}%). Repetila cuando quieras.`; }
    // Schrödi: festeja si terminaste la lección, se prende fuego con la racha
    if (!z.mood) {
      const party = z.lessonDoneNow || (s.kind === "diag" && s.diag.passed.length) || (s.boss && s.boss.won) || (z.record && s.rush.score) || (s.challenge && s.firstOk);
      const streak = z.streakUp && S.streak >= 2;
      z.mood = party ? "party" : s.boss ? "sad" : streak ? "streak" : acc >= 0.6 || s.kind === "diag" ? "happy" : "idle";
      z.quip = party ? quip("party") : streak ? quip("streak", S.streak) : "";
      z.streakQuip = party && streak ? quip("streak", S.streak) : "";
    }
    const extra = [];
    if (z.streakUp) extra.push(`<div class="chip fire pop">${icon("flame")} Racha de ${S.streak} ${S.streak === 1 ? "día" : "días"}</div>`);
    if (z.streakQuip) extra.push(`<p class="muted small" style="width:100%;margin:0">${esc(z.streakQuip)}</p>`);
    if (z.goalHit) extra.push(`<div class="chip xp pop">${icon("target")} ¡Meta diaria cumplida!</div>`);
    app.innerHTML = `<main class="center-col">
      ${mascot(z.mood)}
      <div class="big-title">${esc(title)}</div>
      ${z.quip ? `<div class="bubble">${esc(z.quip)}</div>` : ""}
      ${sub ? `<p class="muted" style="margin:0">${esc(sub)}</p>` : ""}
      <div class="tiles">
        <div class="tile gold"><div class="lab">XP</div><div class="val">${icon("star")}${s.xp}</div></div>
        ${s.rush ? `<div class="tile ok"><div class="lab">Puntos</div><div class="val">${s.rush.score}</div></div>` : `<div class="tile ok"><div class="lab">Precisión</div><div class="val">${Math.round(acc * 100)}%</div></div>`}
        <div class="tile"><div class="lab">Tiempo</div><div class="val">${mm}:${String(ss).padStart(2, "0")}</div></div>
      </div>
      <div class="row" style="flex-wrap:wrap;justify-content:center">${extra.join("")}</div>
      <div class="ses-foot"><div class="ses-foot-inner"><button class="btn block" data-act="go" data-r="${s.kind === "lesson" || s.kind === "diag" || s.boss ? "course" : "home"}" data-id="${s.cid}">Continuar</button>
        ${s.boss || s.rush ? `<button class="btn ghost block" data-act="${s.boss ? "boss" : "rush"}" data-cid="${s.cid}" data-id="${s.boss ? s.boss.unit : ""}">${icon("rotate-ccw")}Otra vez</button>` : ""}</div></div>
    </main>`;
  }

      return { u, seen, ok };

        <div class="heat" style="margin-top:10px">${cells.join("")}</div>
        <div class="heat-legend">menos <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> más</div></section>
      <section class="card"><h2 class="section-title">Precisión por unidad · ${esc(c.title)}</h2>
        <div class="hbar" style="margin-top:10px">${byUnit.map(x => {
          const p = x.seen ? x.ok / x.seen : 0;
          return `<span class="name">${esc(x.u.title)}</span><span class="v">${x.seen ? Math.round(p * 100) + "% · " + x.seen : "sin datos"}</span>
            <span class="bar" data-tip="${esc(x.u.title)}: ${x.ok}/${x.seen} correctas"><i style="width:${p * 100}%"></i></span>`;

  // al abrir la app sin sesión iniciada, Schrödi invita a entrar con Google para no depender del progreso local.

  const ASK_KEY = "efecen-login-ask";
  function askLogin() {
    const sy = E.sync, el = $("#loginAsk");
    if (!sy || sy.user || !sy.ready) { if (el) el.remove(); return; }
    if (el) { const b = $("[data-act=login]", el); b.disabled = !!sy.busy; b.lastChild.textContent = sy.busy ? "Entrando…" : "Entrar con Google"; $(".login-err", el).textContent = sy.error || ""; return; }
    if (ui.session || ui.learn || ui.route !== "home") return;

    try { later = localStorage.getItem(ASK_KEY); } catch (e) { }
    if (later && E.diffDays(later, today()) < 7) return;
    const d = document.createElement("div");
    d.id = "loginAsk"; d.className = "login-ask";
    d.innerHTML = `<div class="login-box" role="dialog" aria-modal="true" aria-labelledby="loginAskT">${mascot("wow")}

      <button class="btn ghost block" data-act="login-later">Ahora no</button>

  }

  // ---------- LIGA DE LA SEMANA ----------
  // Todos suman con las mismas reglas: el XP de la semana (lunes a domingo) se publica en
  // leagues/{lunes}/players/{uid} (sync.js). Hace falta haber entrado con Google.
  const leagueCache = { at: 0, data: null, loading: false, error: null };
  const daysLeft = () => 6 - E.diffDays(E.weekStart(today()), today());
  const leftTxt = () => { const n = daysLeft(); return n === 0 ? "termina hoy" : n === 1 ? "queda 1 día" : `quedan ${n} días`; };
  function loadLeague(force) {
    const lg = E.sync && E.sync.league;
    if (!lg || !E.sync.user || leagueCache.loading) return;

  // ---------- APUNTES: fichas de teoría con hipervínculos ----------
  // El panel se abre encima de cualquier pantalla (también en medio de un ejercicio) y tiene
  // su propio historial: cada link apila una ficha y "atrás" (o el botón del celu) vuelve.
  const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const cardOf = id => E.cards[id];
  function theoryChips(cid, concepts, label) {
    const c = course(cid);
    if (!c.conceptCards) return "";
    const ids = [...new Set(concepts.flatMap(k => c.conceptCards[k] || []))].slice(0, 3);
    if (!ids.length) return "";
    return `<div class="theory-chips"><span class="muted small">${icon("graduation-cap")} ${label}</span>${ids.map(id => `<button class="chip-link" data-act="learn" data-id="${id}">${esc(cardOf(id).title)}</button>`).join("")}</div>`;
  }
  function openLearn(id) {
    if (!id || (!id.startsWith("lesson:") && !cardOf(id))) return;
    if (!ui.learn) ui.learn = { stack: [] };
    if (ui.learn.stack[ui.learn.stack.length - 1] === id) return;
    ui.learn.stack.push(id);
    history.pushState({ learn: ui.learn.stack.length }, "", location.hash || "#/");
    renderLearn();
  }
  function closeLearn(after) {
    if (!ui.learn) { if (after) after(); return; }
    ui.learn.closing = true;
    ui.learn.after = after;
    history.go(-ui.learn.stack.length);
  }
  function renderLearn() {
    let el = $("#learn");
    if (!ui.learn) {
      if (el) el.remove();
      document.body.classList.remove("learn-open");
      boardContext(ui.session ? ui.boardCtx : null);
      if (ui.route === "learn" && !ui.session) render(); // refresca las fichas leídas
      return;
    }
    if (!el) {
      el = document.createElement("div");
      el.id = "learn"; el.className = "learn";
      el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
      document.body.appendChild(el);
    }
    const id = ui.learn.stack[ui.learn.stack.length - 1];
    el.innerHTML = id.startsWith("lesson:") ? lessonNotesHtml(id.slice(7)) : cardHtml(cardOf(id));
    // cada ficha tiene su hoja en la pizarra, con el título y el resumen como "enunciado"
    if (!id.startsWith("lesson:")) { const card = cardOf(id); boardContext({ key: "learn:" + id, label: card.title, prompt: `<b>${esc(card.title)}</b>: ${tex(card.summary)}` }); }
    document.body.classList.add("learn-open");
    el.scrollTop = 0;
    drawGraphs(el);
    fitEqs(el);
    if (!S.read[id]) { S.read[id] = true; save(); }
  }
  function learnHead(crumb) {
    const deep = ui.learn.stack.length > 1;
    return `<header class="learn-head">
      ${deep ? `<button class="iconbtn" data-act="learn-back" aria-label="Atrás">${icon("arrow-left")}</button>` : `<span class="iconbtn" aria-hidden="true" style="visibility:hidden">${icon("arrow-left")}</span>`}
      <span class="learn-crumb">${icon("graduation-cap")} ${esc(crumb)}</span>
      ${boardBtn()}<button class="iconbtn" data-act="learn-close" aria-label="Cerrar apuntes">${icon("x")}</button></header>`;
  }
  const block = (b, eq) => typeof b === "string" ? `<div class="para">${tex(b, { eq })}</div>`
    : b.graph ? `<figure>${graphHtml(b.graph, "fig-graph")}${b.caption ? `<figcaption>${tex(b.caption)}</figcaption>` : ""}</figure>`
    : b.svg ? `<figure>${b.svg}${b.caption ? `<figcaption>${tex(b.caption)}</figcaption>` : ""}</figure>`
    : b.viz ? `<figure>${vizHtml(b.viz)}${b.caption ? `<figcaption>${tex(b.caption)}</figcaption>` : ""}</figure>` : "";
  const lsec = (title, ic, inner, open) => inner
    ? `<details class="lsec" ${open ? "open" : ""}><summary>${icon(ic)}<span class="grow">${title}</span>${icon("chevron-right", "chev")}</summary><div class="lsec-body">${inner}</div></details>` : "";
  function cardHtml(card) {
    const c = course(card.course);
    const gu = c.units.find(u => u.id === card.group);
    const group = gu ? gu.title : "";
    // una sola numeración de fórmulas para toda la ficha
    const eq = { n: 0 };
    const blocks = arr => (arr && arr.length ? arr.map(b => block(b, eq)).join("") : "");
    const examples = (card.examples || []).map((ex, i) => `<div class="ex"><div class="ex-q"><b>Ejemplo ${i + 1}.</b> ${tex(ex.q, { eq })}</div>
      <details class="ex-sol"><summary>Ver resolución</summary><ol>${ex.steps.map(st => `<li>${tex(st, { eq })}</li>`).join("")}</ol></details></div>`).join("");
    const lessons = c.lessonList.filter(l => (l.theory || []).includes(card.id));
    const inSession = !!ui.session;
    const practice = inSession ? "" : (card.concepts || []).filter(k => c.concepts[k] && templatesFor(card.course, k).length).slice(0, 2)
      .map(k => `<button class="btn sm" data-act="learn-practice" data-cid="${card.course}" data-k="${k}">${icon("play")}Practicar: ${esc(c.concepts[k].name)}</button>`).join("");
    const lockedNote = !inSession && !practice && lessons.length ? `<p class="muted small" style="margin:0">Lo vas a practicar en la lección «${esc(lessons[0].title)}» cuando la desbloquees.</p>` : "";
    return `<div class="learn-inner">${learnHead("Apuntes · " + group)}
      <div class="learn-hero">${mascot("wow")}<div class="grow"><h1>${esc(card.title)}</h1><p class="muted">${tex(card.summary)}</p></div></div>
      ${lsec("Definición", "book-open", blocks(card.def), true)}
      ${lsec("La idea", "lightbulb", blocks(card.idea), true)}
      ${lsec("Demostración", "sigma", blocks(card.demo), false)}
      ${lsec((card.examples || []).length > 1 ? "Ejemplos resueltos" : "Ejemplo resuelto", "check", examples, true)}
      ${lsec("Errores comunes", "info", blocks(card.tips), false)}
      ${card.see && card.see.length ? `<div class="learn-see"><div class="muted small" style="font-weight:800">Ver también</div>${card.see.map(id => `<button class="chip-link" data-act="learn" data-id="${id}">${esc(cardOf(id).title)}</button>`).join("")}</div>` : ""}
      ${lessons.length ? `<div class="learn-see"><div class="muted small" style="font-weight:800">Aparece en</div>${lessons.map(l => `<button class="chip-link" data-act="learn" data-id="lesson:${l.id}">${icon("map")} ${esc(l.title)}</button>`).join("")}</div>` : ""}
      ${practice || lockedNote ? `<div class="learn-actions">${practice}${lockedNote}</div>` : ""}
    </div>`;
  }
  function lessonNotesHtml(lessonId) {
    let l, cid;
    for (const id of E.courseOrder) { const x = course(id).lessonList.find(y => y.id === lessonId); if (x) { l = x; cid = id; break; } }
    if (!l) return "";
    const canStart = !ui.session && lessonUnlocked(cid, l);
    return `<div class="learn-inner">${learnHead("Apuntes de la lección")}
      <div class="learn-hero">${mascot("think")}<div class="grow"><div class="ses-tag">Unidad ${l.unit.index + 1} · ${esc(l.unit.title)}</div><h1>${esc(l.title)}</h1></div></div>
      <div class="card"><div class="ses-tag">${icon("lightbulb")}En dos líneas</div><div class="para">${texL(l.intro || "")}</div></div>
      <h2 class="section-title">Leelos en este orden</h2>
      <div class="learn-list">${l.theory.map((id, i) => noteRow(id, i + 1)).join("")}</div>
      ${canStart ? `<div class="learn-actions"><button class="btn block" data-act="learn-lesson" data-cid="${cid}" data-id="${l.id}">${icon("play")}${lessonDone(cid, l) ? "Practicar la lección" : "Empezar la lección"}</button></div>` : ""}
    </div>`;
  }
  function noteRow(id, n) {
    const card = cardOf(id), read = !!S.read[id];
    return `<button class="note-row" data-act="learn" data-id="${id}" data-q="${esc(norm(card.title + " " + (card.aliases || []).join(" ") + " " + card.summary))}">
      <span class="note-n ${read ? "read" : ""}">${read ? icon("check") : n != null ? n : icon("book-open")}</span>
      <span class="grow"><b>${esc(card.title)}</b><span class="muted small" style="display:block">${tex(card.summary)}</span></span>${icon("chevron-right")}</button>`;
  }

  // ---------- backup ----------
  function exportData() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `efecen-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Backup descargado");
  }
  function importData(file) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!E.store.valid(data)) throw new Error("formato");

      ui.session.ans.v = e.target.value;
      $("#preview").textContent = previewText(e.target.value);
      updateCheck();
      if (ui.session.kind === "exam") examNavRefresh();
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id !== "learnSearch") return;
    const q = norm(e.target.value.trim());
    for (const row of $$("[data-q]")) row.hidden = !!q && !row.dataset.q.includes(q);
    for (const g of $$(".learn-group")) g.hidden = !$$("[data-q]", g).some(r => !r.hidden);
  });
  document.addEventListener("change", e => { if (e.target.id === "importFile" && e.target.files[0]) importData(e.target.files[0]); });
  document.addEventListener("keydown", e => {
    if (ui.learn) {
      if (e.key === "Escape") history.back();
      else if (e.key === "Enter" && e.target.classList.contains("term")) e.target.click();
      return;
    }
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("term")) { e.target.click(); return; }
    const s = ui.session;
    if (!s || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") {
      e.preventDefault();
      if (s.kind === "exam") { if (s.phase === "intro") examBegin(); else if (s.phase === "answer") check(); return; }
      if (!s.inst) { renderExercise(); return; }
      if (s.phase === "answer") check(); else next();
      return;
    }
    if (s.phase !== "answer" || e.target.id === "numin") return;
    const n = parseInt(e.key, 10);
    if (s.inst.type === "mc" && n >= 1 && n <= s.inst.options.length) { s.ans.v = n - 1; rerenderAnswer(); }
    else if (s.inst.type === "tf" && (n === 1 || n === 2)) { s.ans.v = n === 1; rerenderAnswer(); }
    else if (s.inst.type === "error" && n >= 1 && n <= s.inst.steps.length) { s.ans.v = n - 1; rerenderAnswer(); }
  });
  // tooltips del heatmap y barras
  let tipEl;
  document.addEventListener("pointerover", e => {
    const el = e.target.closest("[data-tip]");
    if (!el) { if (tipEl) tipEl.remove(), tipEl = null; return; }
    if (!tipEl) { tipEl = document.createElement("div"); tipEl.className = "tip"; document.body.appendChild(tipEl); }
    const r = el.getBoundingClientRect();
    tipEl.textContent = el.dataset.tip;
    tipEl.style.left = r.left + r.width / 2 + "px";
    tipEl.style.top = r.top + "px";
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawGraphs());

  // ---------- arranque ----------
  if (location.hash === "#/sesion") history.replaceState(null, "", "#/");
  fromHash();
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
  }
  // ayuda para desarrollo: efecenDebug.preview("der-cadena-mc", 42) abre esa plantilla
  window.efecenDebug = {
    get state() { return S; }, ui, mascot, learn: id => openLearn(id),
    preview(tpl, seed = E.newSeed(), cid = activeCourse()) { startSession({ kind: "practice", cid, title: "Vista previa", items: [{ tpl, seed, src: "lesson" }] }); }
  };
})();
</script>
